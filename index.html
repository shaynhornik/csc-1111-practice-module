"id": "u7-q021", "lesson": "u7-l2", "type": "mc", "difficulty": 3, "prompt": "A char array is defined as `char w[] = \"plum\";`. How many elements does w have, and what does w[4] hold?", "choices": ["4 elements; w[4] is out of range", "5 elements; w[4] holds 'm'", "5 elements; w[4] holds the null character", "4 elements; w[3] holds the null character"], "answer": 2, "explain": "The compiler sizes the array to include the null: p, l, u, m, then '\\0' at subscript 4."}, {"id": "u7-q022", "lesson": "u7-l3", "type": "output", "difficulty": 2, "prompt": "What does this print?", "code": "    int a[] = {4, 9, 2, 7};\n    int s = 0;\n    for (int i = 0; i < 4; i++)\n        s += a[i];\n    cout << s << \" \" << s / 4 << \" \" << s / 4.0;", "answer": "22 5 5.5", "explain": "The sum is 22. 22 / 4 is integer division and gives 5, while 22 / 4.0 is floating point and gives 5.5."}, {"id": "u7-q023", "lesson": "u7-l3", "type": "output", "difficulty": 2, "prompt": "What does this print?", "code": "    int a[] = {12, 40, 7, 40, 25};\n    int hi = a[0], pos = 0;\n    for (int i = 1; i < 5; i++)\n        if (a[i] > hi) {\n            hi = a[i];\n            pos = i;\n        }\n    cout << hi << \" \" << pos;", "answer": "40 1", "explain": "The first 40 (subscript 1) replaces 12. The later 40 is not greater than hi, so pos stays at 1."}, {"id": "u7-q024", "lesson": "u7-l3", "type": "output", "difficulty": 3, "prompt": "What does this print? (Note the operator.)", "code": "    int a[] = {12, 40, 7, 40, 25};\n    int hi = a[0], pos = 0;\n    for (int i = 1; i < 5; i++)\n        if (a[i] >= hi) {\n            hi = a[i];\n            pos = i;\n        }\n    cout << hi << \" \" << pos;", "answer": "40 3", "explain": "With >= the second 40 also passes the test and overwrites pos, so the last maximum wins."}, {"id": "u7-q025", "lesson": "u7-l3", "type": "mc", "difficulty": 2, "prompt": "Two int arrays of the same size, a and b, hold identical values. What does `if (a == b)` do?", "choices": ["It compares every element and is true", "It is a compile error", "It compares only the first elements", "It compares the addresses of the arrays, so it is false"], "answer": 3, "explain": "An array name used this way stands for the array's starting address. Two different arrays have different addresses, so the test is false (g++ even warns about comparing two arrays). Compare element by element in a loop."}, {"id": "u7-q026", "lesson": "u7-l3", "type": "output", "difficulty": 3, "prompt": "What does this print?", "code": "    int a[5] = {1, 2, 3, 4, 5};\n    for (int i = 1; i < 5; i++)\n        a[i] = a[i - 1];\n    for (int i = 0; i < 5; i++)\n        cout << a[i] << ' ';", "answer": "1 1 1 1 1", "explain": "Each assignment reads the element just written, so the value 1 spreads to the end."}, {"id": "u7-q027", "lesson": "u7-l3", "type": "mc", "difficulty": 2, "prompt": "Which code correctly copies the 8-element int array src into the 8-element int array dst?", "choices": ["for (int i = 0; i < 8; i++) dst[i] = src[i];", "dst = src;", "dst[8] = src[8];", "for (int i = 0; i <= 8; i++) dst[i] = src[i];"], "answer": 0, "explain": "Arrays cannot be assigned with =. A loop over subscripts 0 to 7 copies each element; <= 8 runs one past the end."}, {"id": "u7-q028", "lesson": "u7-l3", "type": "output", "difficulty": 2, "prompt": "What does this print?", "code": "    int d[8];\n    int count = 0;\n    d[count++] = 6;\n    d[count++] = 2;\n    d[count++] = 9;\n    int s = 0;\n    for (int i = 0; i < count; i++)\n        s += d[i];\n    cout << count << \" \" << s;", "answer": "3 17", "explain": "Each `d[count++] = value;` stores at subscript count and then adds 1 to count. Three values were stored, so count is 3 and only d[0] to d[2] are summed: 6 + 2 + 9 = 17."}, {"id": "u7-q029", "lesson": "u7-l3", "type": "fill", "difficulty": 1, "prompt": "An array that is defined large enough for the maximum but currently holds fewer values, with a separate counter, is called a ________ filled array.", "answer": "partially", "accept": ["partially", "partly"], "explain": "A partially filled array is paired with a variable that tells how many elements are really in use."}, {"id": "u7-q030", "lesson": "u7-l3", "type": "mc", "difficulty": 3, "prompt": "All the values in the int array vals are positive. A student finds the smallest value with `int lo = 0;` and then `if (vals[i] < lo) lo = vals[i];` inside a loop over the array. What is the result?", "choices": ["It correctly finds the smallest value", "lo stays 0, which is wrong, because 0 is smaller than every element", "It finds the largest value", "It finds the smallest value except the first element"], "answer": 1, "explain": "Initialize the running minimum to the first element, vals[0], so it starts as a value that is really in the array."}, {"id": "u7-q031", "lesson": "u7-l3", "type": "output", "difficulty": 2, "prompt": "What does this print?", "code": "    int a[] = {1, 2, 3, 4};\n    int b[] = {1, 9, 3, 0};\n    int diff = 0;\n    for (int i = 0; i < 4; i++)\n        if (a[i] != b[i])\n            diff++;\n    cout << diff;", "answer": "2", "explain": "Element-by-element comparison finds differences at subscripts 1 and 3."}, {"id": "u7-q032", "lesson": "u7-l3", "type": "mc", "difficulty": 2, "prompt": "An array r of 100 ints currently holds 37 valid readings, and count is 37. Which loop displays only the valid readings?", "choices": ["for (int i = 0; i < 100; i++) cout << r[i] << ' ';", "for (int i = 0; i <= count; i++) cout << r[i] << ' ';", "for (int i = 0; i < count; i++) cout << r[i] << ' ';", "for (int i = 1; i < count; i++) cout << r[i] << ' ';"], "answer": 2, "explain": "Valid elements are subscripts 0 to count-1, so the test is i < count. Running to 100 shows unused slots; <= count shows one extra; starting at 1 skips the first."}, {"id": "u7-q033", "lesson": "u7-l4", "type": "output", "difficulty": 2, "prompt": "What does this print?", "code": "    string name[] = {\"Ana\", \"Bo\", \"Cy\"};\n    int pts[] = {70, 95, 88};\n    int best = 0;\n    for (int i = 1; i < 3; i++)\n        if (pts[i] > pts[best])\n            best = i;\n    cout << name[best] << \" \" << pts[best];", "answer": "Bo 95", "explain": "best holds a subscript. pts[1] = 95 is the largest, so name[1] = Bo is printed with it."}, {"id": "u7-q034", "lesson": "u7-l4", "type": "mc", "difficulty": 1, "prompt": "Which best describes parallel arrays?", "choices": ["Two arrays that must have the same data type", "An array with two subscripts", "Arrays stored next to each other in memory", "Two or more arrays whose elements with the same subscript hold related data"], "answer": 3, "explain": "The link between parallel arrays is the shared subscript. They may have different types (for example string and int)."}, {"id": "u7-q035", "lesson": "u7-l4", "type": "tf", "difficulty": 1, "prompt": "Parallel arrays must all have the same data type.", "answer": false, "explain": "They are related by subscript, not by type. A names array of string and a scores array of int is the normal case."}, {"id": "u7-q036", "lesson": "u7-l4", "type": "output", "difficulty": 3, "prompt": "What does this print?", "code": "    int id[] = {101, 205, 309, 412};\n    double price[] = {2.5, 4.0, 6.25, 9.0};\n    int want = 309, found = -1;\n    for (int i = 0; i < 4; i++)\n        if (id[i] == want)\n            found = i;\n    cout << found << \" \" << price[found];", "answer": "2 6.25", "explain": "The id 309 is at subscript 2, and the same subscript in price holds 6.25."}, {"id": "u7-q037", "lesson": "u7-l4", "type": "mc", "difficulty": 3, "prompt": "The arrays item and cost are parallel. A program swaps item[0] and item[1] but does nothing to cost. What is the effect?", "choices": ["Two items now show the wrong cost", "Nothing, because the arrays are independent", "The program will not compile", "cost is swapped automatically"], "answer": 0, "explain": "C++ does not know the arrays are linked. Any reordering must be repeated in every parallel array or the pairs are scrambled."}, {"id": "u7-q038", "lesson": "u7-l4", "type": "fill", "difficulty": 1, "prompt": "Parallel arrays are linked by using the same ________ in each array.", "answer": "subscript", "accept": ["subscript", "index", "subscript value"], "explain": "Element k of every parallel array describes the same item."}, {"id": "u7-q039", "lesson": "u7-l5", "type": "mc", "difficulty": 1, "prompt": "When an array name is used as a function argument, what does the function receive?", "choices": ["A copy of every element", "The memory address of the first element", "A copy of the first element only", "The number of elements"], "answer": 1, "explain": "The array is not copied. The function works on the caller's own elements."}, {"id": "u7-q040", "lesson": "u7-l5", "type": "tf", "difficulty": 1, "prompt": "Arrays are passed to functions by value, so the function always works on its own copy.", "answer": false, "explain": "The address is passed, so changes made through the parameter change the caller's array."}, {"id": "u7-q041", "lesson": "u7-l5", "type": "output", "difficulty": 2, "prompt": "What does this print?", "code": "void bump(int a[], int n)\n{\n    for (int i = 0; i < n; i++)\n        a[i] += 10;\n}\nint main()\n{\n    int v[3] = {1, 2, 3};\n    bump(v, 3);\n    cout << v[0] << \" \" << v[1] << \" \" << v[2];\n    return 0;\n}", "answer": "11 12 13", "explain": "bump receives the address of v, so adding 10 to each a[i] changes v itself."}, {"id": "u7-q042", "lesson": "u7-l5", "type": "mc", "difficulty": 2, "prompt": "Which is a correct header for a function that only reads an int array and also receives the number of elements?", "choices": ["void show(int a[], n)", "void show(const int a, int n)", "void show(const int a[], int n)", "void show(int[] a, int n)"], "answer": 2, "explain": "An array parameter is written type name[] and const protects the contents. The size is a separate, fully typed parameter."}, {"id": "u7-q043", "lesson": "u7-l5", "type": "mc", "difficulty": 2, "prompt": "What happens when this function is compiled?", "choices": ["It compiles and sets the caller's first element to 0", "It compiles and sets only a local copy", "It compiles but warns at run time", "Compile error: the const array parameter cannot be modified"], "answer": 3, "explain": "A const array parameter makes every element read-only inside the function.", "code": "void clear(const int a[], int n)\n{\n    a[0] = 0;\n}"}, {"id": "u7-q044", "lesson": "u7-l5", "type": "tf", "difficulty": 2, "prompt": "A function that receives an array parameter can find out the array's size by itself, so the size need not be passed.", "answer": false, "explain": "The parameter is only an address. The function has no way to know how many elements follow, so the size is passed separately."}, {"id": "u7-q045", "lesson": "u7-l5", "type": "output", "difficulty": 3, "prompt": "What does this print?", "code": "void setOne(int x) { x = 99; }\nvoid setAll(int a[]) { a[0] = 77; }\nint main()\n{\n    int v[2] = {1, 2};\n    setOne(v[0]);\n    cout << v[0] << \" \";\n    setAll(v);\n    cout << v[0];\n    return 0;\n}", "answer": "1 77", "explain": "setOne gets a copy of the element, so v[0] stays 1. setAll gets the array's address, so it changes v[0] to 77."}, {"id": "u7-q046", "lesson": "u7-l5", "type": "output", "difficulty": 2, "prompt": "What does this print?", "code": "int total(const int a[], int n)\n{\n    int t = 0;\n    for (int i = 0; i < n; i++)\n        t += a[i];\n    return t;\n}\nint main()\n{\n    int w[] = {5, 10, 15, 20};\n    cout << total(w, 3);\n    return 0;\n}", "answer": "30", "explain": "Only the first three elements are added because the size argument is 3: 5 + 10 + 15 = 30."}, {"id": "u7-q047", "lesson": "u7-l5", "type": "fill", "difficulty": 1, "prompt": "Which keyword placed before an array parameter's type prevents the function from changing the array?", "answer": "const", "accept": ["const"], "explain": "A const array parameter turns any attempt to modify the elements into a compile error."}, {"id": "u7-q048", "lesson": "u7-l5", "type": "tf", "difficulty": 3, "prompt": "Inside a function that received an array through the parameter `int a[]`, a range-based for loop over a is allowed.", "answer": false, "explain": "The function only has an address, not the array's size, so the range-based for loop (and a structured binding) will not compile on the parameter."}, {"id": "u7-q049", "lesson": "u7-l5", "type": "output", "difficulty": 3, "prompt": "What does this print?", "code": "void flip(int a[], int n)\n{\n    for (int i = 0; i < n / 2; i++) {\n        int t = a[i];\n        a[i] = a[n - 1 - i];\n        a[n - 1 - i] = t;\n    }\n}\nint main()\n{\n    int v[5] = {1, 2, 3, 4, 5};\n    flip(v, 5);\n    for (int i = 0; i < 5; i++)\n        cout << v[i] << ' ';\n    return 0;\n}", "answer": "5 4 3 2 1", "explain": "The function swaps a[0] with a[4] and a[1] with a[3]; the middle element stays. It changes the caller's array."}, {"id": "u7-q050", "lesson": "u7-l6", "type": "mc", "difficulty": 1, "prompt": "How many elements does `int grid[3][4];` have?", "choices": ["7", "12", "3", "4"], "answer": 1, "explain": "A two-dimensional array has rows times columns elements: 3 x 4 = 12."}, {"id": "u7-q051", "lesson": "u7-l6", "type": "mc", "difficulty": 2, "prompt": "In the statement `table[2][5] = 8;` what do the subscripts mean?", "choices": ["Column 2, row 5", "Row 5, column 2", "Row 2, column 5", "Two elements, 2 and 5"], "answer": 2, "explain": "The first subscript is the row and the second is the column."}, {"id": "u7-q052", "lesson": "u7-l6", "type": "output", "difficulty": 2, "prompt": "What does this print?", "code": "    int t[2][3];\n    for (int r = 0; r < 2; r++)\n        for (int c = 0; c < 3; c++)\n            t[r][c] = r * 3 + c;\n    cout << t[1][2] << \" \" << t[0][1];", "answer": "5 1", "explain": "t[1][2] = 1*3 + 2 = 5 and t[0][1] = 0*3 + 1 = 1."}, {"id": "u7-q053", "lesson": "u7-l6", "type": "output", "difficulty": 2, "prompt": "What does this print?", "code": "    int m[2][3] = {{1, 2, 3}, {4, 5, 6}};\n    for (int r = 0; r < 2; r++) {\n        int s = 0;\n        for (int c = 0; c < 3; c++)\n            s += m[r][c];\n        cout << s << ' ';\n    }", "answer": "6 15", "explain": "Each pass of the outer loop totals one row: 1+2+3 = 6 and 4+5+6 = 15."}, {"id": "u7-q054", "lesson": "u7-l6", "type": "tf", "difficulty": 2, "prompt": "The definition `int m[2][3] = {1, 2, 3, 4, 5, 6};` is valid and fills the array row by row.", "answer": true, "explain": "A flat list fills the elements in row order, so m[0] is 1 2 3 and m[1] is 4 5 6."}, {"id": "u7-q055", "lesson": "u7-l6", "type": "mc", "difficulty": 3, "prompt": "What is the value of a[0][1] after this definition?", "choices": ["1", "2", "3", "0"], "answer": 3, "explain": "Each inner list initializes one row, and unlisted elements are set to 0. Row 0 is {1, 0}.", "code": "int a[2][2] = {{1}, {2, 3}};"}, {"id": "u7-q056", "lesson": "u7-l6", "type": "mc", "difficulty": 3, "prompt": "Which is a valid prototype for a function that receives a table with 4 columns and any number of rows?", "choices": ["void show(int t[][4], int rows);", "void show(int t[][], int rows);", "void show(int t[4][], int rows);", "void show(int t[], int rows, 4);"], "answer": 0, "explain": "For a multi-dimensional array parameter every dimension except the first must be given its size."}, {"id": "u7-q057", "lesson": "u7-l6", "type": "tf", "difficulty": 1, "prompt": "C++ allows arrays with three or more dimensions.", "answer": true, "explain": "Each extra dimension adds another subscript, for example int cube[2][3][4]."}, {"id": "u7-q058", "lesson": "u7-l7", "type": "mc", "difficulty": 1, "prompt": "Which header must be included to define a vector?", "choices": ["<array>", "<vector>", "<iostream>", "<list>"], "answer": 1, "explain": "The vector class template is declared in <vector>."}, {"id": "u7-q059", "lesson": "u7-l7", "type": "mc", "difficulty": 2, "prompt": "What does `vector<int> v(5);` create?", "choices": ["An empty vector that can later hold 5 values", "A vector with one element holding 5", "A vector with 5 elements, all 0", "A vector with 5 uninitialized elements"], "answer": 2, "explain": "A number in parentheses sets the starting size, and the elements are value-initialized to 0."}, {"id": "u7-q060", "lesson": "u7-l7", "type": "output", "difficulty": 2, "prompt": "What does this print?", "code": "    vector<int> v;\n    v.push_back(4);\n    v.push_back(9);\n    v.push_back(1);\n    cout << v.size() << \" \" << v[1] << \" \" << v.at(2);", "answer": "3 9 1", "explain": "Three push_back calls give size 3. Subscript 1 holds 9 and at(2) returns the third element, 1."}, {"id": "u7-q061", "lesson": "u7-l7", "type": "output", "difficulty": 2, "prompt": "What does this print?", "code": "    vector<int> v = {1, 2, 3};\n    for (int &x : v)\n        x = x * x;\n    for (int x : v)\n        cout << x << ' ';", "answer": "1 4 9", "explain": "The reference loop variable squares each element in place."}, {"id": "u7-q062", "lesson": "u7-l7", "type": "mc", "difficulty": 3, "prompt": "What is wrong with this code?", "choices": ["A vector cannot hold ints", "There is no error; v grows to hold the 5", "push_back must be called with no arguments", "v has no elements, so v[0] is invalid; push_back should be used"], "answer": 3, "explain": "A vector defined with no size is empty. Subscripts only reach existing elements; push_back is how a new one is added.", "code": "vector<int> v;\nv[0] = 5;"}, {"id": "u7-q063", "lesson": "u7-l7", "type": "tf", "difficulty": 2, "prompt": "The at member function checks the subscript and signals an error for an invalid one, while the [] operator does not check.", "answer": true, "explain": "v.at(i) throws an exception if i is out of range. v[i] does no checking, like an array."}, {"id": "u7-q064", "lesson": "u7-l7", "type": "fill", "difficulty": 1, "prompt": "Given `vector<int> v = {4, 5, 6};`, you want v to become {4, 5, 6, 9} without knowing its size in advance. Which member function (name only) appends the 9?", "answer": "push_back", "accept": ["push_back", "push_back()", "v.push_back"], "explain": "push_back(value) creates a new last element holding value, growing the size by one."}, {"id": "u7-q065", "lesson": "u7-l7", "type": "tf", "difficulty": 1, "prompt": "Unlike an array, a vector can change its size while the program is running.", "answer": true, "explain": "Members such as push_back, pop_back and resize change the number of elements."}, {"id": "u7-q066", "lesson": "u7-l1", "type": "mc", "difficulty": 1, "prompt": "On a system where an int uses 4 bytes, how much memory does `int values[10];` use?", "choices": ["40 bytes", "10 bytes", "14 bytes", "44 bytes"], "answer": 0, "explain": "An array's memory is the number of elements times the size of one element: 10 x 4 = 40 bytes. The size declarator counts elements, not bytes."}, {"id": "u7-q067", "lesson": "u7-l1", "type": "mc", "difficulty": 1, "prompt": "What is wrong with the definition `int counts[-5];`?", "choices": ["Nothing; it creates 5 elements with subscripts -1 to -5", "The size declarator must be greater than zero", "An int array must have an initialization list", "Array names cannot contain lowercase letters"], "answer": 1, "explain": "The declared size has to be a positive whole-number constant. A negative size does not compile, and subscripts always run from 0 to size - 1."}, {"id": "u7-q068", "lesson": "u7-l1", "type": "fill", "difficulty": 1, "prompt": "A loop such as `for (int i = 1; i <= SIZE; i++) nums[i] = 0;` skips element 0 and writes one element past the end. This common mistake is called a(n) ____ error.", "answer": "off-by-one", "accept": ["off-by-one", "off by one", "off-by-one error", "off by one error"], "explain": "Subscripts run from 0 to SIZE - 1, so the correct loop is `for (int i = 0; i < SIZE; i++)`. C++ does no bounds checking, so the extra write is not caught."}, {"id": "u7-q069", "lesson": "u7-l2", "type": "tf", "difficulty": 2, "prompt": "An int array defined globally (outside all functions) with no initialization list has every element set to 0.", "answer": true, "explain": "Global arrays, like global variables, are zero-initialized automatically. A local array with no initialization list holds garbage."}, {"id": "u7-q070", "lesson": "u7-l2", "type": "output", "difficulty": 2, "prompt": "What does this print?", "code": "    string colors[4] = {\"red\", \"blue\"};\n    for (int i = 0; i < 4; i++)\n        cout << \"[\" << colors[i] << \"]\";", "answer": "[red][blue][][]", "explain": "In a partially initialized string array the elements without a value become empty strings, not \"0\" and not garbage."}, {"id": "u7-q071", "lesson": "u7-l2", "type": "mc", "difficulty": 2, "prompt": "Which array definition is legal?", "choices": ["int hours[3] = 8, 12, 16;", "int nums[6] = {2, 4, , 8};", "double rates[];", "double rates[] = {1.5, 2.5};"], "answer": 3, "explain": "An initialization list needs braces and cannot skip elements. An array with no size declarator needs an initialization list so the compiler can count it; with one, rates gets 2 elements."}, {"id": "u7-q072", "lesson": "u7-l2", "type": "fill", "difficulty": 1, "prompt": "In the loop `for (int v : scores)`, the variable v, which receives each element of scores in turn, is called the ____ variable.", "answer": "range", "accept": ["range", "range variable"], "explain": "The range variable gets a copy of element 0, then element 1, and so on. Declare it as a reference (`int &v`) if the loop must change the elements."}, {"id": "u7-q073", "lesson": "u7-l2", "type": "mc", "difficulty": 2, "prompt": "A range-based for loop gives you each element but never its subscript. Which task needs the subscripts, so a regular counting for loop should be used?", "choices": ["Copying each element of array a into the same position of array b", "Adding up all the elements of an array", "Displaying every element of an array", "Doubling every element of an array in place"], "answer": 0, "explain": "To store into b[i] you need i. Summing and displaying only need the values, and doubling in place works with a reference range variable (`for (int &x : a) x *= 2;`)."}, {"id": "u7-q074", "lesson": "u7-l3", "type": "mc", "difficulty": 2, "prompt": "scores is an int array of 5 elements. What does `cout << scores << endl;` display?", "choices": ["All five elements separated by spaces", "Only the first element", "The array's beginning memory address", "Nothing; it is a compile error"], "answer": 2, "explain": "An array name without brackets stands for the array's starting address, so cout prints an address. Use a loop to display the elements. (A char array holding a C-string is the exception: cout prints its characters.)"}, {"id": "u7-q075", "lesson": "u7-l3", "type": "output", "difficulty": 3, "prompt": "What does this print?", "code": "    int a[] = {5, 8, 2};\n    int k = 1;\n    a[k]--;\n    cout << a[1] << \" \" << k << endl;\n    int v = a[k--];\n    cout << v << \" \" << k << \" \" << a[1] << endl;\n    cout << ++a[2] << endl;", "answer": "7 1\n7 0 7\n3", "explain": "`a[k]--` decrements the element (8 to 7). `a[k--]` reads a[1] and then decrements k, leaving the array alone. `++a[2]` increments the element before it is printed."}, {"id": "u7-q076", "lesson": "u7-l3", "type": "output", "difficulty": 3, "prompt": "The code is meant to total each array separately. What does it print?", "code": "    int first[3] = {1, 2, 3};\n    int second[3] = {10, 20, 30};\n    int total = 0;\n    for (int i = 0; i < 3; i++)\n        total += first[i];\n    cout << \"First: \" << total << endl;\n    for (int i = 0; i < 3; i++)\n        total += second[i];\n    cout << \"Second: \" << total << endl;", "answer": "First: 6\nSecond: 66", "explain": "total is never set back to 0, so the second figure also includes the first array's 6. Reset the accumulator (`total = 0;`) before summing the second array."}, {"id": "u7-q077", "lesson": "u7-l3", "type": "output", "difficulty": 2, "prompt": "The user types 4 7 1 -1. What does this print?", "code": "    const int SIZE = 5;\n    int nums[SIZE];\n    int count = 0;\n    int n;\n    cin >> n;\n    while (n != -1 && count < SIZE)\n    {\n        nums[count] = n;\n        count++;\n        cin >> n;\n    }\n    for (int i = count - 1; i >= 0; i--)\n        cout << nums[i] << \" \";\n    cout << endl << count << endl;", "answer": "1 7 4\n3", "explain": "-1 is the sentinel and is not stored, so the partially filled array holds 3 values and count is 3. The second loop walks only the used elements, from subscript 2 down to 0."}, {"id": "u7-q078", "lesson": "u7-l3", "type": "mc", "difficulty": 2, "prompt": "A program fills `int data[50];` from the keyboard with `while (cin >> v && v != -1) { data[count] = v; count++; }`, where count starts at 0. What is wrong?", "choices": ["Nothing stops count from reaching 50, so a 51st value would be stored past the end of the array", "count should start at 1", "The -1 sentinel is stored in the array", "cin cannot be used inside a loop condition"], "answer": 0, "explain": "A loop that fills a partially filled array must also test `count < 50`. C++ does no bounds checking, so extra input would overwrite memory beyond the array. The -1 is not stored, because the test fails before the body runs."}, {"id": "u7-q079", "lesson": "u7-l3", "type": "output", "difficulty": 2, "prompt": "What does this print?", "code": "    int ids[] = {42, 17, 88, 17, 63};\n    int target = 17;\n    int pos = -1;\n    int i = 0;\n    while (i < 5 && pos == -1)\n    {\n        if (ids[i] == target)\n            pos = i;\n        i++;\n    }\n    cout << pos << \" \" << i << endl;", "answer": "1 2", "explain": "The search stops as soon as it finds the first 17, at subscript 1; i had already been incremented to 2 at the end of that pass. The second 17 is never examined."}, {"id": "u7-q080", "lesson": "u7-l4", "type": "output", "difficulty": 2, "prompt": "What does this print?", "code": "    string name[4] = {\"Ana\", \"Bo\", \"Cy\", \"Dee\"};\n    int grade[4] = {93, 78, 90, 85};\n    for (int i = 0; i < 4; i++)\n        if (grade[i] >= 90)\n            cout << name[i] << \" \" << grade[i] << endl;", "answer": "Ana 93\nCy 90", "explain": "One subscript walks both parallel arrays, so each name is printed beside its own grade. Only subscripts 0 and 2 pass the test."}, {"id": "u7-q081", "lesson": "u7-l5", "type": "mc", "difficulty": 1, "prompt": "scores is an int array of 10 elements. Which statement correctly passes it to `void show(const int a[], int n)`?", "choices": ["show(scores[], 10);", "show(scores, 10);", "show(scores[10], 10);", "show(int scores[], 10);"], "answer": 1, "explain": "Pass the array name alone. `scores[10]` would be one (nonexistent) element, and brackets or types do not belong in a call."}, {"id": "u7-q082", "lesson": "u7-l5", "type": "tf", "difficulty": 1, "prompt": "When you write a parameter that will receive a one-dimensional array, you may leave the brackets empty, as in `int a[]`.", "answer": true, "explain": "The parameter receives only the array's address, so no size declarator is needed. The number of elements is passed as a separate argument."}, {"id": "u7-q083", "lesson": "u7-l5", "type": "fill", "difficulty": 2, "prompt": "Write the prototype for a function named average that returns a double and receives a const int array and an int size. Leave out the parameter names.", "answer": "double average(const int[], int);", "accept": ["double average(const int[], int);", "double average(const int a[], int n);", "double average(const int arr[], int size);"], "explain": "An array parameter in a prototype is written as the type followed by empty brackets. const promises the function will not change the array."}, {"id": "u7-q084", "lesson": "u7-l5", "type": "output", "difficulty": 2, "prompt": "What does this print?", "code": "int countAbove(const int a[], int n, int limit)\n{\n    int c = 0;\n    for (int i = 0; i < n; i++)\n        if (a[i] > limit)\n            c++;\n    return c;\n}\nint main()\n{\n    int t[6] = {55, 72, 90, 60, 72, 81};\n    cout << countAbove(t, 6, 72) << \" \" << countAbove(t, 3, 50) << endl;\n    return 0;\n}", "answer": "2 3", "explain": "Strictly greater than 72 leaves out both 72s, so only 90 and 81 count. The second call looks at only the first 3 elements because n is 3, and all of them exceed 50."}, {"id": "u7-q085", "lesson": "u7-l5", "type": "output", "difficulty": 2, "prompt": "What does this print?", "code": "bool sameCode(const int a[], const int b[], int size)\n{\n    for (int i = 0; i < size; i++)\n        if (a[i] != b[i])\n            return false;\n    return true;\n}\nint main()\n{\n    int entered[4] = {3, 1, 4, 1};\n    int stored[4] = {3, 1, 4, 2};\n    cout << sameCode(entered, stored, 4) << \" \";\n    cout << sameCode(entered, stored, 3) << endl;\n    return 0;\n}", "answer": "0 1", "explain": "The function returns false at the first position that differs and returns true only after checking every position. The arrays differ at subscript 3, which the second call never examines. bool prints as 0 or 1."}, {"id": "u7-q086", "lesson": "u7-l5", "type": "output", "difficulty": 3, "prompt": "What does this print?", "code": "double total(const double s[], int n)\n{\n    double t = 0;\n    for (int i = 0; i < n; i++)\n        t += s[i];\n    return t;\n}\ndouble lowest(const double s[], int n)\n{\n    double lo = s[0];\n    for (int i = 1; i < n; i++)\n        if (s[i] < lo)\n            lo = s[i];\n    return lo;\n}\nint main()\n{\n    double scores[4] = {80, 65, 90, 95};\n    double avg = (total(scores, 4) - lowest(scores, 4)) / 3;\n    cout << avg << endl;\n    return 0;\n}", "answer": "88.3333", "explain": "The total is 330 and the lowest score is 65. Dropping it leaves 265 over 3 scores, 88.333..., which cout shows with its default 6 significant digits as 88.3333."}, {"id": "u7-q087", "lesson": "u7-l7", "type": "output", "difficulty": 2, "prompt": "What does this print?", "code": "    vector<int> v = {3, 6, 9};\n    v.pop_back();\n    v.push_back(4);\n    cout << v.size() << \" \" << v[2] << endl;\n    v.clear();\n    cout << v.size() << \" \" << v.empty() << endl;", "answer": "3 4\n0 1", "explain": "pop_back removes the 9 and push_back adds 4 at the end, so v is 3 6 4. clear removes every element, leaving size 0, and empty returns true, which prints as 1."}, {"id": "u7-q088", "lesson": "u7-l7", "type": "tf", "difficulty": 2, "prompt": "A vector, one of the data types in the Standard Template Library (STL), is an associative container.", "answer": false, "explain": "The STL's two kinds of containers are sequence containers, which keep elements in order like an array, and associative containers, which find elements by key. vector is a sequence container."}, {"id": "u7-q089", "lesson": "u7-l2", "type": "mc", "difficulty": 3, "prompt": "What is the problem with this code?", "code": "char word[] = {'H', 'i'};\ncout << word;", "choices": ["word has no null terminator, so cout keeps printing past the end of the array", "Nothing; it prints Hi", "A char array cannot be initialized with a list of single characters", "cout cannot display a char array"], "answer": 0, "explain": "cout displays a char array up to the '\\0' that ends a C-string. A list of single characters adds no '\\0', so the output runs into whatever memory follows (undefined behavior). `char word[] = \"Hi\";` would add the null character."}, {"id": "u7-q090", "lesson": "u7-l2", "type": "fill", "difficulty": 1, "prompt": "In `int a[4] = {2, 4, 6, 8};` the values in braces are called the array's ____ list.", "answer": "initialization", "accept": ["initialization", "initialization list", "initializer", "initializer list"], "explain": "The initialization list stores its values in the elements in order, starting at subscript 0. It can be shorter than the array (the rest become 0) but never longer."}], "programs": [{"id": "u7-p1", "title": "Array statistics", "task": "Read an integer n (1 to 20), then read n integers into an array. Using loops, display the sum, the average to 2 decimal places, the highest value and the subscript where it first appears, the lowest value and the subscript where it first appears, and how many values are above the average. Use the exact labels shown in the sample output.", "stdin": "8\n14 7 22 9 22 3 18 11\n", "solution": "#include <iostream>\n#include <iomanip>\n#include <string>\n#include <vector>\nusing namespace std;\n\nint main()\n{\n    const int MAX = 20;\n    int a[MAX];\n    int n;\n    cin >> n;\n    for (int i = 0; i < n; i++)\n        cin >> a[i];\n\n    int sum = 0, hi = a[0], hiPos = 0, lo = a[0], loPos = 0;\n    for (int i = 0; i < n; i++) {\n        sum += a[i];\n        if (a[i] > hi) { hi = a[i]; hiPos = i; }\n        if (a[i] < lo) { lo = a[i]; loPos = i; }\n    }\n    double avg = static_cast<double>(sum) / n;\n    int above = 0;\n    for (int i = 0; i < n; i++)\n        if (a[i] > avg)\n            above++;\n\n    cout << fixed << setprecision(2);\n    cout << \"Sum: \" << sum << endl;\n    cout << \"Average: \" << avg << endl;\n    cout << \"Highest: \" << hi << \" at \" << hiPos << endl;\n    cout << \"Lowest: \" << lo << \" at \" << loPos << endl;\n    cout << \"Above average: \" << above << endl;\n    return 0;\n}\n", "sampleOutput": "Sum: 106\nAverage: 13.25\nHighest: 22 at 2\nLowest: 3 at 5\nAbove average: 4"}, {"id": "u7-p2", "title": "Parallel arrays: best student", "task": "Read an integer n (1 to 10), then n pairs, each a one-word name followed by an integer score, into two parallel arrays. Display each student as 'name: score', then display the name and score of the student with the highest score, then the number of students who scored 80 or more. Assume no ties for the highest score.", "stdin": "5\nAna 72\nBo 95\nCy 88\nDee 64\nEli 80\n", "solution": "#include <iostream>\n#include <iomanip>\n#include <string>\n#include <vector>\nusing namespace std;\n\nint main()\n{\n    const int MAX = 10;\n    string name[MAX];\n    int score[MAX];\n    int n;\n    cin >> n;\n    for (int i = 0; i < n; i++)\n        cin >> name[i] >> score[i];\n\n    int best = 0, passing = 0;\n    for (int i = 0; i < n; i++) {\n        cout << name[i] << \": \" << score[i] << endl;\n        if (score[i] > score[best])\n            best = i;\n        if (score[i] >= 80)\n            passing++;\n    }\n    cout << \"Top: \" << name[best] << \" \" << score[best] << endl;\n    cout << \"At least 80: \" << passing << endl;\n    return 0;\n}\n", "sampleOutput": "Ana: 72\nBo: 95\nCy: 88\nDee: 64\nEli: 80\nTop: Bo 95\nAt least 80: 3"}, {"id": "u7-p3", "title": "Array functions: reverse and count evens", "task": "Write two functions. countEven(const int a[], int n) returns how many elements are even. reverseArray(int a[], int n) reverses the array in place. In main, read 6 integers into an array, display the count of even values, call reverseArray, then display the reversed array with the values separated by single spaces.", "stdin": "3 8 5 12 7 4\n", "solution": "#include <iostream>\n#include <iomanip>\n#include <string>\n#include <vector>\nusing namespace std;\n\nint countEven(const int a[], int n)\n{\n    int c = 0;\n    for (int i = 0; i < n; i++)\n        if (a[i] % 2 == 0)\n            c++;\n    return c;\n}\n\nvoid reverseArray(int a[], int n)\n{\n    for (int i = 0; i < n / 2; i++) {\n        int t = a[i];\n        a[i] = a[n - 1 - i];\n        a[n - 1 - i] = t;\n    }\n}\n\nint main()\n{\n    const int SIZE = 6;\n    int v[SIZE];\n    for (int i = 0; i < SIZE; i++)\n        cin >> v[i];\n    cout << \"Even values: \" << countEven(v, SIZE) << endl;\n    reverseArray(v, SIZE);\n    cout << \"Reversed:\";\n    for (int i = 0; i < SIZE; i++)\n        cout << \" \" << v[i];\n    cout << endl;\n    return 0;\n}\n", "sampleOutput": "Even values: 3\nReversed: 4 7 12 5 8 3"}, {"id": "u7-p4", "title": "Two-dimensional array: row and column totals", "task": "Read a table of weekly sales for 3 stores (rows) over 4 weeks (columns) into a 3 by 4 int array, row by row. Display the total for each store as 'Store k: total' (k starting at 1), then the total for each week as 'Week k: total', using nested loops.", "stdin": "10 20 30 40\n5 15 25 35\n7 7 7 7\n", "solution": "#include <iostream>\n#include <iomanip>\n#include <string>\n#include <vector>\nusing namespace std;\n\nint main()\n{\n    const int ROWS = 3, COLS = 4;\n    int sales[ROWS][COLS];\n    for (int r = 0; r < ROWS; r++)\n        for (int c = 0; c < COLS; c++)\n            cin >> sales[r][c];\n\n    for (int r = 0; r < ROWS; r++) {\n        int total = 0;\n        for (int c = 0; c < COLS; c++)\n            total += sales[r][c];\n        cout << \"Store \" << r + 1 << \": \" << total << endl;\n    }\n    for (int c = 0; c < COLS; c++) {\n        int total = 0;\n        for (int r = 0; r < ROWS; r++)\n            total += sales[r][c];\n        cout << \"Week \" << c + 1 << \": \" << total << endl;\n    }\n    return 0;\n}\n", "sampleOutput": "Store 1: 100\nStore 2: 80\nStore 3: 28\nWeek 1: 22\nWeek 2: 42\nWeek 3: 62\nWeek 4: 82"}, {"id": "u7-p5", "title": "Vector: read until zero", "task": "Read integers into a vector using push_back until the value 0 is entered (do not store the 0). Display how many values were stored, then display them in reverse order separated by single spaces, then multiply every element by 2 using a range-based for loop with a reference and display the doubled values in original order separated by single spaces.", "stdin": "6 11 4 9 0\n", "solution": "#include <iostream>\n#include <iomanip>\n#include <string>\n#include <vector>\nusing namespace std;\n\nint main()\n{\n    vector<int> v;\n    int x;\n    cin >> x;\n    while (x != 0) {\n        v.push_back(x);\n        cin >> x;\n    }\n    cout << \"Count: \" << v.size() << endl;\n    cout << \"Reverse:\";\n    for (int i = static_cast<int>(v.size()) - 1; i >= 0; i--)\n        cout << \" \" << v[i];\n    cout << endl;\n    for (int &e : v)\n        e *= 2;\n    cout << \"Doubled:\";\n    for (int e : v)\n        cout << \" \" << e;\n    cout << endl;\n    return 0;\n}\n", "sampleOutput": "Count: 4\nReverse: 9 4 11 6\nDoubled: 12 22 8 18"}]}]}</script>
<script>
(function () {
'use strict';
var DATA = JSON.parse(document.getElementById('course-data').textContent);
var ORDER = ['u1', 'u2', 'u3', 'u4', 'u5', 'u6', 'u7', 'u9', 'u8'];
var UNITS = ORDER.map(function (id) { return DATA.units.filter(function (u) { return u.id === id; })[0]; }).filter(Boolean);
DATA.units.forEach(function (u) { if (UNITS.indexOf(u) < 0) UNITS.push(u); });
var QBY = {}, UNIT_OF = {}, LESSON_OF = {};
UNITS.forEach(function (u) {
  u.lessons.forEach(function (l) { LESSON_OF[l.id] = l; });
  u.questions.forEach(function (q) { QBY[q.id] = q; UNIT_OF[q.id] = u; });
});
var ALLQ = Object.keys(QBY).map(function (k) { return QBY[k]; });
var KEY = 'csc1111-course-v1';
var S = { q: {}, read: {}, prog: {}, exams: [] };
try { var raw = localStorage.getItem(KEY); if (raw) { var p = JSON.parse(raw); if (p && p.q) S = p; } } catch (e) {}
S.q = S.q || {}; S.read = S.read || {}; S.prog = S.prog || {}; S.exams = S.exams || [];
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

// ---------- your own textbook (never part of this site; stays on this device) ----------
// Two ways to supply it: a PDF picked once and kept in this browser's storage, or a file named
// textbook.pdf sitting in the same folder as this page when the page is opened from disk.
var BOOK = { url: null, name: null, mode: null };
if (S.bookOffset == null) S.bookOffset = 33;
var IS_DISK = location.protocol === 'file:';
function idb(fn) {
  return new Promise(function (res, rej) {
    var open;
    try { open = indexedDB.open('csc1111-course', 1); } catch (e) { rej(e); return; }
    open.onupgradeneeded = function () { open.result.createObjectStore('files'); };
    open.onerror = function () { rej(open.error); };
    open.onsuccess = function () {
      var tx = open.result.transaction('files', 'readwrite'), st = tx.objectStore('files'), r = fn(st);
      tx.oncomplete = function () { res(r && r.result); };
      tx.onerror = function () { rej(tx.error); };
    };
  });
}
function loadBook() {
  if (S.bookMode === 'folder' && IS_DISK) { BOOK = { url: 'textbook.pdf', name: 'textbook.pdf (in this folder)', mode: 'folder' }; return Promise.resolve(); }
  return idb(function (st) { return st.get('textbook'); }).then(function (rec) {
    if (rec && rec.blob) BOOK = { url: URL.createObjectURL(rec.blob), name: rec.name, mode: 'stored' };
  }).catch(function () {});
}
function storeBook(file) {
  return idb(function (st) { return st.put({ blob: file, name: file.name }, 'textbook'); }).then(function () {
    if (BOOK.url && BOOK.mode === 'stored') URL.revokeObjectURL(BOOK.url);
    S.bookMode = 'stored'; save();
    BOOK = { url: URL.createObjectURL(file), name: file.name, mode: 'stored' };
  });
}
function useFolderBook() { S.bookMode = 'folder'; save(); BOOK = { url: 'textbook.pdf', name: 'textbook.pdf (in this folder)', mode: 'folder' }; }
function forgetBook() {
  if (BOOK.url && BOOK.mode === 'stored') URL.revokeObjectURL(BOOK.url);
  BOOK = { url: null, name: null, mode: null }; S.bookMode = null; save();
  return idb(function (st) { return st.delete('textbook'); }).catch(function () {});
}
function bookPages(l) { // printed page ranges named in a lesson's "book" line
  var out = [], re = /pages?\s+(\d+)(?:\s*(?:to|-|–)\s*(\d+))?/gi, m;
  while ((m = re.exec(l.book || ''))) out.push({ from: +m[1], to: m[2] ? +m[2] : +m[1] });
  var more = /(?:,|and)\s+(\d+)(?:\s*(?:to|-|–)\s*(\d+))?/gi; more.lastIndex = 0;
  if (out.length) { var tail = (l.book || '').slice((l.book || '').search(/pages?\s+\d/i)); while ((m = more.exec(tail))) { var f = +m[1]; if (!out.some(function (r) { return r.from === f; })) out.push({ from: f, to: m[2] ? +m[2] : f }); } }
  return out;
}
function bookHref(printed) { return BOOK.url + '#page=' + (printed + (+S.bookOffset || 0)); }
function bookSetupHtml() {
  var h = '<p class="small muted">Show your own copy of the textbook beside the lessons. The file stays on this device: it is not uploaded and is not part of this site.</p>';
  h += '<div class="row"><input class="pick" type="file" id="bookfile" accept="application/pdf,.pdf"></div>';
  if (IS_DISK) h += '<div class="row"><button class="btn" id="bookfolder">Use textbook.pdf from this folder</button><span class="small muted">Put the PDF next to this page and name it textbook.pdf.</span></div>';
  return h;
}
function wireBookSetup(after) {
  var f = document.getElementById('bookfile');
  if (f) f.onchange = function () { if (f.files && f.files[0]) storeBook(f.files[0]).then(after, after); };
  var fb = document.getElementById('bookfolder'); if (fb) fb.onclick = function () { useFolderBook(); after(); };
}

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function rich(s) { // plain text with `inline code`
  return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\n/g, '<br>');
}
function el(html) { var d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function st(q) { return S.q[q.id] || { seen: 0, right: 0, streak: 0, last: null }; }
function mastered(q) { var s = st(q); return s.last === 'right'; }
function solid(q) { return st(q).streak >= 2; }
function missed(q) { var s = st(q); return s.seen > 0 && s.last === 'wrong'; }
function record(q, ok) {
  var s = S.q[q.id] || { seen: 0, right: 0, streak: 0, last: null };
  s.seen++; if (ok) { s.right++; s.streak++; s.last = 'right'; } else { s.streak = 0; s.last = 'wrong'; }
  s.at = Date.now(); S.q[q.id] = s; save();
}
function unitStats(u) {
  var n = u.questions.length, m = u.questions.filter(mastered).length, so = u.questions.filter(solid).length;
  var mi = u.questions.filter(missed).length, seen = u.questions.filter(function (q) { return st(q).seen > 0; }).length;
  var lr = u.lessons.filter(function (l) { return S.read[l.id]; }).length;
  return { n: n, mastered: m, solid: so, missed: mi, seen: seen, read: lr, lessons: u.lessons.length, pct: n ? Math.round(100 * m / n) : 0 };
}
function overall() {
  var n = ALLQ.length, m = ALLQ.filter(mastered).length;
  return { n: n, mastered: m, pct: n ? Math.round(100 * m / n) : 0, missed: ALLQ.filter(missed).length, unseen: ALLQ.filter(function (q) { return st(q).seen === 0; }).length };
}
function normOut(s) { return String(s).replace(/\r/g, '').split('\n').map(function (l) { return l.replace(/\s+$/, ''); }).join('\n').replace(/^\n+|\n+$/g, ''); }
function normFill(s) { return String(s).trim().toLowerCase().replace(/\s+/g, ' '); }
function squash(s) { return String(s).toLowerCase().replace(/\s+/g, ''); }
function grade(q, given) {
  if (q.type === 'mc') return given === q.answer;
  if (q.type === 'tf') return given === q.answer;
  if (q.type === 'output') return normOut(given) === normOut(q.answer);
  if (q.type === 'fill') {
    var g = normFill(given), gs = squash(given);
    if (!g) return false;
    return q.accept.some(function (a) { return normFill(a) === g || squash(a) === gs || squash(a).replace(/;$/, '') === gs.replace(/;$/, ''); });
  }
  return false;
}
function answerText(q) {
  if (q.type === 'mc') return q.choices[q.answer];
  if (q.type === 'tf') return q.answer ? 'True' : 'False';
  return q.answer;
}

var view = document.getElementById('view'), nav = document.getElementById('nav');
var route = { name: 'home' }, navOpen = false;
function go(r) { route = r; navOpen = false; render(); window.scrollTo(0, 0); }

function renderNav() {
  var o = overall(), h = '<h1>CSC 1111<br><span class="muted small">Test-out course</span></h1><button id="menuToggle" aria-expanded="' + (navOpen ? 'true' : 'false') + '">' + (navOpen ? 'Close' : 'Menu') + '</button>';
  h += '<button data-r="home" class="' + (route.name === 'home' ? 'on' : '') + '"><span>Dashboard</span><span class="pct">' + o.pct + '%</span></button>';
  h += '<div class="sep"></div>';
  UNITS.forEach(function (u, i) {
    var s = unitStats(u), on = (route.unit === u.id) ? 'on' : '';
    h += '<button data-r="unit" data-u="' + u.id + '" class="' + on + '"><span>' + (i + 1) + '. ' + esc(u.title) + '</span><span class="pct">' + s.pct + '%</span></button>';
  });
  h += '<div class="sep"></div>';
  h += '<button data-r="review" class="' + (route.name === 'quiz' && route.kind === 'review' ? 'on' : '') + '"><span>Review my misses</span><span class="pct">' + o.missed + '</span></button>';
  h += '<button data-r="exam" class="' + (route.name === 'examsetup' || route.name === 'exam' ? 'on' : '') + '"><span>Mock exam</span><span class="pct">' + S.exams.length + ' taken</span></button>';
  h += '<button data-r="programs" class="' + (route.name === 'programs' ? 'on' : '') + '"><span>Programs to write</span><span class="pct"></span></button>';
  h += '<button data-r="help" class="' + (route.name === 'help' ? 'on' : '') + '"><span>How this works</span><span class="pct"></span></button>';
  nav.innerHTML = h;
  nav.className = navOpen ? 'open' : '';
  document.getElementById('menuToggle').addEventListener('click', function () { navOpen = !navOpen; renderNav(); });
  Array.prototype.forEach.call(nav.querySelectorAll('button[data-r]'), function (b) {
    b.addEventListener('click', function () {
      navOpen = false;
      var r = b.getAttribute('data-r');
      if (r === 'home') go({ name: 'home' });
      else if (r === 'unit') go({ name: 'unit', unit: b.getAttribute('data-u') });
      else if (r === 'review') startQuiz('review', ALLQ.filter(missed), 'Review my misses');
      else if (r === 'exam') go({ name: 'examsetup' });
      else if (r === 'programs') go({ name: 'programs' });
      else if (r === 'help') go({ name: 'help' });
    });
  });
}

function readiness() {
  var units95 = UNITS.filter(function (u) { return unitStats(u).pct >= 95; }).length;
  var good = S.exams.filter(function (e) { return e.pct >= 93; }).length;
  var progs = 0, progN = 0; UNITS.forEach(function (u) { u.programs.forEach(function (p) { progN++; if (S.prog[p.id]) progs++; }); });
  var last2 = S.exams.slice(-2), last2ok = last2.length === 2 && last2.every(function (e) { return e.pct >= 93; });
  return { units95: units95, unitN: UNITS.length, goodExams: good, last2ok: last2ok, progs: progs, progN: progN, noMisses: overall().missed === 0 && overall().unseen === 0 };
}

function home() {
  var o = overall(), r = readiness();
  var h = '<h2>Dashboard</h2>';
  h += '<div class="card"><div class="row" style="justify-content:space-between"><div><div class="big">' + o.pct + '%</div><div class="muted small">' + o.mastered + ' of ' + o.n + ' questions answered correctly on your latest try</div></div>';
  h += '<div class="row"><button class="btn primary" id="cont">' + (o.unseen ? 'Continue where I left off' : 'Drill my weakest questions') + '</button><button class="btn" id="rev"' + (o.missed ? '' : ' disabled') + '>Review my misses (' + o.missed + ')</button><button class="btn" id="mock">Take a mock exam</button></div></div>';
  h += '<div class="bar"><i style="width:' + o.pct + '%"></i></div></div>';
  h += '<div class="card"><h3>Ready for an A when all four are green</h3><ul class="checklist">';
  h += '<li><span class="dot ' + (r.units95 === r.unitN ? 'on' : '') + '"></span><span>Every unit at 95% or better <span class="muted">(' + r.units95 + ' of ' + r.unitN + ')</span></span></li>';
  h += '<li><span class="dot ' + (r.noMisses ? 'on' : '') + '"></span><span>Every question seen, and no misses left in review <span class="muted">(' + o.unseen + ' unseen, ' + o.missed + ' missed)</span></span></li>';
  h += '<li><span class="dot ' + (r.last2ok ? 'on' : '') + '"></span><span>Your last two mock exams both at 93% or better <span class="muted">(' + r.goodExams + ' so far at that level)</span></span></li>';
  h += '<li><span class="dot ' + (r.progs === r.progN ? 'on' : '') + '"></span><span>Every program written and compiled yourself <span class="muted">(' + r.progs + ' of ' + r.progN + ')</span></span></li>';
  h += '</ul></div>';
  h += '<div class="grid">';
  UNITS.forEach(function (u, i) {
    var s = unitStats(u);

    h += '<div class="card"><h3>What you missed</h3>';
    rows.forEach(function (r) {
      h += '<details><summary>' + rich(r.q.prompt.length > 110 ? r.q.prompt.slice(0, 110) + '…' : r.q.prompt) + '</summary><div>' + (r.q.code ? '<pre><code>' + esc(r.q.code) + '</code></pre>' : '') + '<p><strong>Your answer:</strong> ' + (r.a ? (r.q.type === 'mc' ? rich(String(r.q.choices[r.a.given])) : r.q.type === 'tf' ? (r.a.given ? 'True' : 'False') : '</p><pre><code>' + esc(r.a.given) + '</code></pre><p>') : 'none') + '</p><p><strong>Correct:</strong> ' + (r.q.type === 'output' || r.q.type === 'fill' ? '</p><pre><code>' + esc(r.q.answer) + '</code></pre><p>' : rich(answerText(r.q))) + '</p><p>' + rich(r.q.explain) + '</p></div></details>';
    });
    h += '</div>';
  }
  h += '<div class="row"><button class="btn primary" id="rv"' + (rows.length ? '' : ' disabled') + '>Drill what I missed</button><button class="btn" id="hm">Dashboard</button></div>';
  var missedQs = rows.map(function (r) { return r.q; });
  X = null; route = { name: 'examdone' }; renderNav(); view.innerHTML = h; window.scrollTo(0, 0);
  document.getElementById('rv').onclick = function () { startQuiz('review', missedQs, 'Exam misses'); };
  document.getElementById('hm').onclick = function () { go({ name: 'home' }); };
}

// ---------- programs ----------
function programsView() {
  var h = '<h2>Programs to write</h2><div class="card"><p>Write each one from a blank file before you open the solution. In your Ubuntu terminal:</p><pre><code>g++ -std=c++17 -Wall prog.cpp -o prog &amp;&amp; ./prog</code></pre><p class="muted small">Tick a program only after your own version compiled cleanly and matched the sample output.</p></div>';
  UNITS.forEach(function (u, i) {
    if (!u.programs.length || (route.unit && route.unit !== u.id)) return;
    h += '<h3>' + (i + 1) + '. ' + esc(u.title) + '</h3>';
    u.programs.forEach(function (p) {
      h += '<div class="card"><div class="row" style="justify-content:space-between"><strong>' + esc(p.title) + '</strong><label class="small"><input type="checkbox" data-p="' + p.id + '"' + (S.prog[p.id] ? ' checked' : '') + '> I wrote it and it matched</label></div><div>' + rich(p.task) + '</div>';
      if (p.stdin) h += '<div class="muted small">Input used for the sample run:</div><pre><code>' + esc(p.stdin) + '</code></pre>';
      h += '<div class="muted small">Expected output:</div><pre><code>' + esc(p.sampleOutput) + '</code></pre>';
      h += '<details><summary>Show the solution</summary><div><pre><code>' + esc(p.solution) + '</code></pre></div></details></div>';
    });
  });
  if (route.unit) h += '<div><button class="btn" id="allp">Show every unit</button></div>';
  view.innerHTML = h;
  Array.prototype.forEach.call(view.querySelectorAll('[data-p]'), function (c) { c.onchange = function () { S.prog[c.getAttribute('data-p')] = c.checked; save(); renderNav(); }; });
  var ap = document.getElementById('allp'); if (ap) ap.onclick = function () { go({ name: 'programs' }); };
}

function helpView() {
  var o = overall(), np = 0; UNITS.forEach(function (u) { np += u.programs.length; });
  var h = '<h2>How this works</h2><div class="card lesson"><p>This course covers every topic on Sinclair\'s CSC 1111 master syllabus, using the sections of the course textbook (Gaddis, <em>Starting Out with C++</em>, 10th edition) as the checklist. It holds ' + UNITS.length + ' units, ' + o.n + ' questions and ' + np + ' programs to write. Every code question was compiled and run to confirm its answer.</p>';
  h += '<h4>The loop</h4><ol><li>Open a unit and read a lesson. Each one names the book sections it covers.</li><li>Practice the lesson. You get the answer and the reason after every question.</li><li>Anything you miss comes back a few questions later, and again in "Review my misses", until you get it right.</li><li>Write the unit\'s programs yourself and compile them.</li><li>When the units are green, take mock exams until two in a row are 93% or better.</li></ol>';
  h += '<h4>What counts</h4><ul><li>A question counts toward a unit\'s percentage when your most recent answer to it was correct.</li><li>Output questions want exactly what the program prints. Trailing spaces and a final blank line are ignored; everything else counts.</li><li>Fill-in answers ignore capital letters and spacing.</li></ul>';
  h += '<h4>What this cannot promise</h4><p>Sinclair does not publish the exam, its length or its format. This bank is built from the syllabus and the textbook, so it should cover what can be asked, but it is not the exam itself. Ask the Prior Learning office (937-512-3000) whether the test is written, a coding project, or both, and whether a compiler is allowed.</p>';
  h += '<h4>Keys</h4><p><code>1</code> to <code>4</code> pick a choice, <code>T</code> and <code>F</code> answer true/false, <code>Enter</code> checks a fill-in or moves to the next question, <code>Ctrl+Enter</code> checks an output answer.</p></div>';
  h += '<div class="card"><h3>Your own textbook</h3>' + (BOOK.url ? '<p>Using <strong>' + esc(BOOK.name) + '</strong>. Open any lesson and choose "Show the book beside this lesson".</p><p class="small muted">The file stays on this device. It is not uploaded and is not part of this site. Printed page numbers are matched to the PDF by adding ' + (+S.bookOffset || 0) + '; adjust that from a lesson if the book opens on the wrong page.</p><div class="row"><button class="btn" id="bookforget">Remove the textbook from this browser</button></div>' : bookSetupHtml()) + '</div>';
  h += '<div class="card"><h3>Your progress</h3><p class="muted small">Progress is saved in this browser on this computer. It does not sync anywhere.</p><div class="row"><button class="btn" id="reset">Erase all progress</button><span id="rc"></span></div></div>';
  view.innerHTML = h;
  wireBookSetup(function () { render(); });
  var bf = document.getElementById('bookforget'); if (bf) bf.onclick = function () { forgetBook().then(function () { render(); }); };
  document.getElementById('reset').onclick = function () {
    var rc = document.getElementById('rc');
    rc.innerHTML = '<button class="btn" id="ry">Yes, erase everything</button> <button class="btn" id="rn">Cancel</button>';
    document.getElementById('ry').onclick = function () { S = { q: {}, read: {}, prog: {}, exams: [] }; save(); go({ name: 'home' }); };
    document.getElementById('rn').onclick = function () { rc.innerHTML = ''; };
  };
}

function render() {
  renderNav();
  if (route.name !== 'lesson') view.className = 'col';
  if (route.name === 'home') home();
  else if (route.name === 'unit') unitView();
  else if (route.name === 'lesson') lessonView();
  else if (route.name === 'quiz') quizView();
  else if (route.name === 'examsetup') examSetup();
  else if (route.name === 'exam') examView();
  else if (route.name === 'programs') programsView();
  else if (route.name === 'help') helpView();
}
document.addEventListener('keydown', function (e) {
  if (route.name !== 'quiz' || !Q) return;
  var tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'textarea' || tag === 'input') return;
  var box = document.getElementById('ans');
  if (Q.answered) { if (e.key === 'Enter') { e.preventDefault(); nextQuestion(); } return; }
  if (!box || !box._pick) return;
  if (box._tf) { if (e.key === 't' || e.key === 'T') box._pick(0); else if (e.key === 'f' || e.key === 'F') box._pick(1); }
  else { var n = parseInt(e.key, 10); if (n >= 1 && n <= box._n) box._pick(n - 1); }
});
render();
loadBook().then(function () { render(); });
window.__course = { units: UNITS.length, questions: ALLQ.length };
})();
</script>
</body>
