<title>CSC 1111 Test-Out Course</title>
<style>
/* Layout: fixed left rail of units, one working column on the right. Everything runs offline from this single file. */
:root {
  --bg: #f4f6f9; --surface: #ffffff; --surface-2: #eef2f7; --fg: #18212f; --muted: #5b6678; --line: #d5dce6;
  --accent: #1d5bbf; --accent-soft: #e3ecfb; --good: #14733a; --good-soft: #e2f4e8; --bad: #b3261e; --bad-soft: #fbe6e4;
  --warn: #8a5300; --warn-soft: #fcf0d9; --code-bg: #edf1f6;
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Code", "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #11151c; --surface: #1a2029; --surface-2: #212936; --fg: #e7ebf1; --muted: #9aa6b8; --line: #2d3644;
  --accent: #82b1f7; --accent-soft: #1c2b45; --good: #6fd08f; --good-soft: #17301f; --bad: #f29b94; --bad-soft: #3a1c1a;
  --warn: #eeb768; --warn-soft: #33270f; --code-bg: #232b37; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.55; }
.app { display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: 100%; }
nav { background: var(--surface); border-right: 1px solid var(--line); padding: 18px 14px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
nav h1 { font-size: 1.05rem; margin: 0 6px 10px; line-height: 1.25; }
nav button { all: unset; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 7px; font-size: 0.93rem; }
nav button:hover { background: var(--surface-2); }
nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav button:focus-visible, .btn:focus-visible, .choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
nav .pct { font-variant-numeric: tabular-nums; font-size: 0.8rem; color: var(--muted); }
nav .sep { height: 1px; background: var(--line); margin: 8px 4px; }
main { padding: 28px clamp(16px, 4vw, 48px) 80px; min-width: 0; }
.col { max-width: 54rem; display: flex; flex-direction: column; gap: 20px; }
h2 { font-size: 1.55rem; margin: 0; line-height: 1.2; }
h3 { font-size: 1.1rem; margin: 0; }
h4 { font-size: 1rem; margin: 14px 0 4px; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.btn { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 8px 14px; border-radius: 7px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: 0.5; cursor: default; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.good > i { background: var(--good); }
code, pre, textarea.code { font-family: var(--mono); font-size: 0.88rem; }
code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
pre { background: var(--code-bg); padding: 12px 14px; border-radius: 8px; overflow-x: auto; margin: 0 0 10px; line-height: 1.5; white-space: pre; }
pre code { background: none; padding: 0; }
table { border-collapse: collapse; width: 100%; margin: 0 0 10px; font-size: 0.93rem; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.lesson ul, .lesson ol { margin: 0 0 10px; padding-left: 1.3rem; }
.lesson li { margin-bottom: 4px; }
.tag { display: inline-block; font-size: 0.75rem; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.tag.good { background: var(--good-soft); color: var(--good); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { font: inherit; text-align: left; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 10px 14px; border-radius: 8px; display: flex; gap: 12px; align-items: flex-start; }
.choice:hover:not([disabled]) { background: var(--surface-2); }
.choice .k { font-family: var(--mono); color: var(--muted); flex: none; }
.choice .t { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.choice.right { border-color: var(--good); background: var(--good-soft); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice.picked { border-color: var(--accent); background: var(--accent-soft); }
.choice[disabled] { cursor: default; }
textarea.code, input.fill { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 10px 12px; font-size: 0.95rem; }
input.fill { font-family: var(--mono); }
textarea.code { min-height: 110px; resize: vertical; white-space: pre; }
.verdict { border-radius: 8px; padding: 12px 14px; }
.verdict.right { background: var(--good-soft); color: var(--good); }
.verdict.wrong { background: var(--bad-soft); color: var(--bad); }
.verdict .why { color: var(--fg); margin-top: 6px; }
.qmeta { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.big { font-size: 2.4rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.checklist li { display: flex; gap: 10px; align-items: baseline; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; transform: translateY(1px); }
.dot.on { background: var(--good); }
.col.wide { max-width: none; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.split .pane { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.split iframe { width: 100%; height: calc(100vh - 150px); border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.bookbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.bookbar .btn { padding: 5px 10px; font-size: 0.88rem; }
input[type=file].pick { font: inherit; max-width: 100%; }
@media (max-width: 1100px) { .split { grid-template-columns: 1fr; } .split .pane { position: static; } .split iframe { height: 75vh; } }
details { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details > summary { cursor: pointer; padding: 9px 14px; color: var(--accent); font-weight: 600; }
details > div { padding: 0 14px 12px; }
.timer { font-family: var(--mono); font-variant-numeric: tabular-nums; }
nav #menuToggle { display: none; }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  nav { position: static; height: auto; flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); }
  nav { padding: 10px 14px; gap: 4px; align-items: center; }
  nav h1 { width: auto; flex: 1; margin: 0 6px; font-size: 1rem; } nav h1 br { display: none; } nav h1 .muted { margin-left: 6px; }
  nav .sep { display: none; }
  nav button[data-r] { display: none; width: 100%; }
  nav.open button[data-r] { display: flex; }
  nav #menuToggle { display: flex; border: 1px solid var(--line); padding: 6px 12px; }
}

<script id="course-data" type="application/json">{"units": [{"id": "u1", "title": "How programs get made", "summary": "What computers and programs are made of, how source code becomes an executable, the parts of a C++ program, the programming process, and how to plan with pseudocode, flowcharts and hierarchy charts.", "lessons": [{"id": "u1-l1", "title": "Hardware and software", "book": "Sections 1.1 and 1.2, pages 1 to 9", "html": "<p>One machine can handle a huge variety of tasks because it is <strong>programmable<\/strong>: it does whatever its program tells it to. A computer system has five major hardware parts: the <strong>CPU<\/strong>, <strong>main memory<\/strong>, <strong>secondary storage<\/strong>, <strong>input devices<\/strong> and <strong>output devices<\/strong>.<\/p>\n<h4>The CPU<\/h4>\n<p>The central processing unit runs program instructions. It has two parts: the <strong>control unit<\/strong>, which fetches each instruction and directs the other parts, and the <strong>arithmetic and logic unit (ALU)<\/strong>, which does the math and comparisons. The CPU repeats the <strong>fetch/decode/execute cycle<\/strong>: fetch the next instruction from memory, decode it to see what it asks for, execute it, then move to the next one. Today's CPUs are small chips called <strong>microprocessors<\/strong>.<\/p>\n<h4>Main memory<\/h4>\n<p>Main memory is <strong>random-access memory (RAM)<\/strong>. A running program and the data it is using live here. RAM is divided into <strong>bytes<\/strong>; each byte is eight <strong>bits<\/strong> (bit is short for binary digit, a tiny switch that is on or off). Every byte has a unique number called its <strong>address<\/strong>; the CPU uses the address to find what it wants. RAM is <strong>volatile<\/strong>: when power goes off, its contents are lost.<\/p>\n<h4>Secondary storage<\/h4>\n<p>Disks, solid-state drives and flash drives hold programs and files for the long term. Secondary storage is <strong>nonvolatile<\/strong>, so it keeps data with the power off. It is bigger and cheaper per byte than RAM but much slower. That is why computers have both: RAM for fast working space, secondary storage for permanent copies. A program is copied from secondary storage into RAM before the CPU runs it.<\/p>\n<h4>Input and output devices<\/h4>\n<p>Input devices (keyboard, mouse, microphone, scanner) send data into the computer. Output devices (monitor, printer, speakers) send results out. A disk or USB drive counts as input when data is read from it and as output when data is saved to it.<\/p>\n<h4>Software<\/h4>\n<p>Software is the set of programs that tells the hardware what to do. There are two general categories:<\/p>\n<ul><li><strong>System software<\/strong> controls and supports the computer itself: the <strong>operating system<\/strong> (the fundamental programs that manage hardware, memory and files and run other programs), <strong>utility programs<\/strong> (virus scanners, file compression, backup) and software development tools (compilers and editors).<\/li>\n<li><strong>Application software<\/strong> does work for the user: word processors, spreadsheets, email, browsers, games.<\/li><\/ul>\n<p>Exam trap: a browser or word processor is application software, not system software, even though the operating system runs it.<\/p>"}, {"id": "u1-l2", "title": "Programs, languages, compiling and linking", "book": "Sections 1.3 and 1.4, pages 9 to 14", "html": "<p>A <strong>program<\/strong> is a list of instructions that the computer carries out to accomplish some job. An <strong>algorithm<\/strong> is a finite sequence of precisely stated steps that gets a job done or solves a problem. A program is an algorithm written in a language the computer can be made to run.<\/p>\n<h4>Machine language and programming languages<\/h4>\n<p>The only language a CPU runs directly is <strong>machine language<\/strong>: binary instructions specific to that CPU. <strong>Assembly language<\/strong> gives those instructions short names. Both are <strong>low-level<\/strong>: they match the hardware, and a program written for one CPU will not run on another. A <strong>high-level language<\/strong> such as C++ uses English-like statements and does not depend on one CPU. High-level programs are more <strong>portable<\/strong>: the same source code can be compiled for different systems, usually with few or no changes.<\/p>\n<h4>From source code to a running program<\/h4>\n<ol>\n<li>You type <strong>source code<\/strong> into a <strong>source file<\/strong> (for C++, a .cpp file). You can use a text editor or an <strong>integrated development environment (IDE)<\/strong>, which bundles editor, compiler and debugger.<\/li>\n<li>The <strong>preprocessor<\/strong> reads the source file first and handles lines that begin with <code>#<\/code>, such as <code>#include<\/code>. These are <strong>preprocessor directives<\/strong>. The preprocessor pastes in the named file and produces the text the compiler will see.<\/li>\n<li>The <strong>compiler<\/strong> translates the program into machine language and writes an <strong>object file<\/strong> (object code). Syntax errors are found here, and no object file is produced if there are any.<\/li>\n<li>The <strong>linker<\/strong> merges the object file with the prewritten pieces the program needs from the <strong>runtime library<\/strong>, C++'s stock of ready-made code (for example the code behind <code>cout<\/code>), and produces the <strong>executable file<\/strong>. An object file holds machine code but is not a complete program until it is linked.<\/li>\n<li>The operating system loads the executable into RAM and the CPU runs it.<\/li>\n<\/ol>\n<p>Order to memorize: source file, preprocessor, compiler, object file, linker, executable file. One command can run all three tools: <code>g++ -o ship ship.cpp<\/code>.<\/p>\n<p>A compiler translates the whole program before it runs. That differs from an interpreter, which translates and runs one statement at a time.<\/p>\n<pre><code>#include &lt;iostream&gt;   // preprocessor directive\nusing namespace std;\nint main()\n{\n    cout &lt;&lt; \"Hello\" &lt;&lt; endl;   // source code\n    return 0;\n}<\/code><\/pre>"}, {"id": "u1-l3", "title": "What a C++ program is made of", "book": "Section 1.4, pages 14 to 17", "html": "<p>Every language has the same kinds of building blocks. Look at this program:<\/p>\n<pre><code>#include &lt;iostream&gt;\nusing namespace std;\n\nint main()\n{\n    double pounds, price, charge;   // variable definition\n    cin &gt;&gt; pounds;\n    cin &gt;&gt; price;\n    charge = pounds * price;\n    cout &lt;&lt; \"Charge: \" &lt;&lt; charge &lt;&lt; endl;\n    return 0;\n}<\/code><\/pre>\n<table><thead><tr><th>Element<\/th><th>Meaning<\/th><th>Examples above<\/th><\/tr><\/thead><tbody>\n<tr><td>Key words (reserved words)<\/td><td>Words with a fixed meaning in C++. Always lowercase. Cannot be used for anything else.<\/td><td>using, namespace, int, double, return<\/td><\/tr>\n<tr><td>Programmer-defined identifiers<\/td><td>Names you invent for variables and functions.<\/td><td>pounds, price, charge<\/td><\/tr>\n<tr><td>Operators<\/td><td>Symbols that act on operands (usually data).<\/td><td>=, *, &lt;&lt;, &gt;&gt;<\/td><\/tr>\n<tr><td>Punctuation<\/td><td>Marks the start or end of a statement or separates list items.<\/td><td>; and , and { }<\/td><\/tr>\n<tr><td>Syntax<\/td><td>The rules for putting all of these together correctly.<\/td><td>semicolon needed after a statement<\/td><\/tr>\n<\/tbody><\/table>\n<p><code>main<\/code> and <code>cout<\/code> are not key words. <code>main<\/code> is a special function name, and <code>cout<\/code> is an object from the iostream library. The <code>=<\/code> symbol is the <strong>assignment operator<\/strong>: it stores the value of the right side in the variable on the left.<\/p>\n<h4>Lines versus statements<\/h4>\n<p>A <strong>line<\/strong> is one row of text in the file. A <strong>statement<\/strong> is a full command telling the computer to take some action; in C++ most statements end with a semicolon. One statement may be spread over several lines, and one line may hold several statements. Blank lines and comments are lines but not statements. A comment starts with <code>//<\/code> (to end of line) or sits between <code>/*<\/code> and <code>*/<\/code>; the compiler ignores it.<\/p>\n<h4>Variables<\/h4>\n<p>A <strong>variable<\/strong> is a location in memory that has been given a name. Its value can change while the program runs, and storing a new value replaces the old one. A <strong>variable definition<\/strong> states the type and name and creates the variable (<code>double charge;<\/code>). Define a variable before the first line that uses it. Numbers come in two general kinds: <strong>integers<\/strong> (whole numbers such as 5 or -129) and <strong>floating-point<\/strong> numbers (such as 6.7); <code>double<\/code> holds floating-point numbers.<\/p>"}, {"id": "u1-l4", "title": "Input, processing, output, and the programming process", "book": "Sections 1.5 to 1.7, pages 17 to 24", "html": "<h4>Input, processing, output<\/h4>\n<p>Nearly every program does three things. <strong>Input<\/strong> is data the program receives from the outside world (keyboard, file, device); in C++ you use <code>cin<\/code>. <strong>Processing<\/strong> is what the program does to the data (calculations, comparisons). <strong>Output<\/strong> is what it sends out (screen, printer, file); in C++ you use <code>cout<\/code>. Defining a program means naming its purpose, input, processing and output.<\/p>\n<h4>The programming process<\/h4>\n<ol>\n<li>State exactly what problem the program must solve.<\/li>\n<li>Visualize the program running (sketch the screens with sample input and output).<\/li>\n<li>Build a model with a hierarchy chart, flowchart or pseudocode.<\/li>\n<li>Check the model for logical errors.<\/li>\n<li>Type the code, save and compile it.<\/li>\n<li>Correct compile errors; repeat steps 5 and 6.<\/li>\n<li>Run the program with test data.<\/li>\n<li>Correct errors found while running; repeat steps 5 to 8.<\/li>\n<li>Validate the results: does the program really solve the original problem?<\/li>\n<\/ol>\n<p>The emphasis is on planning: a good program starts with a design, not with typing. <strong>Desk-checking<\/strong> means stepping through the program by hand, writing down each variable's value and what is displayed after every statement. A <strong>logic error<\/strong> is a mistake that makes a program produce wrong results even though it compiles.<\/p>\n<h4>Procedural versus object-oriented<\/h4>\n<p><strong>Procedural programming<\/strong> centers on procedures (in C++, <strong>functions<\/strong>): collections of statements that do one task, often sharing variables. <strong>Object-oriented programming (OOP)<\/strong> centers on <strong>objects<\/strong>. An object bundles data together with the procedures that work on that data, and you make an object do something by sending it a message (calling one of its functions). C++ supports both styles.<\/p>\n<p>Software engineering covers the whole job: design, writing, testing, debugging, documenting and maintaining software. Top-down design splits a task into modules, which large projects hand to different teams.<\/p>"}, {"id": "u1-l5", "title": "Algorithms, pseudocode and hierarchy charts", "book": "Sections 1.3 and 1.6, pages 9 and 19 to 21; design tools", "html": "<p>An <strong>algorithm<\/strong> is a finite list of precise steps that solves a problem. Design tools let you work the algorithm out before writing C++.<\/p>\n<h4>Pseudocode<\/h4>\n<p><strong>Pseudocode<\/strong> is a cross between English and a programming language. The computer cannot run it, there is no compiler for it and no official syntax, but good pseudocode is precise enough to translate line by line. Common conventions: <code>Input<\/code> or <code>Read<\/code> gets a value, <code>Display<\/code> or <code>Print<\/code> shows one, <code>Set x = ...<\/code> assigns, and <code>If / Else / End If<\/code> and <code>While / End While<\/code> mark selection and repetition, with indentation showing what is inside.<\/p>\n<pre><code>Input price\nInput quantity\nSet total = price * quantity\nIf total &gt; 100\n    Set total = total - 10\nEnd If\nDisplay total<\/code><\/pre>\n<p>Translating: Input becomes <code>cin &gt;&gt;<\/code>, Display becomes <code>cout &lt;&lt;<\/code>, Set becomes <code>=<\/code>, If becomes <code>if (...) { }<\/code>. Define the variables first.<\/p>\n<pre><code>double price, quantity, total;\ncin &gt;&gt; price &gt;&gt; quantity;\ntotal = price * quantity;\nif (total &gt; 100)\n    total = total - 10;\ncout &lt;&lt; total &lt;&lt; endl;<\/code><\/pre>\n<h4>The three structures<\/h4>\n<ul><li><strong>Sequence<\/strong>: steps run one after another.<\/li>\n<li><strong>Selection<\/strong>: a condition picks which steps run (<code>if<\/code>, <code>if/else<\/code>).<\/li>\n<li><strong>Repetition<\/strong> (iteration): steps repeat while a condition holds (<code>while<\/code>, <code>for<\/code>).<\/li><\/ul>\n<h4>Reading pseudocode<\/h4>\n<p>To find what pseudocode outputs, trace it: keep a column for each variable, update it line by line, and note each Display. Some questions state a program in plain English (\"The variable x starts with 0. Add 1 to x. Display x.\"); trace those the same way. A common design error is a step placed too early, such as calculating a total before the values it uses have been input.<\/p>\n<h4>Hierarchy charts<\/h4>\n<p>A <strong>hierarchy chart<\/strong> shows the structure of a program: a box at the top for the overall task, with boxes below for the subtasks it divides into, and below those their subtasks. This is <strong>top-down design<\/strong> (divide and conquer). The chart shows <em>what<\/em> the parts are and how they nest, not the order of execution or any decisions. Subtasks often become functions or modules.<\/p>"}, {"id": "u1-l6", "title": "Flowcharts", "book": "Section 1.6 and Appendix C material (written from standard practice)", "html": "<p>A <strong>flowchart<\/strong> is a diagram of the logical flow of a program. Each step is a shape and <strong>flow lines<\/strong> (arrows) join them to show the order.<\/p>\n<table><thead><tr><th>Shape<\/th><th>Name<\/th><th>Used for<\/th><\/tr><\/thead><tbody>\n<tr><td>Oval (rounded rectangle)<\/td><td>Terminal<\/td><td>Start and End (or Stop)<\/td><\/tr>\n<tr><td>Parallelogram<\/td><td>Input/output<\/td><td>Reading a value, displaying a value<\/td><\/tr>\n<tr><td>Rectangle<\/td><td>Process<\/td><td>Calculations and assignments<\/td><\/tr>\n<tr><td>Diamond<\/td><td>Decision<\/td><td>A yes/no (true/false) question; two lines leave it, labeled Yes and No<\/td><\/tr>\n<tr><td>Small circle<\/td><td>Connector<\/td><td>Continues the chart elsewhere or on another page; matching labels join up (some standards draw a separate home-plate shape for an off-page connector)<\/td><\/tr>\n<tr><td>Rectangle with an extra line inside each side<\/td><td>Predefined process<\/td><td>A call to a module (function) charted separately<\/td><\/tr>\n<\/tbody><\/table>\n<p>Flow lines normally run top to bottom, with arrowheads showing direction. A process, input or output box has one line in and one out; a decision has one in and two out. The chart has exactly one Start.<\/p>\n<h4>How the structures look<\/h4>\n<ul><li><strong>Sequence<\/strong>: boxes in a straight vertical line.<\/li>\n<li><strong>Selection<\/strong>: a diamond splits the flow into a Yes path and a No path. Both paths join again afterward. An if with no else has one empty path.<\/li>\n<li><strong>Repetition<\/strong>: a diamond tests a condition; the Yes path runs boxes and then a flow line loops <em>back up<\/em> to the diamond; the No path leaves the loop. A test at the top before the body is a pre-test loop, which is what C++ <code>while<\/code> is. If the boxes come first and the diamond comes after them, the body always runs at least once: a post-test loop, C++ <code>do-while<\/code>.<\/li><\/ul>\n<p>Example flowchart in words: Start; Input n; Set count = 1; Diamond \"count &lt;= n?\"; Yes: Display count, Set count = count + 1, back to the diamond; No: End. In C++:<\/p>\n<pre><code>int n, count = 1;\ncin &gt;&gt; n;\nwhile (count &lt;= n)\n{\n    cout &lt;&lt; count &lt;&lt; endl;\n    count = count + 1;\n}<\/code><\/pre>\n<p>Checking a flowchart means tracing it by hand, as in desk-checking. A loop whose flow line never leaves (the variable in the diamond never changes) is an infinite loop on paper too.<\/p>"}], "questions": [{"id": "u1-q001", "lesson": "u1-l1", "type": "mc", "difficulty": 1, "prompt": "Which hardware component fetches, decodes and executes program instructions?", "choices": ["The CPU", "Main memory", "Secondary storage", "The output device"], "answer": 0, "explain": "The CPU runs the fetch/decode/execute cycle. Memory only holds instructions and data."}, {"id": "u1-q002", "lesson": "u1-l1", "type": "mc", "difficulty": 2, "prompt": "What happens to the contents of main memory (RAM) when the computer is switched off?", "choices": ["They are kept, because RAM is permanent storage", "They are lost, because RAM is volatile", "They are automatically moved to the CPU", "They are sent to the output device"], "answer": 1, "explain": "RAM needs power to hold data. Anything that must survive goes to secondary storage."}, {"id": "u1-q003", "lesson": "u1-l1", "type": "fill", "difficulty": 1, "prompt": "The CPU has a control unit and a second unit that performs math and comparisons. Name it.", "answer": "arithmetic logic unit", "accept": ["arithmetic logic unit", "ALU", "arithmetic and logic unit", "arithmetic/logic unit", "arithmetic-logic unit", "the alu", "the arithmetic and logic unit", "arithmetic and logic unit (ALU)"], "explain": "The ALU (arithmetic and logic unit) does calculations and comparisons; the control unit directs operations."}, {"id": "u1-q004", "lesson": "u1-l1", "type": "mc", "difficulty": 1, "prompt": "Which of these is system software?", "choices": ["A spreadsheet program", "An email program", "The operating system", "A web browser"], "answer": 2, "explain": "The operating system manages the computer itself. Spreadsheets, email programs and browsers do work for the user, so they are application software."}, {"id": "u1-q005", "lesson": "u1-l1", "type": "tf", "difficulty": 2, "prompt": "Secondary storage such as a solid-state drive keeps its data when the power is off.", "answer": true, "explain": "Secondary storage is nonvolatile. It is slower than RAM, so programs are copied into RAM to run."}, {"id": "u1-q006", "lesson": "u1-l2", "type": "mc", "difficulty": 1, "prompt": "What does a compiler do?", "choices": ["Combines object files with library code", "Handles lines that begin with #", "Runs the program one statement at a time", "Translates source code into machine language (object code)"], "answer": 3, "explain": "Compiling translates the whole source into object code. Combining with library code is the linker's job; # lines belong to the preprocessor."}, {"id": "u1-q007", "lesson": "u1-l2", "type": "mc", "difficulty": 2, "prompt": "Which program combines your object file with library code to create the executable file?", "choices": ["The linker", "The preprocessor", "The compiler", "The editor"], "answer": 0, "explain": "The linker joins the object file to the runtime library routines the program uses (such as the code behind cout) and writes the executable file. The compiler only makes the object file."}, {"id": "u1-q008", "lesson": "u1-l2", "type": "fill", "difficulty": 1, "prompt": "Lines that begin with # (such as #include) are handled by the ___ before the compiler sees the code.", "answer": "preprocessor", "accept": ["preprocessor", "the preprocessor", "pre-processor", "c preprocessor"], "explain": "The preprocessor processes directives first and passes the resulting text to the compiler."}, {"id": "u1-q009", "lesson": "u1-l2", "type": "mc", "difficulty": 2, "prompt": "Which pair of statements about languages is correct?", "choices": ["C++ is low-level because it is compiled; machine language is portable", "C++ is high-level and portable; machine language is low-level and specific to one kind of CPU", "Both C++ and machine language are high-level but only C++ needs a compiler", "C++ must be rewritten for each CPU; machine language runs on all CPUs"], "answer": 1, "explain": "High-level languages hide hardware detail and compile for many CPUs. Machine language is binary instructions for one CPU family."}, {"id": "u1-q010", "lesson": "u1-l2", "type": "tf", "difficulty": 2, "prompt": "Machine language is the only language a CPU can execute directly.", "answer": true, "explain": "Everything else, including C++, must be translated to machine language first."}, {"id": "u1-q011", "lesson": "u1-l2", "type": "mc", "difficulty": 3, "prompt": "Which is the correct order for turning a C++ program into a running program?", "choices": ["source file, compiler, preprocessor, linker, object file, executable file", "source file, linker, object file, compiler, executable file", "source file, preprocessor, compiler, object file, linker, executable file", "source file, preprocessor, linker, compiler, executable file, object file"], "answer": 2, "explain": "The preprocessor runs first, the compiler produces an object file, and the linker produces the executable. The compiler never makes the executable by itself."}, {"id": "u1-q012", "lesson": "u1-l3", "type": "mc", "difficulty": 1, "prompt": "In the statement `int total = 5;` which item is a programmer-defined identifier?", "code": "int total = 5;", "choices": ["int", "=", "5", "total"], "answer": 3, "explain": "int is a key word, = is an operator, 5 is a literal. total is a name the programmer made up."}, {"id": "u1-q013", "lesson": "u1-l3", "type": "mc", "difficulty": 2, "prompt": "Which of these is NOT a C++ key word?", "choices": ["cout", "return", "int", "while"], "answer": 0, "explain": "cout is an object defined in the iostream library, not a reserved word. return, int and while are reserved."}, {"id": "u1-q014", "lesson": "u1-l3", "type": "fill", "difficulty": 1, "prompt": "In the statement `charge = pounds * price;` the = symbol is called the ___ operator.", "code": "charge = pounds * price;", "answer": "assignment", "accept": ["assignment", "assignment operator"], "explain": "= stores the value on the right in the variable on the left. It is not the equality test, which is ==."}, {"id": "u1-q015", "lesson": "u1-l3", "type": "mc", "difficulty": 2, "prompt": "How many statements are in this code?", "code": "int x = 4;\ncout << \"x is \"\n     << x << endl;", "choices": ["3", "2", "1", "4"], "answer": 1, "explain": "A statement ends at its semicolon. The cout statement runs over two lines but is still one statement, plus the definition makes two."}, {"id": "u1-q016", "lesson": "u1-l3", "type": "tf", "difficulty": 2, "prompt": "Every line of a C++ source file is exactly one statement.", "answer": false, "explain": "Blank lines and comments are not statements, one statement can span several lines, and one line can hold several statements."}, {"id": "u1-q017", "lesson": "u1-l3", "type": "output", "difficulty": 1, "prompt": "What does this code print? Assume the code is inside main(), with iostream included and using namespace std; in effect.", "code": "cout << \"A\";\ncout << \"B\" << endl;\ncout << \"C\";", "answer": "AB\nC", "explain": "The first two statements print AB and a newline. C then prints on the next line."}, {"id": "u1-q018", "lesson": "u1-l3", "type": "output", "difficulty": 2, "prompt": "What does this code print? Assume the code is inside main(), with iostream included and using namespace std; in effect.", "code": "cout << \"x\"; // cout << \"y\";\n/* cout << \"w\"; */\ncout << \"z\" << endl;", "answer": "xz", "explain": "The compiler ignores everything from // to end of line and everything between /* and */. Only the x and z statements run."}, {"id": "u1-q019", "lesson": "u1-l3", "type": "fill", "difficulty": 2, "prompt": "The rules that say how key words, operators and punctuation may be combined in a language are called its ___.", "answer": "syntax", "accept": ["syntax"], "explain": "Syntax errors are violations of these rules and the compiler reports them."}, {"id": "u1-q020", "lesson": "u1-l4", "type": "mc", "difficulty": 1, "prompt": "A program asks the user for an age, works out the birth year, and shows the result on the screen. The step that takes the age from the keyboard is which of a program's three basic activities?", "choices": ["Processing", "Output", "Input", "Linking"], "answer": 2, "explain": "Receiving data from the keyboard is input. Working out the birth year is processing and showing it is output; linking is a step in building the program, not something the running program does."}, {"id": "u1-q021", "lesson": "u1-l4", "type": "mc", "difficulty": 2, "prompt": "According to the steps of the programming process, what comes first?", "choices": ["Type the code and compile it", "Run the program with test data", "Check the results for validity", "State exactly what problem the program must solve"], "answer": 3, "explain": "Planning comes first: purpose, input, processing and output. Code is typed after the model is built and checked."}, {"id": "u1-q022", "lesson": "u1-l4", "type": "mc", "difficulty": 1, "prompt": "A program reads a radius, calculates the area of a circle and displays it. Calculating the area is which activity?", "choices": ["Processing", "Input", "Output", "Compiling"], "answer": 0, "explain": "Reading the radius is input, displaying is output, and the math in between is processing."}, {"id": "u1-q023", "lesson": "u1-l4", "type": "output", "difficulty": 2, "prompt": "What does this code print? Assume the code is inside main(), with iostream included and using namespace std; in effect.", "code": "double hours = 6, rate = 12.5, pay;\npay = hours * rate;\ncout << \"Pay: \" << pay << endl;", "answer": "Pay: 75", "explain": "hours times rate is 75. A double that holds a whole value prints without a decimal point by default."}, {"id": "u1-q024", "lesson": "u1-l4", "type": "mc", "difficulty": 2, "prompt": "Which statement best describes object-oriented programming compared with procedural programming?", "choices": ["OOP is centered on functions that share data with each other", "OOP is centered on objects that combine data with the functions that work on that data", "OOP requires every program to have no variables", "OOP means the program is designed with flowcharts only"], "answer": 1, "explain": "Procedural programming centers on procedures. In OOP, each object carries its own data along with the procedures that work with it."}, {"id": "u1-q025", "lesson": "u1-l4", "type": "mc", "difficulty": 2, "prompt": "What is desk-checking?", "choices": ["Running the program on a very large input", "Compiling the program on a second computer", "Stepping through a program by hand, recording variable values and output after each statement", "Asking the compiler to list all warnings"], "answer": 2, "explain": "Desk-checking is a manual trace on paper. It finds logic errors before or after running the program."}, {"id": "u1-q026", "lesson": "u1-l4", "type": "tf", "difficulty": 1, "prompt": "Is this legal? A program's first line inside `main` is `total = 5;`, and `int total;` appears two lines later. The compiler accepts it.", "answer": false, "explain": "The compiler reads top to bottom, so the definition (type and name) must come before the first use. Here `total` is used before it exists, which is an error."}, {"id": "u1-q027", "lesson": "u1-l5", "type": "fill", "difficulty": 1, "prompt": "A set of well-defined, ordered steps for solving a problem is called an ___.", "answer": "algorithm", "accept": ["algorithm", "an algorithm"], "explain": "An algorithm is the idea; a program is an algorithm written in a programming language."}, {"id": "u1-q028", "lesson": "u1-l5", "type": "tf", "difficulty": 2, "prompt": "Pseudocode must follow strict syntax rules because the compiler checks it.", "answer": false, "explain": "Pseudocode is for people. No compiler reads it and it has no official syntax, though it should be precise enough to translate."}, {"id": "u1-q029", "lesson": "u1-l5", "type": "mc", "difficulty": 2, "prompt": "What does a hierarchy chart show?", "choices": ["The exact order in which statements execute, with decisions", "The values stored in each variable", "The machine language produced by the compiler", "The overall task broken down into subtasks, level by level"], "answer": 3, "explain": "A hierarchy chart shows structure (top-down design). Execution order and decisions belong in flowcharts and pseudocode."}, {"id": "u1-q030", "lesson": "u1-l5", "type": "output", "difficulty": 2, "prompt": "This pseudocode is run. What is displayed?", "code": "Set total = 0\nSet i = 1\nWhile i <= 5\n    Set total = total + i\n    Set i = i + 1\nEnd While\nDisplay total", "answer": "15", "explain": "The loop adds 1+2+3+4+5. When i becomes 6 the test fails and total, 15, is displayed."}, {"id": "u1-q031", "lesson": "u1-l5", "type": "output", "difficulty": 2, "prompt": "This pseudocode is run. What is displayed?", "code": "Set a = 3\nSet b = 8\nSet temp = a\nSet a = b\nSet b = temp\nDisplay a\nDisplay b", "answer": "8\n3", "explain": "temp saves 3, a takes 8, b takes the saved 3. The two values are swapped, and each Display is on its own line."}, {"id": "u1-q032", "lesson": "u1-l5", "type": "mc", "difficulty": 2, "prompt": "Which C++ code matches this pseudocode?", "code": "Input age\nIf age >= 18\n    Display \"adult\"\nElse\n    Display \"minor\"\nEnd If", "choices": ["if (age >= 18)\n    cout << \"adult\";\nelse\n    cout << \"minor\";", "if (age = 18)\n    cout << \"adult\";\nelse\n    cout << \"minor\";", "if (age > 18)\n    cout << \"adult\";\nelse\n    cout << \"minor\";", "if (age >= 18)\n    cout << \"adult\";\ncout << \"minor\";"], "answer": 0, "explain": "The pseudocode tests greater than or equal to 18 and has an Else. = assigns instead of comparing, > leaves out 18, and omitting else prints both words for adults."}, {"id": "u1-q033", "lesson": "u1-l6", "type": "fill", "difficulty": 1, "prompt": "In a flowchart, the oval shape is used for the start and end points. What is it called?", "answer": "terminal", "accept": ["terminal", "terminal symbol", "terminator", "start/end", "start/stop", "start/end symbol", "terminal (start/end)", "start terminal"], "explain": "The terminal symbol (an oval) marks where the flowchart begins and ends."}, {"id": "u1-q034", "lesson": "u1-l6", "type": "tf", "difficulty": 1, "prompt": "In a flowchart, a parallelogram stands for a calculation (process).", "answer": false, "explain": "A parallelogram is input or output. Calculations go in a rectangle."}, {"id": "u1-q035", "lesson": "u1-l6", "type": "mc", "difficulty": 1, "prompt": "Which flowchart shape asks a yes/no question and has two exit lines?", "choices": ["Rectangle", "Diamond", "Oval", "Parallelogram"], "answer": 1, "explain": "The decision diamond tests a condition and its two exits are labeled Yes and No (true and false)."}, {"id": "u1-q036", "lesson": "u1-l6", "type": "mc", "difficulty": 2, "prompt": "What is the small circle in a flowchart for?", "choices": ["Start and end", "Displaying output", "A connector that continues the flow at another point or page", "Making a calculation"], "answer": 2, "explain": "Matching labeled circles join separate pieces of a flowchart. Start/end is an oval, output is a parallelogram."}, {"id": "u1-q037", "lesson": "u1-l6", "type": "output", "difficulty": 2, "prompt": "A flowchart reads: Start; Set n = 1; Diamond \"n <= 3?\"; Yes: Display n * n, Set n = n + 1, flow line back to the diamond; No: End. What does it display?", "code": "Start\nSet n = 1\nn <= 3 ?\n  Yes: Display n * n\n       Set n = n + 1\n       (back to the test)\n  No: End", "answer": "1\n4\n9", "explain": "The loop runs for n = 1, 2, 3 and shows 1, 4, 9. At n = 4 the No path ends the program."}, {"id": "u1-q038", "lesson": "u1-l6", "type": "output", "difficulty": 3, "prompt": "A flowchart reads: Start; Set x = 10; Diamond \"x > 5?\" Yes: Display \"big\"; No: skip. Both paths join. Diamond \"x > 12?\" Yes: Display \"huge\"; No: skip. Both paths join; End. What is displayed?", "code": "Start\nSet x = 10\nx > 5 ?   Yes: Display \"big\"\n(paths join)\nx > 12 ?  Yes: Display \"huge\"\n(paths join)\nEnd", "answer": "big", "explain": "Both decisions are tested one after the other. x > 5 is true so big shows; x > 12 is false so huge does not."}, {"id": "u1-q039", "lesson": "u1-l6", "type": "mc", "difficulty": 2, "prompt": "A flowchart reads: Start; Input x (parallelogram); Diamond \"x > 0?\"; Yes: Display \"positive\"; No: Display \"not positive\"; End. Which C++ matches?", "choices": ["cin >> x;\nif (x > 0)\n    cout << \"positive\";\ncout << \"not positive\";", "cout << x;\nif (x > 0)\n    cout << \"positive\";\nelse\n    cout << \"not positive\";", "cin >> x;\nwhile (x > 0)\n    cout << \"positive\";\ncout << \"not positive\";", "cin >> x;\nif (x > 0)\n    cout << \"positive\";\nelse\n    cout << \"not positive\";"], "answer": 3, "explain": "A diamond with two exit paths is if/else. Without else, not positive would always print too; a parallelogram labeled Input means cin; a loop would need a path back to the diamond."}, {"id": "u1-q040", "lesson": "u1-l6", "type": "output", "difficulty": 3, "prompt": "A flowchart reads: Start; Set n = 20; Set count = 0; Diamond \"n > 1?\"; Yes: Set n = n / 2 (integer division), Set count = count + 1, back to the diamond; No: Display count; End. What is displayed?", "code": "Start\nSet n = 20\nSet count = 0\nn > 1 ?\n  Yes: Set n = n / 2   (integer division)\n       Set count = count + 1\n       (back to the test)\n  No: Display count\nEnd", "answer": "4", "explain": "n goes 20, 10, 5, 2, 1 with the count at 4 when n reaches 1. Integer division makes 5 / 2 equal 2."}, {"id": "u1-q041", "lesson": "u1-l5", "type": "output", "difficulty": 2, "prompt": "This program is written as English statements. What would it display if it were a real program?", "code": "The variable p starts with the value 4.\nThe variable q starts with the value 7.\nAdd 3 to p.\nStore the value of p times q in q.\nSubtract p from q, and store the result in q.\nDisplay the value in q.", "answer": "42", "explain": "p becomes 7, then q becomes 7 * 7 = 49, then 49 - 7 = 42. Each step uses the values left by the step before it."}, {"id": "u1-q042", "lesson": "u1-l5", "type": "output", "difficulty": 3, "prompt": "This program is written as English statements. What would it display if it were a real program?", "code": "Create three variables: a = 2, b = 9, c = 0.\nCompute a plus b and put the answer in c.\nPut c multiplied by 2 into a.\nPut a plus c into b.\nShow a, b and c on one line, separated by spaces.", "answer": "22 33 11", "explain": "c gets 2 + 9 = 11, then a gets 11 * 2 = 22 (the old 2 is gone), then b gets 22 + 11 = 33, replacing the 9."}, {"id": "u1-q043", "lesson": "u1-l5", "type": "mc", "difficulty": 2, "prompt": "This pseudocode should ask for a ticket price and a quantity, then display the total cost. What is the error?", "code": "Set cost = price * quantity\nDisplay \"Enter the ticket price\"\nInput price\nDisplay \"Enter the quantity\"\nInput quantity\nDisplay cost", "choices": ["Every Display must come after all of the Input steps", "The multiplication should be an addition", "cost is calculated before price and quantity have been input", "Pseudocode lines must end with semicolons"], "answer": 2, "explain": "A step can only use values that already exist. The Set cost line belongs after both Input steps; as written it multiplies values that have not been entered yet. Prompts (Display) before each Input are correct."}, {"id": "u1-q044", "lesson": "u1-l6", "type": "mc", "difficulty": 2, "prompt": "A flowchart reads: Start; Display \"Card value? \" (parallelogram); Input value (parallelogram); Display \"Amount spent? \" (parallelogram); Input spent (parallelogram); Set remain = value - spent (rectangle); Display remain (parallelogram); End. Which C++ matches?", "choices": ["remain = value - spent;\ncout << \"Card value? \";\ncin >> value;\ncout << \"Amount spent? \";\ncin >> spent;\ncout << remain;", "cout << \"Card value? \";\ncin >> value;\ncout << \"Amount spent? \";\ncin >> spent;\nremain = spent - value;\ncout << remain;", "cout << \"Card value? \";\ncout << value;\ncout << \"Amount spent? \";\ncout << spent;\nremain = value - spent;\ncout << remain;", "cout << \"Card value? \";\ncin >> value;\ncout << \"Amount spent? \";\ncin >> spent;\nremain = value - spent;\ncout << remain;"], "answer": 3, "explain": "The steps run top to bottom: each Input parallelogram becomes cin, and the process rectangle subtracts spent from value after both are read. Calculating first would use values not yet entered, and cout cannot read input."}, {"id": "u1-q045", "lesson": "u1-l5", "type": "output", "difficulty": 2, "prompt": "This pseudocode is run. What is displayed?", "code": "Set temp = 68\nIf temp > 80\n    Display \"hot\"\nElse If temp > 60\n    Display \"mild\"\nElse\n    Display \"cold\"\nEnd If\nDisplay \"done\"", "answer": "mild\ndone", "explain": "68 > 80 is false, so the next test runs: 68 > 60 is true and mild is shown. The chain stops at the first true test, and done is shown after End If either way."}, {"id": "u1-q046", "lesson": "u1-l5", "type": "output", "difficulty": 2, "prompt": "This pseudocode is run. What is displayed?", "code": "Set n = 10\nWhile n > 0\n    Display n\n    Set n = n - 3\nEnd While", "answer": "10\n7\n4\n1", "explain": "n is shown, then reduced by 3: 10, 7, 4, 1. After 1 it becomes -2, the test n > 0 fails, and the loop ends without showing -2."}, {"id": "u1-q047", "lesson": "u1-l6", "type": "output", "difficulty": 3, "prompt": "A flowchart reads: Start; Set k = 5; Display k; Set k = k + 1; Diamond \"k < 5?\"; Yes: flow line back up to Display k; No: End. What is displayed?", "code": "Start\nSet k = 5\nDisplay k        <-----+\nSet k = k + 1          |\nk < 5 ?   Yes ---------+\n  No: End", "answer": "5", "explain": "The diamond comes after the body, so this is a post-test loop (a do-while in C++): the body runs once before the first test. k becomes 6, 6 < 5 is false, and the chart ends."}, {"id": "u1-q048", "lesson": "u1-l5", "type": "mc", "difficulty": 3, "prompt": "Which C++ code matches this pseudocode?", "code": "Set sum = 0\nInput num\nWhile num != 0\n    Set sum = sum + num\n    Input num\nEnd While\nDisplay sum", "choices": ["sum = 0;\ncin >> num;\nwhile (num != 0)\n{\n    sum = sum + num;\n}\ncout << sum;", "sum = 0;\ncin >> num;\nwhile (num != 0)\n{\n    sum = sum + num;\n    cin >> num;\n}\ncout << sum;", "sum = 0;\ncin >> num;\nif (num != 0)\n{\n    sum = sum + num;\n    cin >> num;\n}\ncout << sum;", "sum = 0;\ncin >> num;\nwhile (num != 0)\n{\n    sum = sum + num;\n    cin >> num;\n    cout << sum;\n}"], "answer": 1, "explain": "Both Input steps are needed: one before the loop and one as the last step inside it, and Display sum comes after End While. Dropping the inner input makes an infinite loop, if runs the steps at most once, and output inside the loop shows a running total."}, {"id": "u1-q049", "lesson": "u1-l5", "type": "output", "difficulty": 2, "prompt": "This pseudocode is run and the user types 3 and then 4. What is displayed?", "code": "Input a\nInput b\nSet c = a * a + b * b\nDisplay c", "answer": "25", "explain": "a is 3 and b is 4, so c is 9 + 16 = 25. Multiplication is done before addition, just as in C++."}, {"id": "u1-q050", "lesson": "u1-l6", "type": "mc", "difficulty": 1, "prompt": "In a flowchart, a diamond's Yes path runs some boxes and then a flow line goes back up to the same diamond. Which structure is this?", "choices": ["Sequence", "Selection", "A connector", "Repetition (a loop)"], "answer": 3, "explain": "A flow line that returns to an earlier decision makes steps repeat, so it is a loop. Selection also uses a diamond, but its two paths join below it and never go back up."}, {"id": "u1-q051", "lesson": "u1-l6", "type": "mc", "difficulty": 1, "prompt": "You are drawing the flowchart for a program that reads a price and a tax rate, calculates the tax, and displays it. Which shape holds the step `tax = price * rate`?", "choices": ["Parallelogram", "Rectangle", "Diamond", "Oval"], "answer": 1, "explain": "Calculations and assignments are processes, drawn as rectangles. Reading the price and rate and displaying the tax go in parallelograms."}, {"id": "u1-q052", "lesson": "u1-l5", "type": "mc", "difficulty": 2, "prompt": "A program reads a starting balance, the total of deposits, the total of withdrawals and a monthly interest rate, then calculates and displays the current balance. In its hierarchy chart, which box belongs at the very top?", "choices": ["Read the total of deposits", "Display the balance", "Start", "Find the current account balance"], "answer": 3, "explain": "The top box names the whole task. Getting the input, calculating and displaying are subtasks on the level below it. Start is a flowchart terminal, not part of a hierarchy chart."}, {"id": "u1-q053", "lesson": "u1-l6", "type": "mc", "difficulty": 2, "prompt": "In standard flowcharting, what does a rectangle with an extra vertical line just inside each side stand for?", "choices": ["A predefined process: a call to a module or function that is charted separately", "An input step", "Two calculations done at the same time", "The end of the program"], "answer": 0, "explain": "The predefined process symbol shows a call to a module (function) whose steps are charted elsewhere. A plain rectangle is an ordinary process; input is a parallelogram and the end is an oval."}, {"id": "u1-q054", "lesson": "u1-l1", "type": "fill", "difficulty": 1, "prompt": "One computer can run a game, a spreadsheet and a browser because its behavior is set by whatever instructions it is given: it is ___ (one word).", "answer": "programmable", "accept": ["programmable", "programmed", "reprogrammable", "a programmable machine"], "explain": "A computer is not built for one job. It does whatever job its program tells it to do."}, {"id": "u1-q055", "lesson": "u1-l1", "type": "mc", "difficulty": 1, "prompt": "Which statement about main memory is correct?", "choices": ["Each byte has a unique address, and each byte is made of eight bits", "Bytes have no addresses; the CPU searches memory for the data it needs", "Each bit has its own address, and a byte is two bits", "A byte is sixteen bits, and only the first byte has an address"], "answer": 0, "explain": "Memory is divided into bytes of 8 bits (bit is short for binary digit). Every byte has its own number, its address, which the CPU uses to find it."}, {"id": "u1-q056", "lesson": "u1-l1", "type": "fill", "difficulty": 1, "prompt": "Each byte of main memory is identified by a unique number called its ___.", "answer": "address", "accept": ["address", "memory address", "an address", "its address"], "explain": "Addresses run from lowest to highest, like numbered post office boxes. A variable's name stands for the address where its value is stored."}, {"id": "u1-q057", "lesson": "u1-l1", "type": "mc", "difficulty": 2, "prompt": "A virus scanner, a file-compression program and a backup program are all examples of which kind of software?", "choices": ["Application software", "Operating systems", "Software development tools", "Utility programs, a kind of system software"], "answer": 3, "explain": "Utility programs do a specialized job that improves the computer's operation or protects data. The textbook classes them as system software, not application software."}, {"id": "u1-q058", "lesson": "u1-l2", "type": "fill", "difficulty": 1, "prompt": "Source code written in a high-level language can usually be recompiled for a different kind of CPU with little or no editing. That property is called being ___.", "answer": "portable", "accept": ["portable", "portability", "being portable"], "explain": "C++ is portable: the same source code can be recompiled for another system with little or no change. Machine language is not portable."}, {"id": "u1-q059", "lesson": "u1-l2", "type": "tf", "difficulty": 2, "prompt": "An object file can be run by itself, because the compiler has already translated it into machine language.", "answer": false, "explain": "The object file holds machine code but not the runtime library routines the program uses (such as the code behind cout). The linker must add them to make the executable file."}, {"id": "u1-q060", "lesson": "u1-l3", "type": "fill", "difficulty": 1, "prompt": "Words such as int, double and return have a special meaning in C++ and may be used only for that purpose. They are called key words or ___ words.", "answer": "reserved", "accept": ["reserved", "reserved words", "reserved word"], "explain": "Key words are reserved for the language and are always lowercase. You cannot use one as a variable name."}, {"id": "u1-q061", "lesson": "u1-l3", "type": "mc", "difficulty": 2, "prompt": "In the statement `total = price * qty;` which symbols are operators?", "choices": ["; and =", "only *", "= and *", "* and ;"], "answer": 2, "explain": "= (assignment) and * (multiplication) act on operands. The semicolon is punctuation: it marks the end of the statement."}, {"id": "u1-q062", "lesson": "u1-l3", "type": "fill", "difficulty": 1, "prompt": "A named storage location in memory, whose value can change while the program runs, is a ___.", "answer": "variable", "accept": ["variable", "a variable"], "explain": "The name stands for a location in RAM. Storing a new value replaces the old one."}, {"id": "u1-q063", "lesson": "u1-l4", "type": "mc", "difficulty": 2, "prompt": "In the nine-step programming process, which step comes right before typing the code?", "choices": ["Run the program with test data", "Check the model for logical errors", "Validate the results", "Correct errors found while running"], "answer": 1, "explain": "The order is: define, visualize, model with design tools, check the model for logic errors, and only then type, save and compile. Testing and validating come after the code compiles."}, {"id": "u1-q064", "lesson": "u1-l4", "type": "mc", "difficulty": 1, "prompt": "When you clearly define what a program is to do, which four items do you identify?", "choices": ["Purpose, input, processing and output", "Sequence, selection, repetition and hierarchy", "Source code, object code, library and executable", "Variables, constants, functions and objects"], "answer": 0, "explain": "Step 1 names what the program is for, what goes in, what is done to it, and what comes out."}, {"id": "u1-q065", "lesson": "u1-l4", "type": "tf", "difficulty": 1, "prompt": "Visualizing a program running means picturing, or sketching, its screens with sample input and output before you write the code.", "answer": true, "explain": "Putting yourself in the user's place this way decides what the program will ask and display, which settles most of its output early."}, {"id": "u1-q066", "lesson": "u1-l2", "type": "mc", "difficulty": 1, "prompt": "What is an integrated development environment (IDE)?", "choices": ["A collection of prewritten library code that the linker adds", "The part of the operating system that loads programs into memory", "A program that translates and runs one statement at a time", "One package that combines a text editor, compiler, debugger and other tools under a single set of menus"], "answer": 3, "explain": "In an IDE one click can preprocess, compile, link and run. Prewritten code is the runtime library, and translating one statement at a time describes an interpreter."}, {"id": "u1-q067", "lesson": "u1-l2", "type": "fill", "difficulty": 2, "prompt": "The large collection of prewritten C++ code for jobs like screen output and math functions, which the linker joins to your object code, is called the ___ library.", "answer": "runtime", "accept": ["runtime", "run-time", "run time", "runtime library", "run-time library", "standard", "standard library", "c++ standard library"], "explain": "The compiler does not put library code into the object file; the linker adds the library routines the program uses."}, {"id": "u1-q068", "lesson": "u1-l1", "type": "mc", "difficulty": 2, "prompt": "Which part of the CPU coordinates the computer's operations and determines where to get the next instruction?", "choices": ["The arithmetic and logic unit", "Main memory", "The control unit", "Secondary storage"], "answer": 2, "explain": "The control unit fetches and decodes instructions and sends control signals to the other parts. The ALU only does the math and comparisons."}, {"id": "u1-q069", "lesson": "u1-l1", "type": "mc", "difficulty": 2, "prompt": "In what order does the CPU handle each instruction of a program?", "choices": ["Fetch, decode, execute", "Execute, decode, fetch", "Fetch, execute, decode", "Decode, fetch, execute"], "answer": 0, "explain": "The control unit fetches the next instruction from main memory, decodes it to see what it asks for, and then the right component executes it. The cycle repeats for every instruction."}], "programs": [{"id": "u1-p1", "title": "Shipping charge with a heavy-parcel rate (pseudocode to C++)", "task": "Translate this pseudocode into a C++ program.\n\nDisplay \"Enter pounds and price per pound: \"\nInput pounds\nInput price\nIf pounds > 20\n    Set charge = 20 * price + (pounds - 20) * price * 2\nElse\n    Set charge = pounds * price\nEnd If\nDisplay \"Shipping charge: $\" and charge\n\nUse double for all three variables. Finish the output line with a newline.", "stdin": "25 3", "sampleOutput": "Enter pounds and price per pound: Shipping charge: $90", "solution": "#include <iostream>\nusing namespace std;\n\nint main()\n{\n    double pounds, price, charge;\n\n    cout << \"Enter pounds and price per pound: \";\n    cin >> pounds >> price;\n\n    if (pounds > 20)\n        charge = 20 * price + (pounds - 20) * price * 2;\n    else\n        charge = pounds * price;\n\n    cout << \"Shipping charge: $\" << charge << endl;\n    return 0;\n}\n"}, {"id": "u1-p2", "title": "Average of n scores (pseudocode to C++)", "task": "Translate this pseudocode into a C++ program.\n\nInput n\nSet total = 0\nSet i = 1\nWhile i <= n\n    Input score\n    Set total = total + score\n    Set i = i + 1\nEnd While\nSet average = total / n\nDisplay \"Average: \" and average\n\nUse int for n and i, and double for score, total and average. Finish the output with a newline. No prompts are displayed.", "stdin": "4\n80 90 70 100", "sampleOutput": "Average: 85", "solution": "#include <iostream>\nusing namespace std;\n\nint main()\n{\n    int n, i;\n    double score, total, average;\n\n    cin >> n;\n    total = 0;\n    i = 1;\n    while (i <= n)\n    {\n        cin >> score;\n        total = total + score;\n        i = i + 1;\n    }\n    average = total / n;\n    cout << \"Average: \" << average << endl;\n    return 0;\n}\n"}]}, {"id": "u8", "title": "Testing and debugging", "summary": "Kinds of errors, hand tracing, choosing test data, the classic C++ bug patterns, and stubs and drivers.", "lessons": [{"id": "u8-l1", "title": "Kinds of errors and what the compiler tells you", "book": "Sections 1.6 and 3.10, pages 21 and 133; general debugging", "html": "<p><strong>Debugging<\/strong> is finding and fixing the errors in a program. Errors fall into three main families, plus linker errors.<\/p>\n<table><thead><tr><th>Kind<\/th><th>When it shows up<\/th><th>Example<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Syntax error<\/strong><\/td><td>At compile time. The compiler reports it with a line number and no executable is made.<\/td><td>missing semicolon, misspelled key word, undefined variable, unmatched brace<\/td><\/tr>\n<tr><td><strong>Logic error<\/strong><\/td><td>The program compiles and runs but gives wrong results.<\/td><td>wrong formula, <code>=<\/code> instead of <code>==<\/code>, loop that runs one time too few<\/td><\/tr>\n<tr><td><strong>Linker error<\/strong><\/td><td>After compiling, when the object file is linked. No executable is made.<\/td><td>a function that has a prototype and is called but was never defined<\/td><\/tr>\n<tr><td><strong>Run-time error<\/strong><\/td><td>While the program runs: it crashes or stops abnormally.<\/td><td>integer division by zero (undefined behavior; on most systems it stops the program), running out of memory<\/td><\/tr>\n<\/tbody><\/table>\n<p>Many textbooks, including Gaddis, use \"runtime error\" loosely for any mistake found while running, which includes wrong answers. On an exam, decide by the symptom: it will not compile is a syntax error; it runs but the answer is wrong is a logic error; it crashes is a run-time error.<\/p>\n<h4>Errors versus warnings<\/h4>\n<p>An <strong>error<\/strong> stops compilation. A <strong>warning<\/strong> does not: the compiler still builds the program, but it is telling you the code is legal and probably wrong. Typical warnings: a variable that is never used, a variable that may be used before it is set, a comparison between signed and unsigned values, and an assignment inside an <code>if<\/code> condition. Treat every warning as a possible logic error and fix it. Turning on more warnings (for g++, <code>-Wall<\/code>) catches bugs early.<\/p>\n<h4>What the compiler cannot find<\/h4>\n<p>The compiler checks the rules of the language, not your intent. A program with no errors and no warnings can still print the wrong thing. Only testing, hand tracing and careful reading find logic errors.<\/p>\n<p>C++ is case-sensitive: <code>Cout<\/code> or <code>Return<\/code> is a compile error, not a typo the compiler forgives. A single missing brace or semicolon often causes a flood of messages that begin on the line <em>after<\/em> the real mistake, so fix the first error, then recompile.<\/p>\n<pre><code>int total = 0           // syntax error: missing ;\ncout &lt;&lt; total / 0;     // would be a run-time error for int\naverage = a + b / 2;    // logic error if you meant (a + b) / 2<\/code><\/pre>"}, {"id": "u8-l2", "title": "Hand tracing and desk-checking", "book": "Section 3.10, pages 133 and 134", "html": "<p><strong>Hand tracing<\/strong> is a debugging technique where you pretend to be the computer and execute the program one statement at a time on paper. Chapter 1 calls the same process <strong>desk-checking<\/strong>: stepping through the code on paper, writing down each variable's contents and what is displayed after each statement. It is especially good at finding math mistakes and other logic errors.<\/p>\n<h4>How to do it<\/h4>\n<ol><li>Set up a table in which every variable gets its <strong>own column<\/strong> and every statement you execute gets its own row.<\/li>\n<li>Pick sample input whose correct answer you can work out in advance.<\/li>\n<li>Go statement by statement. After each one, write the new value in that variable's column. A value stays until some statement changes it.<\/li>\n<li>Write down what is displayed after every output statement.<\/li>\n<li>Compare the result with the answer you expected. The first row where the chart goes wrong points to the bug.<\/li><\/ol>\n<p>Example of a bug found by tracing:<\/p>\n<pre><code>double n1, n2, n3, avg;\nn1 = 10; n2 = 20; n3 = 30;\navg = n1 + n2 + n3 / 3;<\/code><\/pre>\n<table><thead><tr><th>after statement<\/th><th>n1<\/th><th>n2<\/th><th>n3<\/th><th>avg<\/th><\/tr><\/thead><tbody>\n<tr><td>n1 = 10<\/td><td>10<\/td><td>?<\/td><td>?<\/td><td>?<\/td><\/tr>\n<tr><td>n2 = 20<\/td><td>10<\/td><td>20<\/td><td>?<\/td><td>?<\/td><\/tr>\n<tr><td>n3 = 30<\/td><td>10<\/td><td>20<\/td><td>30<\/td><td>?<\/td><\/tr>\n<tr><td>avg = ...<\/td><td>10<\/td><td>20<\/td><td>30<\/td><td>40<\/td><\/tr>\n<\/tbody><\/table>\n<p>A correct average would be 20, but the chart shows 40. Division has higher precedence than addition, so only n3 was divided: 10 + 20 + 10 = 40. The fix is <code>(n1 + n2 + n3) / 3<\/code>.<\/p>\n<h4>Tracing loops<\/h4>\n<p>For a loop, add a row for each pass and include the loop variable. Record the value the condition sees each time it is tested, including the final test that fails. Count passes carefully: a loop from 1 while <code>i &lt;= 4<\/code> runs 4 times; while <code>i &lt; 4<\/code> it runs 3.<\/p>\n<p>Tracing also verifies a flowchart or pseudocode before any code is written, which is step 4 of the programming process.<\/p>"}, {"id": "u8-l3", "title": "Choosing test data", "book": "Section 1.6 (pages 21 and 22) and 3.10, plus general testing practice", "html": "<p>Testing means running a program with sample input to see whether the output is right. Passing one test proves little. A good set of <strong>test cases<\/strong> each has an input and the <strong>expected output<\/strong> that you worked out by hand <em>before<\/em> running. If you take the program's own output as correct, you will never notice that it is wrong.<\/p>\n<h4>Three kinds of test data<\/h4>\n<ul>\n<li><strong>Normal (typical) data<\/strong>: ordinary values well inside the allowed range, such as 72 for a score that may be 0 to 100.<\/li>\n<li><strong>Boundary data<\/strong>: values at, just inside, and just outside the edges of a range, where off-by-one mistakes (<code>&lt;<\/code> versus <code>&lt;=<\/code>) hide. For a valid range of 0 to 100: 0, 1, 99, 100, and the outside neighbors -1 and 101. For a rule like \"60 or more passes\": 59, 60, 61.<\/li>\n<li><strong>Invalid data<\/strong>: input the program should reject or handle, such as a negative age, letters where a number is expected, or zero when it will be a divisor.<\/li><\/ul>\n<p>Also test the special cases for the problem: an empty list, a count of 0 or 1, all values equal, the largest and smallest values.<\/p>\n<h4>Coverage<\/h4>\n<p>Every path in the program should run at least once. If there is an if, test one input that makes it true and one that makes it false. If there is a loop, test it running zero times (if possible), once, and many times. For an if/else-if chain with four branches, you need at least four inputs, one per branch, plus the boundaries between branches.<\/p>\n<h4>Example<\/h4>\n<pre><code>// Pass if score is 60 or more\nif (score &gt; 60)          // bug: should be &gt;=\n    cout &lt;&lt; \"pass\";\nelse\n    cout &lt;&lt; \"fail\";<\/code><\/pre>\n<p>Test scores 40 and 90 both give correct answers. Only the boundary test, 60, shows that this prints \"fail\" when it should say \"pass\".<\/p>\n<p>Testing can show that bugs exist; it can never prove that none remain. Finally, <strong>validate<\/strong> the results: check that the program solves the original problem, not just that it matches your design.<\/p>"}, {"id": "u8-l4", "title": "Common bug patterns in C++", "book": "General debugging practice (no single book section); relates to Chapters 4 and 5", "html": "<p>These mistakes appear again and again, and exams love them. Most of them compile.<\/p>\n<h4>1. = versus ==<\/h4>\n<p><code>if (x = 5)<\/code> assigns 5 to x and the condition is the value 5, which is true. It is always true (for any nonzero value) and it changes x. Use <code>==<\/code> to compare.<\/p>\n<h4>2. Stray semicolon<\/h4>\n<p><code>if (x &gt; 10);<\/code> ends the if with an empty statement. The next statement then runs every time. <code>while (i &lt; 3);<\/code> makes an empty body, so a loop that should end now loops forever. <code>for (...);<\/code> repeats nothing and then runs the block once.<\/p>\n<h4>3. Missing braces<\/h4>\n<p>Without <code>{ }<\/code>, an <code>if<\/code>, <code>else<\/code> or loop controls only the <em>one<\/em> statement after it. Indentation does not matter to the compiler. The second line below always runs.<\/p>\n<pre><code>if (n &gt; 0)\n    cout &lt;&lt; \"positive \";\n    cout &lt;&lt; \"done\";      // always runs<\/code><\/pre>\n<h4>4. Missing break<\/h4>\n<p>In a <code>switch<\/code>, execution falls through into the next case until a <code>break<\/code> (or the end). Forgetting it prints extra output.<\/p>\n<h4>5. Integer division<\/h4>\n<p>When both operands are <code>int<\/code>, <code>/<\/code> drops the fraction: <code>7 / 2<\/code> is 3, and <code>double r = 7 / 2;<\/code> stores 3.0. Make at least one operand a double: <code>7 / 2.0<\/code> or <code>static_cast&lt;double&gt;(7) / 2<\/code>. Also <code>%<\/code> works only on integers.<\/p>\n<h4>6. Uninitialized variable or accumulator<\/h4>\n<p>A local variable has no defined starting value. <code>int sum; sum += x;<\/code> adds to garbage. Start totals at 0 and products at 1.<\/p>\n<h4>7. Off-by-one<\/h4>\n<p><code>for (i = 0; i &lt;= n; i++)<\/code> runs n + 1 times; <code>for (i = 1; i &lt; n; i++)<\/code> runs n - 1 times. Decide which and check the boundaries.<\/p>\n<h4>8. Operator precedence<\/h4>\n<p><code>a + b / 2<\/code> divides only b. Add parentheses when you mean something else. Note also <code>&amp;&amp;<\/code> binds tighter than <code>||<\/code>. A range test written <code>x &lt; 0 &amp;&amp; x &gt; 100<\/code> can never be true; \"outside the range\" needs <code>||<\/code>.<\/p>\n<h4>9. Others<\/h4>\n<p>Comparing doubles with <code>==<\/code> (they hold approximations, so compare the difference to a small tolerance), a <code>while<\/code> loop whose body never changes the variable it tests (an infinite loop), forgetting to read input before using it, and using the wrong variable (a copy-paste slip) are common too.<\/p>"}, {"id": "u8-l5", "title": "Stubs and drivers", "book": "Section 6.16, pages 372 and 373; debugger use from general practice", "html": "<p>When a program is split into functions, you can test the pieces in isolation. Two small tools help.<\/p>\n<h4>Stub<\/h4>\n<p>A <strong>stub<\/strong> is a dummy function used in place of a real function that is not written (or not trusted) yet. It usually does nothing except display a message that it was called, often with the argument values it received. If the real function returns a value, the stub returns a fixed <strong>test value<\/strong> so the calling code can continue. Stubs let you test the <em>calling<\/em> code: is the function called when expected, and are the right values passed?<\/p>\n<pre><code>double getTax(double amount)      // stub\n{\n    cout &lt;&lt; \"getTax called with \" &lt;&lt; amount &lt;&lt; endl;\n    return 10.0;                  // fixed test value\n}<\/code><\/pre>\n<h4>Driver<\/h4>\n<p>A <strong>driver<\/strong> is a small program (or a main function) whose only job is to call one function with test data and show what comes back. Drivers test the <em>function<\/em> itself, apart from the rest of the program.<\/p>\n<pre><code>int main()                        // driver for square()\n{\n    cout &lt;&lt; square(3) &lt;&lt; endl;     // expect 9\n    cout &lt;&lt; square(-2) &lt;&lt; endl;    // expect 4\n    cout &lt;&lt; square(0) &lt;&lt; endl;     // expect 0\n    return 0;\n}<\/code><\/pre>\n<h4>Which when<\/h4>\n<table><thead><tr><th>Tool<\/th><th>Replaces<\/th><th>Tests<\/th><\/tr><\/thead><tbody>\n<tr><td>Stub<\/td><td>the function<\/td><td>the code that calls it<\/td><\/tr>\n<tr><td>Driver<\/td><td>the caller (main)<\/td><td>the function<\/td><\/tr><\/tbody><\/table>\n<p>Build incrementally: write and test one function at a time. Stubs let you run a whole program early; drivers let you check each real function with chosen normal, boundary and invalid inputs. When the pieces work, replace the stubs with the real functions and run the full program.<\/p>\n<h4>Other debugging aids<\/h4>\n<p>A temporary <code>cout<\/code> that prints variable values at key points (for a loop, on every pass) shows where a program first goes wrong. Remove or comment out these diagnostic lines when done.<\/p>\n<p>A <strong>debugger<\/strong> (built into most IDEs) does the hand trace for you: set a <strong>breakpoint<\/strong> on a line and the program pauses there; <strong>step<\/strong> runs one statement at a time; a <strong>watch<\/strong> shows chosen variables' current values while the program is paused.<\/p>"}], "questions": [{"id": "u8-q001", "lesson": "u8-l1", "type": "mc", "difficulty": 1, "prompt": "A program has a missing semicolon at the end of a statement. What kind of error is this?", "choices": ["Logic error", "Syntax error", "Run-time error", "Validation error"], "answer": 1, "explain": "The compiler rejects code that breaks the language rules, so it never produces an executable. Logic and run-time errors need a program that compiles."}, {"id": "u8-q002", "lesson": "u8-l1", "type": "mc", "difficulty": 2, "prompt": "A program compiles with no messages and runs to the end, but it prints 7 where the correct answer is 5. What kind of error is it?", "choices": ["Syntax error", "Compiler warning", "Logic error", "Linker error"], "answer": 2, "explain": "Nothing stopped it from running; it just computes the wrong thing. Only testing or tracing can find it."}, {"id": "u8-q003", "lesson": "u8-l1", "type": "mc", "difficulty": 2, "prompt": "A program compiles, but when run it crashes at the moment it divides an int by an int variable that holds 0. What kind of error is this?", "code": "int a = 10, b = 0;\ncout << a / b;", "choices": ["Syntax error", "Logic error caught by the compiler", "Preprocessor error", "Run-time error"], "answer": 3, "explain": "The mistake appears only while running and stops the program abnormally. The compiler cannot know the variable will be 0. (Integer division by zero is undefined behavior in C++; on most systems it ends the program.)"}, {"id": "u8-q004", "lesson": "u8-l1", "type": "tf", "difficulty": 2, "prompt": "A compiler warning, unlike a compiler error, does not by itself stop the executable file from being created.", "answer": true, "explain": "Warnings are not errors, so the build finishes (unless you tell the compiler to treat warnings as errors, for example g++ -Werror). They often point at real logic bugs, so read them."}, {"id": "u8-q005", "lesson": "u8-l1", "type": "fill", "difficulty": 1, "prompt": "A mistake that lets a program compile and run but produces wrong results is called a ___ error.", "answer": "logic", "accept": ["logic", "logical", "logic error"], "explain": "The compiler checks the grammar, not the intent. Wrong formulas and wrong conditions are logic errors."}, {"id": "u8-q006", "lesson": "u8-l2", "type": "output", "difficulty": 2, "prompt": "Hand trace this code. What does it print? Assume the code is inside main(), with iostream included and using namespace std; in effect.", "code": "double n1 = 6, n2 = 12, n3 = 18, avg;\navg = n1 + n2 + n3 / 3;\ncout << avg << endl;", "answer": "24", "explain": "n3 / 3 is evaluated first and is 6, so avg is 6 + 12 + 6 = 24. The intended average, 12, needs parentheses around the sum."}, {"id": "u8-q007", "lesson": "u8-l2", "type": "output", "difficulty": 2, "prompt": "Hand trace this code. What does it print? Assume the code is inside main(), with iostream included and using namespace std; in effect.", "code": "int x = 0;\nfor (int i = 1; i <= 4; i++)\n    x = x * 2 + i;\ncout << x << endl;", "answer": "26", "explain": "x goes 0 to 1, then 1*2+2 = 4, then 4*2+3 = 11, then 11*2+4 = 26."}, {"id": "u8-q008", "lesson": "u8-l2", "type": "output", "difficulty": 3, "prompt": "The programmer meant to swap a and b. What does this print? Assume the code is inside main(), with iostream included and using namespace std; in effect.", "code": "int a = 5, b = 9;\na = b;\nb = a;\ncout << a << \" \" << b << endl;", "answer": "9 9", "explain": "After a = b, a is 9 and the old 5 is gone. Then b = a copies 9 again. Swapping needs a temporary variable."}, {"id": "u8-q009", "lesson": "u8-l2", "type": "fill", "difficulty": 1, "prompt": "Stepping through a program by hand and writing down each variable's value after each statement is called hand tracing or ___-checking.", "answer": "desk", "accept": ["desk", "desk-checking", "desk checking", "deskchecking"], "explain": "Desk-checking uses a chart with a column per variable. It finds logic errors without running the program."}, {"id": "u8-q010", "lesson": "u8-l2", "type": "mc", "difficulty": 3, "prompt": "How many times does the body of this loop run?", "code": "int n = 10, steps = 0;\nwhile (n != 1)\n{\n    if (n % 2 == 0)\n        n = n / 2;\n    else\n        n = 3 * n + 1;\n    steps++;\n}\ncout << steps;", "choices": ["6", "5", "7", "10"], "answer": 0, "explain": "n goes 10, 5, 16, 8, 4, 2, 1: the body runs for each change, six times, and the loop stops when n reaches 1."}, {"id": "u8-q011", "lesson": "u8-l3", "type": "mc", "difficulty": 1, "prompt": "Which kind of test data is a value at the very edge of the allowed range, such as 0 or 100 when scores must be 0 to 100?", "choices": ["Normal data", "Boundary data", "Invalid data", "Random data"], "answer": 1, "explain": "Boundary values catch < versus <= mistakes. Values outside the range, such as -1 or 101, are invalid data."}, {"id": "u8-q012", "lesson": "u8-l3", "type": "mc", "difficulty": 2, "prompt": "A function accepts a percentage from 0 to 100 inclusive. Which set of test inputs is best?", "choices": ["50, 51, 52, 53", "0, 100", "-1, 0, 1, 50, 99, 100, 101", "25, 50, 75"], "answer": 2, "explain": "A good set includes normal data, both boundaries, their neighbors, and invalid values on both sides."}, {"id": "u8-q013", "lesson": "u8-l3", "type": "fill", "difficulty": 2, "prompt": "Input the program should reject, such as an age of -5, is called ___ test data.", "answer": "invalid", "accept": ["invalid", "invalid data", "invalid input", "bad", "bad data", "erroneous", "illegal"], "explain": "Invalid data checks that the program handles bad inp
