ut instead of failing or accepting it."}, {"id": "u8-q014", "lesson": "u8-l3", "type": "tf", "difficulty": 1, "prompt": "If a program gives the right output for one test run, that proves the program is correct.", "answer": false, "explain": "Testing can show that bugs exist but never that none remain. Test normal, boundary and invalid cases and every branch."}, {"id": "u8-q015", "lesson": "u8-l3", "type": "output", "difficulty": 2, "prompt": "The program should pass anyone with 60 or more. What does it print for the boundary value 60? Assume the code is inside main(), with iostream included and using namespace std; in effect.", "code": "int score = 60;\nif (score > 60)\n    cout << \"pass\" << endl;\nelse\n    cout << \"fail\" << endl;", "answer": "fail", "explain": "60 is not greater than 60, so the else branch runs. The bug is > where >= was needed, and only a boundary test exposes it."}, {"id": "u8-q016", "lesson": "u8-l4", "type": "output", "difficulty": 2, "prompt": "What does this code print? Assume the code is inside main(), with iostream included and using namespace std; in effect.", "code": "int x = 3;\nif (x = 5)\n    cout << \"five \";\ncout << x << endl;", "answer": "five 5", "explain": "x = 5 assigns 5, and the value of the expression is 5, which is true. So the message prints and x is now 5."}, {"id": "u8-q017", "lesson": "u8-l4", "type": "output", "difficulty": 2, "prompt": "What does this code print? Assume the code is inside main(), with iostream included and using namespace std; in effect.", "code": "int n = 2;\nif (n > 5);\n    cout << \"big\";", "answer": "big", "explain": "The semicolon ends the if with an empty statement. The cout is a separate statement that always runs."}, {"id": "u8-q018", "lesson": "u8-l4", "type": "output", "difficulty": 2, "prompt": "What does this code print? Assume the code is inside main(), with iostream included and using namespace std; in effect.", "code": "int n = -1;\nif (n > 0)\n    cout << \"a\" << endl;\n    cout << \"b\" << endl;", "answer": "b", "explain": "Without braces only the first cout belongs to the if. The second always runs regardless of the indentation."}, {"id": "u8-q019", "lesson": "u8-l4", "type": "output", "difficulty": 3, "prompt": "What does this code print? Assume the code is inside main(), with iostream included and using namespace std; in effect.", "code": "int choice = 2;\nswitch (choice)\n{\n    case 1: cout << \"one\" << endl;\n    case 2: cout << \"two\" << endl;\n    case 3: cout << \"three\" << endl;\n            break;\n    default: cout << \"other\" << endl;\n}", "answer": "two\nthree", "explain": "Case 2 matches and with no break execution falls through into case 3, which does have a break."}, {"id": "u8-q020", "lesson": "u8-l4", "type": "output", "difficulty": 2, "prompt": "What does this code print? Assume the code is inside main(), with iostream included and using namespace std; in effect.", "code": "int a = 7, b = 2;\ndouble r1 = a / b;\ndouble r2 = static_cast<double>(a) / b;\ncout << r1 << \" \" << r2 << endl;", "answer": "3 3.5", "explain": "a / b is integer division giving 3 before it is stored in the double. Casting one operand first makes the division floating-point."}, {"id": "u8-q021", "lesson": "u8-l4", "type": "mc", "difficulty": 2, "prompt": "What is the bug in this code?", "code": "int sum;\nfor (int i = 1; i <= 5; i++)\n    sum += i;\ncout << sum;", "choices": ["The loop runs one time too many", "The variable i should be a double", "sum should be declared after the loop", "sum starts with an unpredictable value because it was never initialized"], "answer": 3, "explain": "A local int has no defined starting value, so the accumulator needs sum = 0. The loop bounds here are fine."}, {"id": "u8-q022", "lesson": "u8-l4", "type": "output", "difficulty": 2, "prompt": "The code is meant to add 1 through 5. What does it print? Assume the code is inside main(), with iostream included and using namespace std; in effect.", "code": "int sum = 0;\nfor (int i = 1; i < 5; i++)\n    sum += i;\ncout << sum << endl;", "answer": "10", "explain": "With i < 5 the loop stops before 5, adding 1+2+3+4 = 10. The fix is i <= 5."}, {"id": "u8-q023", "lesson": "u8-l4", "type": "mc", "difficulty": 3, "prompt": "What happens when this code runs?", "code": "int i = 0;\nwhile (i < 3);\n{\n    cout << i << \" \";\n    i++;\n}", "choices": ["The loop never ends and nothing is printed, because the semicolon is the loop body", "It prints 0 1 2", "It prints 0 1 2 3", "It prints nothing and ends normally"], "answer": 0, "explain": "while (i < 3); is a loop with an empty body; i never changes, so the condition stays true forever. The braced block after it is not part of the loop."}, {"id": "u8-q024", "lesson": "u8-l5", "type": "fill", "difficulty": 1, "prompt": "A dummy function that stands in for a real one and usually just displays a message that it was called is a ___.", "answer": "stub", "accept": ["stub", "a stub"], "explain": "Stubs let you test the code that calls a function before the function is written."}, {"id": "u8-q025", "lesson": "u8-l5", "type": "fill", "difficulty": 1, "prompt": "A small program that tests a function by calling it with test data and displaying the result is a ___.", "answer": "driver", "accept": ["driver", "a driver", "test driver", "driver program", "driver function"], "explain": "A driver lets you try the function out by itself, apart from everything else the program does."}, {"id": "u8-q026", "lesson": "u8-l5", "type": "tf", "difficulty": 2, "prompt": "A stub usually displays a message showing that it was called, rather than doing the real work.", "answer": true, "explain": "A stub only needs to show that it was reached and with what arguments, plus return a test value if the real function returns one."}, {"id": "u8-q027", "lesson": "u8-l5", "type": "mc", "difficulty": 2, "prompt": "You wrote main() with a menu but have not written the calcFee function yet. What should you use to test the menu logic?", "choices": ["A driver for calcFee", "A stub for calcFee", "A second compiler", "A larger set of boundary data for the menu only"], "answer": 1, "explain": "A stub replaces the missing function so main can run and you can see it is called with the right arguments. A driver would test calcFee, which does not exist yet."}, {"id": "u8-q028", "lesson": "u8-l5", "type": "output", "difficulty": 2, "prompt": "This program uses a stub for getTax. What does it print?", "code": "double getTax(double amount)\n{\n    cout << \"getTax called with \" << amount << endl;\n    return 10.0;\n}\n\nint main()\n{\n    double price = 200;\n    double total = price + getTax(price);\n    cout << \"Total: \" << total << endl;\n    return 0;\n}", "answer": "getTax called with 200\nTotal: 210", "explain": "The stub displays its message and returns the fixed test value 10, so the total is 200 + 10."}, {"id": "u8-q029", "lesson": "u8-l5", "type": "output", "difficulty": 2, "prompt": "This main() is a driver for the function square. What does it print?", "code": "int square(int n)\n{\n    return n * n;\n}\n\nint main()\n{\n    int tests[3] = {3, -2, 0};\n    for (int i = 0; i < 3; i++)\n        cout << tests[i] << \" -> \" << square(tests[i]) << endl;\n    return 0;\n}", "answer": "3 -> 9\n-2 -> 4\n0 -> 0", "explain": "A driver just calls the function with chosen test values and shows the results."}, {"id": "u8-q030", "lesson": "u8-l5", "type": "mc", "difficulty": 3, "prompt": "A stub for a function that returns an int should normally:", "choices": ["Return nothing, so the caller notices the failure", "Contain the full finished algorithm", "Display a message and return a fixed test value", "Call main() to test itself"], "answer": 2, "explain": "The caller needs some value to continue; a fixed test value lets you check how the caller uses the result."}, {"id": "u8-q031", "lesson": "u8-l1", "type": "mc", "difficulty": 2, "prompt": "A program contains the prototype `double computeTotal(double);` and calls computeTotal, but the function body was never written. Compiling the .cpp file succeeds, yet building the executable fails with \"undefined reference to computeTotal\". Which step reported the error?", "choices": ["The preprocessor", "The linker", "The running program", "The compiler's syntax check"], "answer": 1, "explain": "The prototype satisfies the compiler, so an object file is made. When the linker tries to connect the call to the function's code, it finds none and stops, so no executable is produced."}, {"id": "u8-q032", "lesson": "u8-l1", "type": "mc", "difficulty": 2, "prompt": "The compiler lists 14 errors. The first one is on line 9, where a statement is missing its semicolon. What is the best next step?", "choices": ["Fix the missing semicolon, then recompile and see which errors remain", "Fix all 14 errors, starting with the last one listed", "Run the program anyway, since only one line is really wrong", "Delete line 9 and every other line the messages mention"], "answer": 0, "explain": "One missing semicolon or brace confuses the compiler about the lines that follow and produces a cascade of messages. Fixing the first error often makes many of the others disappear."}, {"id": "u8-q033", "lesson": "u8-l1", "type": "mc", "difficulty": 1, "prompt": "A student types `Cout << \"Total\";` with a capital C. What happens?", "choices": ["It runs normally, because C++ ignores capitalization", "It compiles, but prints nothing at run time", "It compiles and runs, but the output is wrong (a logic error)", "The compiler reports an error, because C++ is case-sensitive and Cout is not defined"], "answer": 3, "explain": "C++ treats Cout and cout as different names. Cout was never declared, so this is a compile-time (syntax) error and no executable is made."}, {"id": "u8-q034", "lesson": "u8-l1", "type": "tf", "difficulty": 1, "prompt": "A syntax error is reported by the compiler. A mistake that shows itself only once the finished program is executing is called a runtime error.", "answer": true, "explain": "It shows up only when the program is executed, unlike a syntax error, which the compiler finds. Gaddis notes runtime errors are usually logic errors such as a math mistake; a crash such as integer division by zero also appears only at run time."}, {"id": "u8-q035", "lesson": "u8-l4", "type": "output", "difficulty": 2, "prompt": "The code should print \"out of range\" for any score below 0 or above 100. What does it print when score is 150? Assume the code is inside main(), with iostream included and using namespace std; in effect.", "code": "int score = 150;\nif (score < 0 && score > 100)\n    cout << \"out of range\" << endl;\nelse\n    cout << \"ok\" << endl;", "answer": "ok", "explain": "No number is both below 0 and above 100, so the && condition is always false and the else runs. The test needs ||: score < 0 || score > 100."}, {"id": "u8-q036", "lesson": "u8-l4", "type": "mc", "difficulty": 2, "prompt": "After `double total = 0.1 + 0.2;` a program tests `if (total == 0.3)`. Why is this test a bug risk?", "choices": ["== cannot be used with double values, so it is a compile error", "0.1 + 0.2 is computed as an integer, giving 0", "Doubles store most decimal fractions approximately, so the sum may differ from 0.3 in its last bits and the test can be false", "An if statement needs braces when it compares doubles"], "answer": 2, "explain": "Values like 0.1 have no exact binary form, so tiny rounding differences appear. Compare doubles by checking that the difference is within a small tolerance, such as fabs(total - 0.3) < 0.0001."}, {"id": "u8-q037", "lesson": "u8-l4", "type": "mc", "difficulty": 2, "prompt": "What is wrong with this loop?", "code": "int i = 1;\nwhile (i <= 5)\n{\n    cout << i << \" \";\n}", "choices": ["It prints 1 2 3 4 5 and stops", "i is never changed inside the loop, so the condition stays true and it prints 1 forever", "It never runs, because i starts at 1", "It runs 4 times, because of <="], "answer": 1, "explain": "A loop must change something its condition tests. Adding i++; inside the braces makes it print 1 to 5 and stop."}, {"id": "u8-q038", "lesson": "u8-l5", "type": "mc", "difficulty": 1, "prompt": "In a debugger, what is a breakpoint?", "choices": ["A line marked so the program pauses there, letting you examine variables before continuing", "A line where the compiler found a syntax error", "The point where the program crashes", "A comment that tells the compiler to skip a line"], "answer": 0, "explain": "When execution reaches a breakpoint it stops. You can then look at (watch) variables and step through the following statements one at a time."}, {"id": "u8-q039", "lesson": "u8-l5", "type": "tf", "difficulty": 2, "prompt": "A debugger can show you the variables' values only after the program has finished running.", "answer": false, "explain": "A debugger pauses the running program, at a breakpoint or one statement at a time (stepping), and shows current values while it is paused. It is an automated hand trace."}, {"id": "u8-q040", "lesson": "u8-l5", "type": "mc", "difficulty": 2, "prompt": "A loop that totals 10 input values gives the wrong total. Which temporary debugging statement gives the most useful information?", "choices": ["A cout inside the loop that prints the pass number, the value just read and the running total on each pass", "A cout before the loop that prints \"starting\"", "A cout after the loop that prints the final total", "A cout at the end of main that prints \"done\""], "answer": 0, "explain": "Printing the values on every pass shows the exact pass where the total first goes wrong. Remove or comment out such diagnostic lines once the bug is fixed."}, {"id": "u8-q041", "lesson": "u8-l2", "type": "output", "difficulty": 3, "prompt": "Hand trace this code. The user types 4 9 2 7 0. What does it print? Assume the code is inside main(), with iostream included and using namespace std; in effect.", "code": "int num, best = 0, count = 0;\ncin >> num;\nwhile (num != 0)\n{\n    if (num > best)\n        best = num;\n    count++;\n    cin >> num;\n}\ncout << count << \" \" << best << endl;", "answer": "4 9", "explain": "The loop handles 4, 9, 2 and 7, then reads 0 and stops, so count is 4. best changes to 4 and then to 9; 2 and 7 are not larger."}, {"id": "u8-q042", "lesson": "u8-l3", "type": "mc", "difficulty": 2, "prompt": "A program prints child for ages below 13, teen for 13 to 19, and adult for 20 and over. Which set of test ages checks the boundaries between the branches?", "choices": ["5, 15, 40", "13, 20", "0, 100", "12, 13, 19, 20"], "answer": 3, "explain": "Boundary tests sit on both sides of each cut-off: 12 and 13, then 19 and 20. 5, 15 and 40 run each branch once but would miss a < written where <= was needed."}, {"id": "u8-q043", "lesson": "u8-l3", "type": "mc", "difficulty": 2, "prompt": "A loop reads n numbers and totals them. Which values of n best test the loop?", "choices": ["Only a typical value such as 8", "Several typical values such as 7, 8 and 9", "0, 1 and a typical larger value such as 8", "Only the largest value the program allows"], "answer": 2, "explain": "Test a loop running zero times, once, and many times. The 0 and 1 cases catch a wrong starting value or an off-by-one test that typical values hide."}, {"id": "u8-q044", "lesson": "u8-l3", "type": "tf", "difficulty": 1, "prompt": "It is fine to run the program first and then use its output as the expected result for each test case.", "answer": false, "explain": "Expected output must be worked out by hand before running. Otherwise a wrong answer simply becomes the expected one and the test can never fail."}, {"id": "u8-q045", "lesson": "u8-l4", "type": "output", "difficulty": 3, "prompt": "What does this code print? Assume the code is inside main(), with iostream included and using namespace std; in effect.", "code": "int x = 5;\nif (x = 0)\n    cout << \"zero\";\nelse\n    cout << \"nonzero\";\ncout << \" \" << x << endl;", "answer": "nonzero 0", "explain": "x = 0 stores 0 in x, and the condition takes that value, 0, which is false, so the else runs. x is now 0. g++ -Wall warns about an assignment used as a condition, a hint that == was meant."}, {"id": "u8-q046", "lesson": "u8-l4", "type": "output", "difficulty": 2, "prompt": "What does this code print? Assume the code is inside main(), with iostream included and using namespace std; in effect.", "code": "for (int i = 0; i < 3; i++)\n    cout << i;\n    cout << \"x\";\ncout << endl;", "answer": "012x", "explain": "Without braces only the first cout is the loop body. The indented cout << \"x\" is a separate statement that runs once, after the loop ends."}, {"id": "u8-q047", "lesson": "u8-l4", "type": "fill", "difficulty": 1, "prompt": "A loop that runs one time too many or one time too few has an ___ error.", "answer": "off-by-one", "accept": ["off-by-one", "off by one", "off-by-one error", "off by one error", "obo", "fencepost", "fence-post", "fence post"], "explain": "It usually comes from the wrong comparison (< versus <=) or the wrong starting value. Boundary tests catch it."}], "programs": [{"id": "u8-p1", "title": "Fix the grade program", "task": "The program below should read three integer test scores, display their average, and display a letter grade (90 or more is A, 80 or more is B, otherwise C). It has several bugs. Describe each bug in a comment, then write the corrected program.\n\n#include <iostream>\nusing namespace std;\nint main()\n{\n    int s1, s2, s3;\n    double avg;\n    cin >> s1 >> s2 >> s3;\n    avg = s1 + s2 + s3 / 3;\n    cout << \"Average: \" << avg << endl;\n    if (avg = 90)\n        cout << \"Grade: A\" << endl;\n    else if (avg >= 80);\n        cout << \"Grade: B\" << endl;\n    else\n        cout << \"Grade: C\" << endl;\n    return 0;\n}", "stdin": "80 85 90", "sampleOutput": "Average: 85\nGrade: B", "solution": "#include <iostream>\nusing namespace std;\n\nint main()\n{\n    int s1, s2, s3;\n    double avg;\n    cin >> s1 >> s2 >> s3;\n\n    // Bug 1: s3 / 3 was done before the additions. Parentheses fix the precedence,\n    //        and 3.0 keeps the division from truncating.\n    avg = (s1 + s2 + s3) / 3.0;\n    cout << \"Average: \" << avg << endl;\n\n    // Bug 2: \"avg = 90\" assigned instead of testing. It should be avg >= 90.\n    if (avg >= 90)\n        cout << \"Grade: A\" << endl;\n    // Bug 3: a stray semicolon after the else-if ended it with an empty statement,\n    //        which also left the following else without an if (compile error).\n    else if (avg >= 80)\n        cout << \"Grade: B\" << endl;\n    else\n        cout << \"Grade: C\" << endl;\n    return 0;\n}\n"}, {"id": "u8-p2", "title": "Fix the sum and average program", "task": "The program below should read n and a mode. It adds the whole numbers 1 through n. Mode 1 displays the sum. Mode 2 displays the average of those numbers as a decimal (for n = 4 that is 2.5). Any other mode displays \"Unknown mode\". It has several bugs. Describe each in a comment, then write the corrected program.\n\n#include <iostream>\nusing namespace std;\nint main()\n{\n    int n, mode, sum;\n    cin >> n >> mode;\n    for (int i = 1; i < n; i++)\n        sum += i;\n    switch (mode)\n    {\n        case 1: cout << \"Sum: \" << sum << endl;\n        case 2: cout << \"Average: \" << sum / n << endl;\n                break;\n        default: cout << \"Unknown mode\" << endl;\n    }\n    return 0;\n}", "stdin": "4 2", "sampleOutput": "Average: 2.5", "solution": "#include <iostream>\nusing namespace std;\n\nint main()\n{\n    int n, mode;\n    int sum = 0;            // Bug 1: sum was never initialized\n    cin >> n >> mode;\n\n    for (int i = 1; i <= n; i++)   // Bug 2: i < n stopped one number short\n        sum += i;\n\n    switch (mode)\n    {\n        case 1:\n            cout << \"Sum: \" << sum << endl;\n            break;                 // Bug 3: no break, so mode 1 fell into case 2\n        case 2:\n            // Bug 4: sum / n was integer division (2, not 2.5)\n            cout << \"Average: \" << static_cast<double>(sum) / n << endl;\n            break;\n        default:\n            cout << \"Unknown mode\" << endl;\n    }\n    return 0;\n}\n"}]}, {"id": "u9", "title": "Introduction to objects", "summary": "Procedural versus object-oriented programming, classes and objects, private data and public member functions, accessors and mutators, constructors, and a first look at destructors, inline functions, separate files, arrays of objects and UML.", "lessons": [{"id": "u9-l1", "title": "Procedural versus object-oriented programming", "book": "Sections 1.7 and 13.1, pages 22 to 23 and 751 to 757", "html": "<p>In <strong>procedural programming<\/strong> the program is built around <strong>procedures<\/strong> (functions in C++). The data sits in separate variables and structures that are passed to the functions. The data and the code that works on it are separate things. When the data format changes, every function that touches it may have to change, which breeds bugs in large programs.<\/p>\n<p>In <strong>object-oriented programming (OOP)<\/strong> the program is built around <strong>objects<\/strong>. An object is a unit of software that packages some data together with the procedures that act on that data.<\/p>\n<ul>\n<li>The data in an object are its <strong>attributes<\/strong> (C++ calls them <strong>member variables<\/strong>).<\/li>\n<li>The procedures it performs are its <strong>member functions<\/strong>. Other languages call them <strong>methods<\/strong>.<\/li><\/ul>\n<h4>Encapsulation and data hiding<\/h4>\n<p><strong>Encapsulation<\/strong> means bundling the data with the code that works on it inside one object. <strong>Data hiding<\/strong> means an object can hide its data from code outside the object. Only the object's own member functions access the data directly; outside code uses the member functions as a simple <strong>interface<\/strong>. A car works like this: you use the pedals and wheel, not the linkages under the hood. Hidden data is protected from accidental corruption, and the inside of an object can be redesigned without breaking the code that uses it.<\/p>\n<h4>Class versus object<\/h4>\n<p>A <strong>class<\/strong> is code that describes the attributes and member functions a type of object has. It is a blueprint. It uses no memory for data by itself. An <strong>object<\/strong> is built from the class and holds real values. Each such object is an <strong>instance<\/strong> of its class. You can make many instances of one class, and each has its own copy of the attributes. Many houses can be built from one blueprint.<\/p>\n<h4>Reusability<\/h4>\n<p>An object is not a program by itself; it is used by programs. Because an object hides its inner workings behind an interface, the same class can be reused in many programs. Your code already uses objects written by others: <code>cin<\/code> and <code>cout<\/code>.<\/p>\n<p>C++ supports both styles. In this unit you only need classes with data and member functions. No inheritance, pointers or operator overloading.<\/p>"}, {"id": "u9-l2", "title": "Declaring a class", "book": "Section 13.2, pages 757 to 763", "html": "<p>A class declaration describes the members of the new type. Here is a class for a bank account:<\/p>\n<pre><code>class Account\n{\nprivate:\n    double balance;\n    double rate;\npublic:\n    void setBalance(double);\n    void setRate(double);\n    double getBalance() const;\n    double getRate() const;\n    double getInterest() const;\n};     // semicolon required<\/code><\/pre>\n<h4>Rules<\/h4>\n<ul>\n<li>The key word <code>class<\/code>, the class name, a body in braces, and a <strong>semicolon after the closing brace<\/strong>. Forgetting that semicolon is a classic error.<\/li>\n<li>Class names conventionally start with an uppercase letter.<\/li>\n<li>An <strong>access specifier<\/strong> controls who may use the members that follow it. <code>private:<\/code> members can be used only by member functions of the class. <code>public:<\/code> members can be used by any code. With no specifier written, a <code>class<\/code> treats its members as <strong>private<\/strong>. It is good style to write the specifier anyway.<\/li>\n<li>A <code>struct<\/code> is almost the same as a class; the difference is that struct members are <strong>public<\/strong> by default.<\/li>\n<li>Private and public sections may come in any order and may repeat; grouping them is style, not a rule.<\/li>\n<li>Since C++11 a member variable may get a starting value in its declaration, <code>double balance = 0.0;<\/code> (<strong>in-place initialization<\/strong>). Otherwise set it with a constructor or a mutator.<\/li><\/ul>\n<h4>Defining member functions<\/h4>\n<p>The class declares a function's prototype. The body can be written outside the class with the <strong>scope resolution operator<\/strong> <code>::<\/code> after the class name. Without <code>Account::<\/code> the compiler would think it is an ordinary function.<\/p>\n<pre><code>void Account::setBalance(double b)\n{\n    balance = b;\n}\ndouble Account::getInterest() const\n{\n    return balance * rate;\n}<\/code><\/pre>\n<p>Inside a member function you use the member names directly: no dot is needed. A function written entirely inside the class body is also legal (an inline member function).<\/p>\n<h4>const member functions<\/h4>\n<p>When <code>const<\/code> appears after the parameter list, the function promises not to change the object's member variables. The compiler rejects an attempt to modify one. <code>const<\/code> must appear in both the declaration and the definition. Use it for functions that only look at the data.<\/p>\n<pre><code>double Account::getBalance() const   // legal: only reads\n{ return balance; }\nvoid Counter::bump() const           // ERROR if it changes a member\n{ n++; }<\/code><\/pre>"}, {"id": "u9-l3", "title": "Creating and using objects", "book": "Section 13.3, pages 763 to 777", "html": "<p>A class declaration creates no objects. You define an object (an <strong>instance<\/strong>) the same way you define a variable, with the class name as the type. Defining an object is called <strong>instantiation<\/strong>.<\/p>\n<pre><code>Account acct;            // one instance\nAccount a, b;            // two instances<\/code><\/pre>\n<p>Each instance has its own copy of the member variables. Changing <code>a<\/code> does not change <code>b<\/code>.<\/p>\n<h4>The dot operator<\/h4>\n<p>To reach a public member of an object from outside the class, write the object name, a dot, and the member: the <strong>dot operator<\/strong>.<\/p>\n<pre><code>acct.setBalance(1000);\nacct.setRate(0.05);\ncout &lt;&lt; acct.getInterest();     // 50\nacct.balance = 4;               // ERROR: balance is private<\/code><\/pre>\n<p>A call such as <code>a.getInterest()<\/code> runs the function on <em>a's<\/em> data; <code>b.getInterest()<\/code> runs it on <em>b's<\/em> data. The object before the dot decides whose member variables are used; inside the member function the members are written by bare name, with no dot. The data an object holds at a given moment is its <strong>state<\/strong>. You already use objects this way: <code>name.length()<\/code> calls a member function of a <code>string<\/code> object.<\/p>\n<h4>Accessors and mutators<\/h4>\n<p>An <strong>accessor<\/strong> (getter) retrieves a value from an object without changing it; accessors are marked <code>const<\/code>. A <strong>mutator<\/strong> (setter) stores a value in a member variable or otherwise changes it. In the class above, <code>getBalance<\/code> and <code>getInterest<\/code> are accessors; <code>setBalance<\/code> and <code>setRate<\/code> are mutators.<\/p>\n<h4>Assignment and copies<\/h4>\n<p>Assigning one object of a class to another copies the member variables one by one. Afterward they are independent copies.<\/p>\n<pre><code>Account p, q;\np.setBalance(300);\nq = p;              // q now has balance 300\np.setBalance(900);  // q still 300<\/code><\/pre>\n<h4>Traps<\/h4>\n<ul><li>Using a class before it is declared, or leaving out the semicolon after the class.<\/li>\n<li>Member variables are not automatically set to 0. In an object defined inside a function they hold garbage until something stores a value (a constructor, covered below, solves this).<\/li>\n<li>Do not store a value that can be calculated from other members (such as the interest owed): it goes <strong>stale<\/strong> when those members change. Calculate it in a member function instead.<\/li>\n<li>Calling a non-const function through a const object is an error.<\/li><\/ul>"}, {"id": "u9-l4", "title": "Why have private members?", "book": "Section 13.4, pages 777 and 778", "html": "<p>If member variables were public, any code could assign them directly, including nonsense such as a negative age or a width of zero that later causes a divide-by-zero. The author of the class would have no control over what the data holds.<\/p>\n<h4>Making data private<\/h4>\n<p>Make the member variables <strong>private<\/strong> and provide <strong>public member functions<\/strong> as the <strong>interface<\/strong>. All outside access then goes through functions the class author wrote. This gives you:<\/p>\n<ul>\n<li><strong>Protection<\/strong>: a mutator can check its argument and refuse bad values.<\/li>\n<li><strong>Freedom to change the inside<\/strong>: if the class stored an angle in degrees and now stores it in radians, only the member functions change. Code that calls <code>setAngle(90)<\/code> keeps working.<\/li>\n<li><strong>Consistency<\/strong>: related members stay in step. If an object stores both a radius and a diameter, one mutator can update both.<\/li><\/ul>\n<pre><code>void Person::setAge(int a)\n{\n    if (a &gt;= 0)\n        age = a;      // ignore a bad value\n}<\/code><\/pre>\n<p>With public data this check could not be enforced. The usual design: data private, interface public. Helper functions that only the class itself needs can also be private.<\/p>\n<h4>Exam phrasing<\/h4>\n<p>\"Why should member variables be private?\" Best answer: so that they can be accessed or changed only through the class's member functions, which can validate the data and hide how it is stored.<\/p>"}, {"id": "u9-l5", "title": "Constructors and the default constructor", "book": "Sections 13.7 and 13.8, pages 786 to 798", "html": "<p>A <strong>constructor<\/strong> is a special member function that <strong>runs on its own at the moment an object comes into existence<\/strong>. Its job is to give the object's member variables their starting values.<\/p>\n<h4>Rules<\/h4>\n<ul><li>The constructor's name is <strong>identical to the class name<\/strong>.<\/li>\n<li>It has <strong>no return type<\/strong>, not even <code>void<\/code>.<\/li>\n<li>It is normally public.<\/li>\n<li>It runs once for each object created, before anything else is done with the object.<\/li><\/ul>\n<pre><code>class Box\n{\nprivate:\n    double width, height;\npublic:\n    Box();                 // default constructor\n    Box(double, double);   // takes arguments\n    double getArea() const;\n};\nBox::Box()                 { width = 1; height = 1; }\nBox::Box(double w, double h) { width = w; height = h; }<\/code><\/pre>\n<h4>Passing arguments<\/h4>\n<p>Put the arguments in parentheses after the object name:<\/p>\n<pre><code>Box a;            // runs Box()        : area 1\nBox b(3, 4);      // runs Box(double, double) : area 12<\/code><\/pre>\n<h4>The default constructor<\/h4>\n<p>A <strong>default constructor<\/strong> is any constructor you can call without supplying arguments: either it has no parameters, or all its parameters have default values. It runs for <code>Box a;<\/code>.<\/p>\n<ul><li>If you write <strong>no<\/strong> constructors at all, the compiler supplies a default constructor that does nothing useful to the member variables.<\/li>\n<li>If you write <strong>any<\/strong> constructor, the compiler no longer supplies one. A class with only <code>Box(double, double)<\/code> cannot be defined as <code>Box a;<\/code>: a compile error.<\/li>\n<li>Default arguments can combine several versions: <code>Box(double w = 1, double h = 1);<\/code> works for <code>Box a;<\/code>, <code>Box a(5);<\/code> (height 1) and <code>Box a(5, 6);<\/code>.<\/li>\n<li>A class cannot contain two default constructors. If it has both <code>Box()<\/code> and <code>Box(double w = 1)<\/code>, then <code>Box a;<\/code> is ambiguous and will not compile.<\/li>\n<li>Trap: <code>Box a();<\/code> does not create an object. It declares a function. Leave off the parentheses to use the default constructor.<\/li><\/ul>\n<h4>Member initialization list<\/h4>\n<p>A constructor can initialize members after a colon, before its body runs: <code>Box::Box() : width(1), height(1) { }<\/code>. The effect here is the same as assigning in the body.<\/p>"}, {"id": "u9-l6", "title": "More class features (first look)", "book": "Sections 13.5, 13.6, 13.9, 13.11, 13.12 and 13.15, pages 777 to 786, 799 to 802, 807 to 812 and 824 to 826", "html": "<p>These topics come up in the same chapter. Know the basic rule for each.<\/p>\n<h4>Inline member functions<\/h4>\n<p>A member function whose body is written inside the class declaration is an <strong>inline<\/strong> member function. It needs no <code>ClassName::<\/code>. Short accessors are often written this way:<\/p>\n<pre><code>double getBalance() const { return balance; }<\/code><\/pre>\n<h4>Separate files<\/h4>\n<p>By convention the class declaration goes in a header file named after the class, <code>Account.h<\/code> (the <strong>specification file<\/strong>), and the member function definitions go in <code>Account.cpp<\/code> (the <strong>implementation file<\/strong>). A program that uses the class writes <code>#include \"Account.h\"<\/code>, and Account.cpp is compiled and linked with it.<\/p>\n<h4>Destructors<\/h4>\n<p>A <strong>destructor<\/strong> runs automatically when an object is destroyed (for a local object, when its function ends). Its name is a tilde plus the class name, <code>~Account()<\/code>. Like a constructor it has no return type; unlike a constructor it takes no arguments, so a class has only one destructor.<\/p>\n<h4>Private member functions<\/h4>\n<p>A member function declared under <code>private:<\/code> can be called only by other member functions of the same class. Use it for an internal helper that outside code should never call.<\/p>\n<h4>Arrays of objects<\/h4>\n<p><code>Account accts[3];<\/code> creates three objects and runs the default constructor for <em>each<\/em> one. If the class has no default constructor, every element needs an initializer. Call a member function on one element with <code>accts[1].getInterest()<\/code>.<\/p>\n<h4>UML class diagrams<\/h4>\n<p>A UML class diagram is a box in three parts: the class name, the member variables, the member functions. A <code>-<\/code> before a member means private and <code>+<\/code> means public; types are written after a colon, as in <code>- balance : double<\/code> and <code>+ getInterest() : double<\/code>.<\/p>\n<h4>Input and output in a class<\/h4>\n<p>Member functions usually return values rather than using <code>cin<\/code> or <code>cout<\/code>, so that each program using the class can decide how to get input and show results. That keeps the class reusable.<\/p>"}], "questions": [{"id": "u9-q001", "lesson": "u9-l1", "type": "mc", "difficulty": 1, "prompt": "Which statement describes procedural programming?", "choices": ["The program is built around objects that contain their own data and functions", "The program has no functions, only classes", "The program is built around functions, and the data is kept in separate variables passed to them", "The data is always hidden from every function"], "answer": 2, "explain": "Procedural programming centers on procedures; data and code are separate. Bundling them is the object-oriented approach."}, {"id": "u9-q002", "lesson": "u9-l1", "type": "fill", "difficulty": 1, "prompt": "Combining data and the functions that operate on it into a single object is called ___.", "answer": "encapsulation", "accept": ["encapsulation"], "explain": "Encapsulation is bundling; data hiding is restricting outside access to the bundled data."}, {"id": "u9-q003", "lesson": "u9-l1", "type": "mc", "difficulty": 2, "prompt": "What is data hiding?", "choices": ["Encrypting the object's data when it is stored on disk", "Deleting variables that are no longer used", "Giving member variables short, unclear names", "Keeping an object's data out of direct reach of code outside the object, so only member functions can use it"], "answer": 3, "explain": "Data hiding means outside code goes through member functions. It protects data from accidental corruption."}, {"id": "u9-q004", "lesson": "u9-l1", "type": "mc", "difficulty": 2, "prompt": "Which statement about classes and objects is correct?", "choices": ["A class is a blueprint; an object is an instance made from it", "A class is an instance of an object", "An object is a blueprint; a class is made from it", "A class holds the data values; an object only holds functions"], "answer": 0, "explain": "One class can produce many objects, each with its own values. The class itself is only the description."}, {"id": "u9-q005", "lesson": "u9-l1", "type": "tf", "difficulty": 1, "prompt": "In OOP terms, the data in an object are its attributes and the procedures it performs are its member functions.", "answer": true, "explain": "In C++ the attributes are member variables. Other languages call member functions methods."}, {"id": "u9-q006", "lesson": "u9-l2", "type": "mc", "difficulty": 2, "prompt": "A class declaration contains the members below with no access specifier written. What is their access?", "code": "class Gadget\n{\n    int level;\n    void reset();\n};", "choices": ["public", "private", "protected, which is visible to all code in the file", "None; it is a compile error"], "answer": 1, "explain": "When a class declaration names no access specifier, its members are private. A struct is the opposite and defaults to public."}, {"id": "u9-q007", "lesson": "u9-l2", "type": "fill", "difficulty": 1, "prompt": "The access specifier that lets code outside the class use a member is ___.", "answer": "public", "accept": ["public", "public:"], "explain": "public members form the interface. private members are reachable only from the class's own member functions."}, {"id": "u9-q008", "lesson": "u9-l2", "type": "mc", "difficulty": 2, "prompt": "What does const after the parameter list of a member function mean?", "code": "double getArea() const;", "choices": ["The function can only be called once", "The function returns a constant value", "The function may not modify the object's member variables", "The member variables become public"], "answer": 2, "explain": "const member functions only read data. The compiler gives an error if they assign to a member."}, {"id": "u9-q009", "lesson": "u9-l2", "type": "tf", "difficulty": 2, "prompt": "The compiler accepts the class declaration below, which is followed directly by `main`.", "answer": false, "explain": "A class declaration must end with a semicolon after its closing brace. Without it the compiler reports an error, usually pointing at the next line.", "code": "class Pet\n{\npublic:\n    int age;\n}\n\nint main()\n{\n    return 0;\n}"}, {"id": "u9-q010", "lesson": "u9-l2", "type": "mc", "difficulty": 2, "prompt": "Which is the correct header for defining the const member function getInterest of class Account outside the class?", "choices": ["double getInterest() const", "double Account.getInterest() const", "double Account:getInterest() const", "double Account::getInterest() const"], "answer": 3, "explain": "Use the class name and the scope resolution operator ::. A dot is for objects, and a single colon is not an operator here."}, {"id": "u9-q011", "lesson": "u9-l2", "type": "fill", "difficulty": 2, "prompt": "When a member function is defined outside its class, the class name is followed by the ___ operator (written ::).", "answer": "scope resolution", "accept": ["scope resolution", "scope resolution operator", "::", "scope-resolution"], "explain": "The scope resolution operator ties the definition to the class so the compiler knows which class's function it is."}, {"id": "u9-q012", "lesson": "u9-l2", "type": "mc", "difficulty": 3, "prompt": "Why does this class fail to compile?", "code": "class Counter\n{\nprivate:\n    int n;\npublic:\n    void bump() const { n++; }\n};", "choices": ["bump is const but modifies the member variable n", "n is private so bump cannot use it", "A class may not have a function named bump", "The class is missing a return type for bump"], "answer": 0, "explain": "Member functions can always use private members. A const member function, though, may not change them."}, {"id": "u9-q013", "lesson": "u9-l3", "type": "fill", "difficulty": 1, "prompt": "The operator used to access a member of an object, as in box.getArea(), is the ___ operator.", "answer": "dot", "accept": ["dot", "dot operator", "member access operator", "member selection operator", "."], "explain": "The dot operator joins an object name and one of its public members."}, {"id": "u9-q014", "lesson": "u9-l3", "type": "output", "difficulty": 1, "prompt": "What does this program print?", "code": "class Tally\n{\nprivate:\n    int count;\npublic:\n    void setCount(int c) { count = c; }\n    void add(int n) { count += n; }\n    int getCount() const { return count; }\n};\n\nint main()\n{\n    Tally t;\n    t.setCount(5);\n    t.add(3);\n    t.add(4);\n    cout << t.getCount() << endl;\n    return 0;\n}", "answer": "12", "explain": "setCount stores 5, then two add calls make 5 + 3 + 4 = 12."}, {"id": "u9-q015", "lesson": "u9-l3", "type": "output", "difficulty": 2, "prompt": "What does this program print?", "code": "class Box\n{\nprivate:\n    double width;\n    double height;\npublic:\n    void setWidth(double w) { width = w; }\n    void setHeight(double h) { height = h; }\n    double getArea() const { return width * height; }\n};\n\nint main()\n{\n    Box a, b;\n    a.setWidth(2);\n    a.setHeight(3);\n    b.setWidth(4);\n    b.setHeight(5);\n    cout << a.getArea() << \" \" << b.getArea() << endl;\n    return 0;\n}", "answer": "6 20", "explain": "Each Box object has its own width and height. a is 2 by 3 and b is 4 by 5."}, {"id": "u9-q016", "lesson": "u9-l3", "type": "mc", "difficulty": 1, "prompt": "A member function that stores a value in a member variable is called a(n) ___.", "choices": ["accessor", "mutator", "constructor", "stub"], "answer": 1, "explain": "Mutators (setters) change data. Accessors (getters) only return it."}, {"id": "u9-q017", "lesson": "u9-l3", "type": "mc", "difficulty": 2, "prompt": "The class Account has a private member balance and public functions deposit, getBalance and setOwner. Which statement in main causes a compile error?", "code": "Account acct;\nacct.deposit(50);\ncout << acct.getBalance();\nacct.balance = 100;\nacct.setOwner(\"Lee\");", "choices": ["acct.deposit(50);", "cout << acct.getBalance();", "acct.balance = 100;", "acct.setOwner(\"Lee\");"], "answer": 2, "explain": "balance is private, so code outside the class cannot use it with the dot operator. The public member functions are fine."}, {"id": "u9-q018", "lesson": "u9-l3", "type": "output", "difficulty": 3, "prompt": "What does this program print?", "code": "class Tally\n{\nprivate:\n    int count;\npublic:\n    void setCount(int c) { count = c; }\n    void add(int n) { count += n; }\n    int getCount() const { return count; }\n};\n\nint main()\n{\n    Tally p, q;\n    p.setCount(5);\n    q = p;\n    p.add(3);\n    cout << p.getCount() << \" \" << q.getCount() << endl;\n    return 0;\n}", "answer": "8 5", "explain": "q = p copies the members. After that p and q are separate objects, so adding 3 to p does not change q."}, {"id": "u9-q019", "lesson": "u9-l3", "type": "tf", "difficulty": 2, "prompt": "Two objects of the same class share a single copy of the member variables.", "answer": false, "explain": "Each object has its own copy of every ordinary (non-static) member variable. Only the member function code is shared."}, {"id": "u9-q020", "lesson": "u9-l4", "type": "mc", "difficulty": 2, "prompt": "What is the main benefit of making member variables private and providing public mutators?", "choices": ["The program runs faster", "The variables use less memory", "No member functions are needed", "Mutators can check values before storing them, and the inside of the class can change without breaking other code"], "answer": 3, "explain": "Private data forces all changes through functions that can validate, and hides the data layout. It does not affect speed or memory."}, {"id": "u9-q021", "lesson": "u9-l4", "type": "output", "difficulty": 2, "prompt": "What does this program print?", "code": "class Person\n{\nprivate:\n    int age;\npublic:\n    void setAge(int a)\n    {\n        if (a >= 0)\n            age = a;\n    }\n    int getAge() const { return age; }\n};\n\nint main()\n{\n    Person p;\n    p.setAge(20);\n    p.setAge(-5);\n    cout << p.getAge() << endl;\n    return 0;\n}", "answer": "20", "explain": "setAge ignores a negative argument, so the age stays 20 after the second call. With a public variable this protection would not exist."}, {"id": "u9-q022", "lesson": "u9-l4", "type": "tf", "difficulty": 2, "prompt": "If a class keeps its data private, its internal storage can be redesigned without changing the code that calls its public member functions.", "answer": true, "explain": "The public functions are the interface. As long as they behave the same, callers do not care how the data is stored."}, {"id": "u9-q023", "lesson": "u9-l4", "type": "fill", "difficulty": 2, "prompt": "The public member functions through which outside code works with an object are called its ___.", "answer": "interface", "accept": ["interface", "public interface"], "explain": "A simple interface hides the complicated internals, like the pedals and steering wheel of a car."}, {"id": "u9-q024", "lesson": "u9-l5", "type": "fill", "difficulty": 1, "prompt": "A member function that is called automatically when an object is created is a ___.", "answer": "constructor", "accept": ["constructor", "a constructor"], "explain": "The constructor initializes the object. It runs once per object, when the object is defined."}, {"id": "u9-q025", "lesson": "u9-l5", "type": "mc", "difficulty": 2, "prompt": "Which is a valid declaration of a constructor taking one double for the class Account?", "choices": ["Account(double b);", "void Account(double b);", "account(double b);", "Account(double b) const;"], "answer": 0, "explain": "A constructor has the class's exact name and no return type, not even void. Constructors are not const."}, {"id": "u9-q026", "lesson": "u9-l5", "type": "output", "difficulty": 2, "prompt": "What does this program print?", "code": "class Box\n{\nprivate:\n    double width, height;\npublic:\n    Box() { width = 1; height = 1; }\n    Box(double w, double h) { width = w; height = h; }\n    double getArea() const { return width * height; }\n};\n\nint main()\n{\n    Box a;\n    Box b(3, 4);\n    cout << a.getArea() << \" \" << b.getArea() << endl;\n    return 0;\n}", "answer": "1 12", "explain": "Box a uses the default constructor (1 by 1, area 1). Box b(3, 4) uses the two-argument constructor."}, {"id": "u9-q027", "lesson": "u9-l5", "type": "mc", "difficulty": 1, "prompt": "What is a default constructor?", "choices": ["The constructor that runs when the program ends", "A constructor that can be called with no arguments", "A constructor that has a void return type", "The only constructor a class is allowed to have"], "answer": 1, "explain": "A default constructor has no parameters (or all parameters have defaults) and runs for a definition like Box a;."}, {"id": "u9-q028", "lesson": "u9-l5", "type": "mc", "difficulty": 3, "prompt": "Why does this code fail to compile?", "code": "class Rect\n{\nprivate:\n    double w, h;\npublic:\n    Rect(double a, double b) { w = a; h = b; }\n};\n\nint main()\n{\n    Rect r;\n}", "choices": ["Constructors cannot have parameters", "Rect r; needs parentheses: Rect r();", "The class has a constructor with parameters, so the compiler supplies no default constructor for Rect r;", "The constructor must return a value"], "answer": 2, "explain": "Writing any constructor cancels the automatic default one. Add Rect() or give the parameters default values. Rect r(); would declare a function."}, {"id": "u9-q029", "lesson": "u9-l5", "type": "output", "difficulty": 3, "prompt": "What does this program print?", "code": "class Pt\n{\nprivate:\n    int x, y;\npublic:\n    Pt(int a = 0, int b = 0) { x = a; y = b; }\n    void show() const { cout << x << \",\" << y << endl; }\n};\n\nint main()\n{\n    Pt a;\n    Pt b(5);\n    Pt c(5, 6);\n    a.show();\n    b.show();\n    c.show();\n    return 0;\n}", "answer": "0,0\n5,0\n5,6", "explain": "The default arguments fill in missing values: Pt a uses 0 and 0, Pt b(5) uses y = 0, and Pt c(5, 6) uses both arguments."}, {"id": "u9-q030", "lesson": "u9-l5", "type": "tf", "difficulty": 1, "prompt": "A constructor is declared with the return type void.", "answer": false, "explain": "A constructor has no return type at all, not even void."}, {"id": "u9-q031", "lesson": "u9-l3", "type": "fill", "difficulty": 1, "prompt": "Defining an object of a class, as in `Account acct;`, is called the ___ of the class.", "answer": "instantiation", "accept": ["instantiation", "instantiating", "instantiation of the class", "instantiation of a class"], "explain": "The object created is an instance of the class. A class declaration alone instantiates nothing."}, {"id": "u9-q032", "lesson": "u9-l2", "type": "tf", "difficulty": 2, "prompt": "If no access specifier is written, members of a struct are public, while members of a class are private.", "answer": true, "explain": "That default is the main difference between the two. Otherwise classes and structs are very similar in C++."}, {"id": "u9-q033", "lesson": "u9-l2", "type": "mc", "difficulty": 2, "prompt": "Look at this member function header. What is the function's name, and which class is it a member of?", "code": "void Lamp::setWatts(int w)", "choices": ["Name Lamp, member of class setWatts", "Name void, member of class Lamp", "Name Lamp::setWatts, not a member of any class", "Name setWatts, member of class Lamp"], "answer": 3, "explain": "In ReturnType ClassName::functionName(parameters), the name before :: is the class and the name after it is the function. void is the return type."}, {"id": "u9-q034", "lesson": "u9-l3", "type": "mc", "difficulty": 1, "prompt": "Class Lamp has a public void member function setWatts that takes an int. desk is a Lamp object. Which statement correctly calls setWatts for desk?", "choices": ["desk.setWatts(60);", "desk::setWatts(60);", "Lamp::setWatts(60);", "setWatts(desk, 60);"], "answer": 0, "explain": "Call a member function with the object, the dot operator and the function name. :: belongs in the header of a member function definition, not in a call."}, {"id": "u9-q035", "lesson": "u9-l2", "type": "tf", "difficulty": 1, "prompt": "In a class declaration, all private members must be declared before the public members.", "answer": false, "explain": "public and private sections may come in any order and may even appear more than once. Grouping each kind together is good style, not a rule."}, {"id": "u9-q036", "lesson": "u9-l3", "type": "mc", "difficulty": 1, "prompt": "Class Thermostat has these member functions. Which one is an accessor?", "choices": ["void setTarget(double t)", "double getTarget() const", "void raise(double amount)", "Thermostat()"], "answer": 1, "explain": "An accessor returns a member's value without changing it, so it is marked const. setTarget and raise change data (mutators), and Thermostat() is a constructor."}, {"id": "u9-q037", "lesson": "u9-l5", "type": "output", "difficulty": 2, "prompt": "What does this program print?", "code": "class Greeter\n{\npublic:\n    Greeter() { cout << \"built\" << endl; }\n};\n\nint main()\n{\n    cout << \"before\" << endl;\n    Greeter g;\n    cout << \"after\" << endl;\n    return 0;\n}", "answer": "before\nbuilt\nafter", "explain": "A constructor runs automatically at the moment the object is defined. g is defined between the two cout statements, so its message appears between them."}, {"id": "u9-q038", "lesson": "u9-l3", "type": "mc", "difficulty": 2, "prompt": "Class Account has private double members balance and rate and no constructor. Inside main, `Account acct;` is defined. What do balance and rate hold right after this statement?", "choices": ["0 and 0, because member variables start at zero", "1 and 1", "Nothing, because the statement is a compile error", "Unpredictable garbage values, until something stores values in them"], "answer": 3, "explain": "Member variables are not automatically set to 0. Using them before storing a value gives garbage, which is why a constructor that sets them is a good idea."}, {"id": "u9-q039", "lesson": "u9-l3", "type": "mc", "difficulty": 2, "prompt": "Account stores balance and rate but has no interest member; getInterest() calculates balance * rate each time it is called. Why is that the better design?", "choices": ["Multiplication is not allowed inside a member variable declaration", "A stored interest figure would go stale: it would be wrong as soon as balance or rate changed", "A class may not have more than two member variables", "getInterest would have to be private if the interest were stored"], "answer": 1, "explain": "Data that depends on other data becomes stale when the other data changes and it does not. Calculating the value on request always gives the current answer."}, {"id": "u9-q040", "lesson": "u9-l3", "type": "mc", "difficulty": 2, "prompt": "Inside the definition of Account::getInterest, how does the code refer to the calling object's balance member?", "choices": ["acct.balance", "Account.balance", "balance", "getInterest.balance"], "answer": 2, "explain": "A member function has direct access to the members of the object that called it, so it uses the bare name. For acct.getInterest() that is acct's balance; for another object's call it is that object's balance."}, {"id": "u9-q041", "lesson": "u9-l1", "type": "output", "difficulty": 2, "prompt": "string is a class, and word is an object of it. What does this code print? Assume the code is inside main(), with iostream and string included and using namespace std; in effect.", "code": "string word = \"tree\";\nword.append(\"house\");\ncout << word << \" \" << word.length() << endl;", "answer": "treehouse 9", "explain": "append and length are member functions called through the object with the dot operator. append adds \"house\" to the stored text, and length returns its 9 characters."}, {"id": "u9-q042", "lesson": "u9-l5", "type": "output", "difficulty": 3, "prompt": "What does this program print?", "code": "class Timer\n{\nprivate:\n    int secs;\npublic:\n    Timer() : secs(30) { }\n    Timer(int s) : secs(s) { }\n    int getSecs() const { return secs; }\n};\n\nint main()\n{\n    Timer a;\n    Timer b(90);\n    cout << a.getSecs() << \" \" << b.getSecs() << endl;\n    return 0;\n}", "answer": "30 90", "explain": "The part after the colon is a member initialization list: secs(30) sets secs before the empty body runs. Timer a uses the default constructor and Timer b(90) the one that takes an int."}, {"id": "u9-q043", "lesson": "u9-l5", "type": "mc", "difficulty": 3, "prompt": "Why does `Lamp desk;` fail to compile with this class?", "code": "class Lamp\n{\nprivate:\n    int watts;\npublic:\n    Lamp() { watts = 40; }\n    Lamp(int w = 60) { watts = w; }\n};", "choices": ["A constructor cannot have a default argument", "Both constructors can be called with no arguments, so the call is ambiguous; a class cannot have two default constructors", "Lamp desk; needs empty parentheses: Lamp desk();", "watts must be public for a constructor to set it"], "answer": 1, "explain": "A constructor whose parameters all have defaults is also a default constructor, so the compiler cannot choose. Lamp desk(75); would compile, because only the second constructor takes one argument."}, {"id": "u9-q044", "lesson": "u9-l2", "type": "tf", "difficulty": 2, "prompt": "Since C++11, a member variable may be given an initial value in its declaration inside the class, as in `double rate = 0.05;`.", "answer": true, "explain": "This is in-place initialization. Before C++11 a constructor (or its member initialization list) had to set starting values."}, {"id": "u9-q045", "lesson": "u9-l6", "type": "mc", "difficulty": 2, "prompt": "Which statement about a destructor is true?", "choices": ["It is named with a tilde and the class name, has no return type and no parameters, and runs automatically when the object is destroyed", "It can take any number of arguments, like a constructor", "It must be called explicitly at the end of main", "It returns true when the object was destroyed successfully"], "answer": 0, "explain": "For class Lamp the destructor is ~Lamp(). It cannot return a value or take arguments, so a class has only one destructor."}, {"id": "u9-q046", "lesson": "u9-l6", "type": "output", "difficulty": 2, "prompt": "What does this program print?", "code": "class Star\n{\npublic:\n    Star() { cout << \"*\"; }\n};\n\nint main()\n{\n    Star sky[4];\n    cout << endl;\n    return 0;\n}", "answer": "****", "explain": "Defining an array of objects runs the default constructor once for each element, not only for the first one."}, {"id": "u9-q047", "lesson": "u9-l6", "type": "fill", "difficulty": 1, "prompt": "A member function whose body is written inside the class declaration is called an ___ member function.", "answer": "inline", "accept": ["inline", "in-line", "inline function", "inline member function"], "explain": "Short functions such as accessors are often written this way. A body written outside the class needs ClassName:: in its header."}, {"id": "u9-q048", "lesson": "u9-l6", "type": "mc", "difficulty": 2, "prompt": "By the usual convention, where are the declaration of class Kettle and the definitions of its member functions stored?", "choices": ["Both in the file that contains main", "The declaration in Kettle.cpp and the member function definitions in Kettle.h", "The declaration in Kettle.h (the specification file) and the member function definitions in Kettle.cpp (the implementation file)", "The declaration in Kettle.exe and the definitions in Kettle.obj"], "answer": 2, "explain": "A program that uses the class includes Kettle.h, and Kettle.cpp is compiled and linked with it. Small examples may keep everything in one file, but this split is the convention."}, {"id": "u9-q049", "lesson": "u9-l6", "type": "mc", "difficulty": 1, "prompt": "In a UML class diagram, what does a minus sign (-) in front of a member name mean?", "choices": ["The member is private", "The member is public", "The member is a constructor", "The member returns a negative value"], "answer": 0, "explain": "UML marks private members with - and public members with +. The diagram's three parts hold the class name, the member variables and the member functions."}, {"id": "u9-q050", "lesson": "u9-l6", "type": "tf", "difficulty": 2, "prompt": "Code in main can call a private member function of a class, as long as it uses an object and the dot operator.", "answer": false, "explain": "A private member function can be called only by other member functions of the same class. Make a function private when it is an internal helper that outside code should not call."}, {"id": "u9-q051", "lesson": "u9-l2", "type": "mc", "difficulty": 3, "prompt": "Which list names every error in this class declaration?", "code": "class Lamp:\n{\nprivate\n    int watts;\npublic\n    setWatts(int);\n}", "choices": ["Only the missing semicolon after the closing brace", "The colon after Lamp, the missing colons after private and public, no return type on setWatts, and no semicolon after the closing brace", "watts must be public, and the key word must be written Class", "The colon after Lamp and the missing semicolon; everything else is legal"], "answer": 1, "explain": "The header is just class Lamp, each access specifier ends in a colon, every member function other than a constructor or destructor needs a return type (void here), and the declaration ends with };."}, {"id": "u9-q052", "lesson": "u9-l2", "type": "mc", "difficulty": 3, "prompt": "This code fails to compile. What is wrong?", "code": "class Scale\n{\nprivate:\n    int kg;\npublic:\n    void setKg(int);\n};\n\nvoid setKg(int k)\n{\n    kg = k;\n}", "choices": ["kg must be public for setKg to use it", "setKg cannot take a parameter", "A class may not have a member named kg", "The definition header lacks Scale::, so it defines an ordinary function that cannot see kg"], "answer": 3, "explain": "Without Scale:: the function is not the member, so the name kg means nothing inside it. The header should be void Scale::setKg(int k)."}, {"id": "u9-q053", "lesson": "u9-l6", "type": "mc", "difficulty": 2, "prompt": "Why do class designers usually avoid putting cin and cout statements inside member functions such as setWidth or getArea?", "choices": ["cin and cout cannot be used inside a class", "Member functions run before main, when the screen is not ready", "The class would be tied to one way of doing input and output, making it harder to reuse; the program using the class should handle the I/O", "It would make the member variables public"], "answer": 2, "explain": "A class that prompts or prints on its own forces that behavior on every program that uses it. Returning values and letting the calling program display them keeps the class reusable."}, {"id": "u9-q054", "lesson": "u9-l3", "type": "mc", "difficulty": 1, "prompt": "What is an object's state?", "choices": ["The data stored in its member variables at a given moment", "The list of member functions its class declares", "Whether its class is public or private", "The file in which its class is declared"], "answer": 0, "explain": "Calling mutators changes an object's state. Two objects of the same class usually have different states."}], "programs": [{"id": "u9-p1", "title": "Rectangle class", "task": "Write a class named Room with private double members length and width. Provide public member functions: setLength(double), setWidth(double), getArea() const and getPerimeter() const. In main, read a length and a width from the user (no prompts), store them in a Room object using the mutators, and display the area and perimeter on separate lines in the form \"Area: 60\" and \"Perimeter: 34\".", "stdin": "12 5", "sampleOutput": "Area: 60\nPerimeter: 34", "solution": "#include <iostream>\nusing namespace std;\n\nclass Room\n{\nprivate:\n    double length;\n    double width;\npublic:\n    void setLength(double);\n    void setWidth(double);\n    double getArea() const;\n    double getPerimeter() const;\n};\n\nvoid Room::setLength(double len)\n{\n    length = len;\n}\n\nvoid Room::setWidth(double w)\n{\n    width = w;\n}\n\ndouble Room::getArea() const\n{\n    return length * width;\n}\n\ndouble Room::getPerimeter() const\n{\n    return 2 * (length + width);\n}\n\nint main()\n{\n    double l, w;\n    Room room;\n\n    cin >> l >> w;\n    room.setLength(l);\n    room.setWidth(w);\n\n    cout << \"Area: \" << room.getArea() << endl;\n    cout << \"Perimeter: \" << room.getPerimeter() << endl;\n    return 0;\n}\n"}, {"id": "u9-p2", "title": "Account class with constructors", "task": "Write a class named Account with a private double member balance.\n- A default constructor sets the balance to 0.\n- A constructor taking one double sets the starting balance.\n- deposit(double amount) adds the amount only if it is greater than 0.\n- withdraw(double amount) returns bool: it subtracts the amount and returns true only if the amount is greater than 0 and not more than the balance; otherwise it changes nothing and returns false.\n- getBalance() const returns the balance.\nIn main: create Account a(100) and Account b (default). Read three numbers from the user: a deposit, then two withdrawals. Deposit into a, then attempt the first withdrawal; if it fails display \"Withdrawal of X refused\" (X is the amount). Then make the second withdrawal. Display \"Balance: \" and a's balance, then \"Empty account: \" and b's balance, one per line.", "stdin": "50 500 30", "sampleOutput": "Withdrawal of 500 refused\nBalance: 120\nEmpty account: 0", "solution": "#include <iostream>\nusing namespace std;\n\nclass Account\n{\nprivate:\n    double balance;\npublic:\n    Account();\n    Account(double);\n    void deposit(double);\n    bool withdraw(double);\n    double getBalance() const;\n};\n\nAccount::Account()\n{\n    balance = 0;\n}\n\nAccount::Account(double start)\n{\n    balance = start;\n}\n\nvoid Account::deposit(double amount)\n{\n    if (amount > 0)\n        balance += amount;\n}\n\nbool Account::withdraw(double amount)\n{\n    if (amount > 0 && amount <= balance)\n    {\n        balance -= amount;\n        return true;\n    }\n    return false;\n}\n\ndouble Account::getBalance() const\n{\n    return balance;\n}\n\nint main()\n{\n    Account a(100);\n    Account b;\n    double dep, w1, w2;\n\n    cin >> dep >> w1 >> w2;\n    a.deposit(dep);\n    if (!a.withdraw(w1))\n        cout << \"Withdrawal of \" << w1 << \" refused\" << endl;\n    a.withdraw(w2);\n\n    cout << \"Balance: \" << a.getBalance() << endl;\n    cout << \"Empty account: \" << b.getBalance() << endl;\n    return 0;\n}\n"}]}, {"id": "u2", "title": "C++ basics", "summary": "The parts of a C++ program, output with cout, variables and data types, assignment, scope, arithmetic, comments and named constants.", "lessons": [{"id": "u2-l1", "title": "Program parts, cout and #include", "book": "Sections 2.1 to 2.3, pages 27 to 39", "html": "<p>A C++ program is built from a few standard pieces. Lines beginning with <code>#<\/code> are <strong>preprocessor directives<\/strong>, carried out by the preprocessor <em>before<\/em> the compiler runs; <code>#include &lt;iostream&gt;<\/code> pastes in the header file that declares <code>cout<\/code> and <code>cin<\/code>. <code>using namespace std;<\/code> lets you write <code>cout<\/code> instead of <code>std::cout<\/code>. Every program has exactly one function named <code>main<\/code>; <strong>execution always begins in <code>main<\/code><\/strong>. Braces <code>{ }<\/code> enclose the body, and <code>return 0;<\/code> reports success to the operating system.<\/p><pre><code>#include &lt;iostream&gt;\nusing namespace std;\n\nint main()\n{\n    cout &lt;&lt; \"Hello\" &lt;&lt; endl;\n    return 0;\n}<\/code><\/pre><p>Each <strong>statement<\/strong> ends in a semicolon. Directives (<code>#include<\/code>) are not statements and take no semicolon. Whitespace and line breaks between tokens are ignored, so one statement may span several lines. <strong>Key words<\/strong> (<code>int<\/code>, <code>return<\/code>, <code>const<\/code>) are reserved; <strong>programmer-defined names<\/strong> are ones you invent; <strong>literals<\/strong> (<code>5<\/code>, <code>\"Hi\"<\/code>) are values typed directly in the code; <strong>operators<\/strong> (<code>&lt;&lt;<\/code>, <code>+<\/code>) do work; <strong>punctuation<\/strong> (<code>;<\/code>, <code>{<\/code>, <code>,<\/code>) separates things.<\/p><h4>The cout object<\/h4><p><code>cout<\/code> is the standard output stream object. <code>&lt;&lt;<\/code> is the <strong>stream insertion operator<\/strong>: it sends the value on its right into the stream on its left. Insertions chain left to right: <code>cout &lt;&lt; \"x = \" &lt;&lt; x &lt;&lt; endl;<\/code>. Output is exactly what you insert; nothing adds spaces or line breaks for you. A string literal goes between double quotes and cannot span source lines.<\/p><p><code>endl<\/code> ends the line <strong>and flushes<\/strong> the output buffer. The escape sequence <code>\\n<\/code> inside a string only ends the line. An escape sequence is typed as a backslash plus a character but is stored as <strong>one<\/strong> character, so <code>\"a\\tb\"<\/code> holds 3 characters:<\/p><table><thead><tr><th>Sequence<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>\\n<\/code><\/td><td>newline<\/td><\/tr><tr><td><code>\\t<\/code><\/td><td>horizontal tab<\/td><\/tr><tr><td><code>\\\\<\/code><\/td><td>one backslash<\/td><\/tr><tr><td><code>\\\"<\/code><\/td><td>a double quote<\/td><\/tr><tr><td><code>\\'<\/code><\/td><td>a single quote<\/td><\/tr><tr><td><code>\\a<\/code><\/td><td>alert (bell)<\/td><\/tr><tr><td><code>\\r<\/code><\/td><td>carriage return<\/td><\/tr><\/tbody><\/table><p>10th edition addition: a <strong>raw string literal<\/strong> is written <code>R\"(text)\"<\/code>. Everything between <code>(<\/code> and <code>)<\/code> is taken literally, backslashes included, and it may span several lines. <code>R\"(C:\\temp\\new)\"<\/code> prints <code>C:\\temp\\new<\/code> with no tab or newline. Trap: forgetting a semicolon, writing <code>cout &gt;&gt; x<\/code>, or leaving out <code>#include &lt;iostream&gt;<\/code> all fail to compile. Writing <code>/n<\/code> with a forward slash is not an escape sequence: cout prints a slash and an n.<\/p>"}, {"id": "u2-l2", "title": "Variables, literals, assignment and identifiers", "book": "Sections 2.4 and 2.5, pages 39 to 44", "html": "<p>A <strong>variable<\/strong> is a named location in memory that holds a value of one data type. It must be <strong>defined<\/strong> before use: <code>int count;<\/code> gives it a name, a type and storage. A value is placed in it by an <strong>assignment statement<\/strong>: <code>count = 12;<\/code>. The <code>=<\/code> operator copies the value of the right side into the variable on the left, so the left side must be a variable; <code>12 = count;<\/code> is an error. Assignment is not an equation: <code>x = x + 1;<\/code> is legal and adds one.<\/p><pre><code>int a = 5;\nint b = a;   // copy: b is 5\na = 9;       // b is still 5<\/code><\/pre><p>A <strong>literal<\/strong> is a value written directly in code: <code>42<\/code> (integer), <code>3.5<\/code> (floating point), <code>'z'<\/code> (character), <code>\"zebra\"<\/code> (string). A name that stands for a value is not a literal.<\/p><h4>Identifiers<\/h4><p>An <strong>identifier<\/strong> is a name the programmer chooses. Rules: letters, digits and underscore only; it must <strong>not start with a digit<\/strong>; no spaces or punctuation such as <code>-<\/code>, <code>$<\/code>, <code>.<\/code>; it cannot be a reserved key word; and it is <strong>case sensitive<\/strong>, so <code>Sales<\/code>, <code>sales<\/code> and <code>SALES<\/code> are three different names.<\/p><table><thead><tr><th>Name<\/th><th>Legal?<\/th><th>Why<\/th><\/tr><\/thead><tbody><tr><td><code>total_2<\/code><\/td><td>yes<\/td><td><\/td><\/tr><tr><td><code>_hold<\/code><\/td><td>yes<\/td><td>underscore may lead<\/td><\/tr><tr><td><code>2nd<\/code><\/td><td>no<\/td><td>starts with a digit<\/td><\/tr><tr><td><code>my total<\/code><\/td><td>no<\/td><td>contains a space<\/td><\/tr><tr><td><code>net-pay<\/code><\/td><td>no<\/td><td>hyphen is the minus operator<\/td><\/tr><tr><td><code>double<\/code><\/td><td>no<\/td><td>key word<\/td><\/tr><tr><td><code>Count<\/code><\/td><td>yes<\/td><td>differs from <code>count<\/code><\/td><\/tr><\/tbody><\/table><p>Good names describe their purpose (<code>monthlyPay<\/code>, not <code>x<\/code>), which makes the program <strong>self-documenting<\/strong>. Common styles are camelCase and snake_case; pick one and keep it. Exam traps: an identifier that is legal but misspelled differently on a later line is a different, undefined variable; and a variable defined twice in the same scope is an error.<\/p>"}, {"id": "u2-l3", "title": "Integer types and char", "book": "Sections 2.6 and 2.7, pages 44 to 54", "html": "<p>Integer types hold whole numbers. In increasing size: <code>short<\/code>, <code>int<\/code>, <code>long<\/code>, <code>long long<\/code>. The standard guarantees only the ordering <code>short &lt;= int &lt;= long &lt;= long long<\/code>; exact byte counts depend on the system (commonly 2, 4, 4 or 8, 8). <code>unsigned<\/code> before a type uses the same storage for non-negative values only, which roughly doubles the largest positive value it can hold. Each type has a minimum and maximum; going outside it is <strong>overflow<\/strong> (Chapter 3).<\/p><h4>Integer literals<\/h4><ul><li><code>25<\/code> is decimal; a leading 0 makes <strong>octal<\/strong>, so <code>012<\/code> is 10; <code>0x1F<\/code> is hexadecimal (31).<\/li><li>10th edition: <code>0b1010<\/code> is a <strong>binary literal<\/strong> (value 10).<\/li><li>10th edition: a single quote may separate digits for readability: <code>1'000'000<\/code> equals <code>1000000<\/code>. The separators do not change the value.<\/li><li>Suffixes on whole numbers: <code>L<\/code> long (<code>32L<\/code>), <code>LL<\/code> long long, <code>U<\/code> unsigned. <code>unsigned<\/code> alone means <code>unsigned int<\/code>.<\/li><\/ul><h4>The char type<\/h4><p><code>char<\/code> holds one character, stored as a small integer code (ASCII on most systems; <code>'A'<\/code> is 65, <code>'a'<\/code> is 97, <code>'0'<\/code> is 48). A <strong>character literal<\/strong> uses single quotes: <code>'A'<\/code>. A <strong>string literal<\/strong> uses double quotes: <code>\"A\"<\/code>. They are different: <code>\"A\"<\/code> is two bytes, the letter plus a hidden <strong>null terminator<\/strong> (<code>\\0<\/code>, code 0) that C++ stores at the end of every string literal, so <code>\"Dayton\"<\/code> occupies 7 bytes. A string literal cannot be stored in a <code>char<\/code>: <code>char c = \"Z\";<\/code> does not compile.<\/p><pre><code>char c = 'a';\nc = c + 2;            // c is now 'c'\ncout &lt;&lt; c &lt;&lt; endl;    // prints c<\/code><\/pre><p>Because <code>char<\/code> is a number, you can do arithmetic on it. <code>cout<\/code> prints a <code>char<\/code> as a character but an <code>int<\/code> as a number. Trap: <code>'ab'<\/code> is not a valid <code>char<\/code> literal (a <code>char<\/code> holds one character), and <code>'\\n'<\/code> is one character even though it is written with two symbols.<\/p>"}, {"id": "u2-l4", "title": "string, floating point, bool and sizeof", "book": "Sections 2.8 to 2.11, pages 54 to 61", "html": "<p>The <strong>string class<\/strong> needs <code>#include &lt;string&gt;<\/code>. A <code>string<\/code> object holds text of any length: <code>string city = \"Dayton\";<\/code>. Useful members: <code>city.length()<\/code> (6), <code>city[0]<\/code> (<code>'D'<\/code>, indexes start at 0), and <code>+<\/code> to <strong>concatenate<\/strong>: <code>city + \", OH\"<\/code>. Trap: you cannot add two string literals (<code>\"a\" + \"b\"<\/code> fails); at least one side must be a <code>string<\/code> object.<\/p><h4>Floating point<\/h4><p><code>float<\/code>, <code>double<\/code> and <code>long double<\/code> store numbers with fractional parts, in increasing precision and range. <code>double<\/code> is the default for literals like <code>3.14<\/code>; <code>3.14f<\/code> (or <code>F<\/code>) is a <code>float<\/code> and <code>3.14L<\/code> a <code>long double<\/code>. There are <strong>no unsigned floating-point types<\/strong>. <strong>E notation<\/strong> writes a power of ten: <code>3.2E4<\/code> is 32000 and <code>2.5e-2<\/code> is 0.025. The part before the E is the <strong>mantissa<\/strong>; the part after is the power of 10. To convert, move the point until one digit is left of it: 0.0072 is <code>7.2E-3<\/code>. By default <code>cout<\/code> shows at most 6 significant digits and drops trailing zeros, so <code>5.0<\/code> prints <code>5<\/code>.<\/p><h4>bool<\/h4><p><code>bool<\/code> holds <code>true<\/code> or <code>false<\/code>; an expression whose value is true or false is a <strong>Boolean expression<\/strong>. Internally true is 1 and false is 0, and <code>cout<\/code> prints them as 1 and 0. Any non-zero value stored in a <code>bool<\/code> becomes true: <code>bool f = 5;<\/code> stores 1.<\/p><h4>sizeof<\/h4><p><code>sizeof<\/code> is an operator giving the number of bytes a type or variable occupies, for example <code>sizeof(int)<\/code>. Sizes vary between systems, so never assume a fixed answer. Only the ordering rules above are guaranteed.<\/p><table><thead><tr><th>Type<\/th><th>Holds<\/th><\/tr><\/thead><tbody><tr><td><code>int<\/code><\/td><td>whole number<\/td><\/tr><tr><td><code>double<\/code><\/td><td>fractional number, about 15 digits<\/td><\/tr><tr><td><code>char<\/code><\/td><td>one character<\/td><\/tr><tr><td><code>string<\/code><\/td><td>text (library class)<\/td><\/tr><tr><td><code>bool<\/code><\/td><td>true or false<\/td><\/tr><\/tbody><\/table>"}, {"id": "u2-l5", "title": "Initialization, scope and arithmetic", "book": "Sections 2.12 to 2.14, pages 61 to 72", "html": "<p>You can <strong>initialize<\/strong> a variable when defining it: <code>int n = 4;<\/code>, <code>int n(4);<\/code> or, in C++11 and later, <strong>brace initialization<\/strong> <code>int n{4};<\/code>. Brace initialization rejects <strong>narrowing<\/strong>: <code>int n{9.99};<\/code> is an error, whereas <code>int n = 9.99;<\/code> compiles and stores 9 (the fraction is truncated, not rounded). <code>auto<\/code> lets the compiler deduce the type from the initializer: <code>auto r = 5.0 / 2;<\/code> makes <code>r<\/code> a <code>double<\/code>. A value assigned in a chain, <code>a = b = 7;<\/code>, is evaluated right to left. In <code>int w = 8, h, d = 3;<\/code> only <code>w<\/code> and <code>d<\/code> are initialized: each initializer belongs to one name. The left operand of <code>=<\/code> must be an <strong>lvalue<\/strong> (it names a memory location that can change, usually a variable); the right side is an <strong>rvalue<\/strong>, any expression that has a value.<\/p><h4>Scope<\/h4><p>A variable's <strong>scope<\/strong> is the part of the program where its name is visible: from its definition to the closing brace of the block that holds it. Using a variable on a line <strong>before<\/strong> its definition is a compile error, because the compiler reads top to bottom. A variable defined in <code>main<\/code> cannot be seen in another function. An inner block may define a name that <strong>shadows<\/strong> an outer one; the inner one wins inside its braces.<\/p><pre><code>int x = 1;\n{\n    int x = 2;\n    cout &lt;&lt; x &lt;&lt; \" \";   // 2\n}\ncout &lt;&lt; x;              // 1<\/code><\/pre><h4>Arithmetic<\/h4><p>The values an operator works on are its <strong>operands<\/strong>. A <strong>unary<\/strong> operator takes one (negation, <code>-x<\/code>), a <strong>binary<\/strong> operator two (<code>+<\/code>, <code>=<\/code>), and C++ has one <strong>ternary<\/strong> operator, taking three (Chapter 4).<\/p><table><thead><tr><th>Operator<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>+  -  *<\/code><\/td><td>add, subtract, multiply<\/td><\/tr><tr><td><code>/<\/code><\/td><td>divide<\/td><\/tr><tr><td><code>%<\/code><\/td><td>remainder (integers only)<\/td><\/tr><\/tbody><\/table><ul><li>If <strong>both operands are integers<\/strong>, <code>/<\/code> discards the fraction: <code>17 / 5<\/code> is 3, and <code>7 / 2<\/code> is 3 even when stored in a <code>double<\/code>. Make one operand floating point (<code>7 / 2.0<\/code>) to get 3.5.<\/li><li><code>17 % 5<\/code> is 2. <code>%<\/code> does not compile with a <co
